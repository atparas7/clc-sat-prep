Baz.\"", "A": "Because the plural verb \"are\" doesn\u2019t agree in number with the singular subject \"Farouk El-Baz.\"", "C": "Because the plural verb \"have been\" doesn\u2019t agree in number with the singular subject \"Farouk El-Baz.\"", "D": "Because the plural verb \"were\" doesn\u2019t agree in number with the singular subject \"Farouk El-Baz.\""}}, {"question": "\u201cHe was just the man for such a place, and it was just the place for such a man.\u201d This line is from Frederick Douglass\u2019s autobiography Narrative of the Life of Frederick Douglass (1845). It\u2019s an example of antimetabole, a writing technique that ______ emphasis by repeating a statement in a reversed order.<br><br><b>Which choice completes the text so that it conforms to the conventions of Standard English?</b>", "choices": {"A": "create", "B": "are creating", "C": "have created", "D": "creates"}, "correct": "D", "difficulty": "Easy", "skill": "Subject-Verb Agreement", "domain": "Standard English Conventions", "tags": [], "rule": "The convention being tested is subject-verb agreement. The singular verb \"creates\" agrees in number with the singular subject \"technique.\"", "tip": "Find the true subject by mentally crossing out any phrase that sits between the subject and the verb, then check that the verb matches that subject in number.", "trap": "Because the plural verb \"create\" doesn\u2019t agree in number with the singular subject \"technique.\"", "poe": {"D": "The convention being tested is subject-verb agreement. The singular verb \"creates\" agrees in number with the singular subject \"technique.\"", "A": "Because the plural verb \"create\" doesn\u2019t agree in number with the singular subject \"technique.\"", "B": "Because the plural verb \"are creating\" doesn\u2019t agree in number with the singular subject \"technique.\"", "C": "Because the plural verb \"have created\" doesn\u2019t agree in number with the singular subject \"technique.\""}}, {"question": "Obsidian is a nt perfect verb \u201chave learned\u201d doesn\u2019t indicate that the subject is going to learn about obsidian\u2019s structure in the future."}}, {"question": "What is the correct pronunciation of Kiribati? In the Gilbertese language spoken by residents of the island nation, the letter combination -ti makes the -s sound; as a result, the country\u2019s name ______ pronounced \u201cKiribas.\u201d<br><br><b>Which choice completes the text so that it conforms to the conventions of Standard English?</b>", "choices": {"A": "are", "B": "have been", "C": "are being", "D": "is"}, "correct": "D", "difficulty": "Easy", "skill": "Subject-Verb Agreement", "domain": "Standard English Conventions", "tags": [], "rule": "The convention being tested is subject-verb agreement. The singular verb \"is\" agrees in number with the singular subject \"the country\u2019s name.\"", "tip": "Find the true subject by mentally crossing out any phrase that sits between the subject and the verb, then check that the verb matches that subject in number.", "trap": "Because the plural verb \"are\" doesn\u2019t agree in number with the singular subject \"the country\u2019s name.\"", "poe": {"D": "The convention being tested is subject-verb agreement. The singular verb \"is\" agrees in number with the singular subject \"the country\u2019s name.\"", "A": "Because the plural verb \"are\" doesn\u2019t agree in number with the singular subject \"the country\u2019s name.\"", "B": "Because the plural verb \"have been\" doesn\u2019t agree in number with the singular subject \"the country\u2019s name.\"", "C": "Because the plural verb \"are being\" doesn\u2019t agree in number with the singular subject \"the country\u2019s name.\""}}, {"question": "To survive when water is scarce, embryos inside African turquoise killifish eggs ______ a dormant state known as diapause. In this state, embryonic development is paused for as long as two years\u2014longer than the life span of an adult killifish.<br><br><b>Which choice completes the text so that it conforms to the conventions of Standard English?</b>", "choices": {"A": "enter", "B": "to enter", "C": "having entered", "D": "entering"}, "correct": "A", "difficulty": "Easy", "skill": "Subject-Verb Agreement", "domain": "Standard English Conventions", "tags": [], "rule": "The convention being tested is finite and nonfinite verb forms within a sentence. A main clause requires a finite verb to perform the action of the subject (in this case, \u201cembryos\u201d), and this choice supplies the clause with the finite present tense verb \u201center\u201d to indicate how the embryos achieve diapause.", "tip": "Find the true subject by mentally crossing out any phrase that sits between the subject and the verb, then check that the verb matches that subject in number.", "trap": "Because the nonfinite to-infinitive \u201cto enter\u201d doesn\u2019t supply the main clause with a finite verb.", "poe": {"A": "The convention being tested is finite and nonfinite verb forms within a sentence. A main clause requires a finite verb to perform the action of the subject (in this case, \u201cembryos\u201d), and this choice supplies the clause with the finite present tense verb \u201center\u201d to indicate how the embryos achieve diapause.", "B": "Because the nonfinite to-infinitive \u201cto enter\u201d doesn\u2019t supply the main clause with a finite verb.", "C": "Because the nonfinite participle \u201chaving entered\u201d doesn\u2019t supply the main clause with a finite verb.", "D": "Because the nonfinite participle \u201centering\u201d doesn\u2019t supply the main clause with a finite verb."}}, {"question": "According to the traditional RYB (red-yellow-blue) color model, yellow is a complementary color to purple. However, yellow ______ considered complementary to blue in modern color theory.<br><br><b>Which choice completes the text so that it conforms to the conventions of Standard English?</b>", "choices": {"A": "is", "B": "having been", "C": "to be", "D": "being"}, "correct": "A", "difficulty": "Easy", "skill": "Subject-Verb Agreement", "domain": "Standard English Conventions", "tags": [], "rule": "The convention being tested is the use of verb forms within a sentence. A main clause requires a finite (tensed) verb to perform the action of the subject (in this case, \"yellow\"), and this choice supplies the present tense verb \"is considered\" to indicate that yellow is considered a complementary color to blue in modern color theory.", "tip": "Find the true subject by mentally crossing out any phrase that sits between the subject and the verb, then check that the verb matches that subject in number.", "trap": "Because it results in an ungrammatical sentence. The nonfinite participle \"having been considered\" doesn\u2019t supply the main clause with a finite verb.", "poe": {"A": "The convention being tested is the use of verb forms within a sentence. A main clause requires a finite (tensed) verb to perform the action of the subject (in this case, \"yellow\"), and this choice supplies the present tense verb \"is considered\" to indicate that yellow is considered a complementary color to blue in modern color theory.", "B": "Because it results in an ungrammatical sentence. The nonfinite participle \"having been considered\" doesn\u2019t supply the main clause with a finite verb.", "C": "Because it results in an ungrammatical sentence. The nonfinite to-infinitive \"to be considered\" doesn\u2019t supply the main clause with a finite verb.", "D": "Because it results in an ungrammatical sentence. The nonfinite participle \"being considered\" doesn\u2019t supply the main clause with a finite verb."}}]};

const STATE = { idx:0, answers:{}, submitted:false, minutesChosen:0, secondsLeft:0, timerId:null };

function $(sel){ return document.querySelector(sel); }
function $all(sel){ return document.querySelectorAll(sel); }

function currentQuestions(){ return TEST.questions; }

document.addEventListener('DOMContentLoaded', function(){

  function initIntro(){
    $('#intro-title').textContent = TEST.label;
    $('#intro-subtitle').textContent = TEST.description || '';
    $('#intro-count').textContent = TEST.questions.length + ' questions. Choose your timing, then click Start when you\'re ready.';
    const standard = Math.round(TEST.questions.length * 1.5);
    const extended = Math.round(standard * 1.25);
    $('#timing-options').innerHTML =
      '<div class="timing-card selected" data-minutes="' + standard + '"><h3>Standard Time</h3><div class="mins">' + standard + ' min</div></div>' +
      '<div class="timing-card" data-minutes="' + extended + '"><h3>Extended Time (+25%)</h3><div class="mins">' + extended + ' min</div></div>';
    STATE.minutesChosen = standard;
    $all('.timing-card').forEach(card=>{
      card.addEventListener('click', ()=>{
        $all('.timing-card').forEach(c=>c.classList.remove('selected'));
        card.classList.add('selected');
        STATE.minutesChosen = parseFloat(card.dataset.minutes);
      });
    });
  }

  initIntro();

  $('.start-btn').addEventListener('click', function(){
    $('#intro-screen').classList.add('hidden');
    $('#test-screen').classList.remove('hidden');
    buildNav();
    renderQuestion();
    startTimer();
  });

  function startTimer(){
    STATE.secondsLeft = Math.round(STATE.minutesChosen*60);
    updateTimerDisplay();
    STATE.timerId = setInterval(()=>{
      STATE.secondsLeft--;
      updateTimerDisplay();
      if(STATE.secondsLeft<=0){
        clearInterval(STATE.timerId);
        STATE.submitted = true;
        showResults();
      }
    }, 1000);
  }
  function updateTimerDisplay(){
    const m = Math.floor(STATE.secondsLeft/60);
    const s = STATE.secondsLeft%60;
    const box = $('#timer-box');
    if(!box) return;
    box.textContent = 'Time Remaining: ' + m + ':' + (s<10?'0':'')+s;
    box.classList.toggle('low-time', STATE.secondsLeft <= 120);
  }

  function buildNav(){
    const nav = $('#nav-grid');
    nav.innerHTML = '';
    currentQuestions().forEach((q,i)=>{
      const btn = document.createElement('button');
      btn.className = 'nav-btn';
      btn.textContent = (i+1);
      btn.addEventListener('click', ()=>{ STATE.idx = i; renderQuestion(); });
      nav.appendChild(btn);
    });
  }

  function renderQuestion(){
    const q = currentQuestions()[STATE.idx];
    $('#q-text').innerHTML = q.question.replace(/\n/g,'<br>');
    const choicesEl = $('#choices');
    choicesEl.innerHTML = '';
    ['A','B','C','D'].forEach(letter=>{
      if(!q.choices[letter]) return;
      const row = document.createElement('div');
      row.className = 'choice-row' + (STATE.answers[STATE.idx]===letter ? ' selected':'');
      row.innerHTML = '<span class="choice-letter">'+letter+'</span><span class="choice-text"></span>';
      row.querySelector('.choice-text').textContent = q.choices[letter];
      row.addEventListener('click', ()=>{
        STATE.answers[STATE.idx] = letter;
        renderQuestion();
      });
      choicesEl.appendChild(row);
    });
    updateNav();
    $('#q-counter').textContent = 'Question ' + (STATE.idx+1) + ' of ' + currentQuestions().length;
  }

  function updateNav(){
    $all('.nav-btn').forEach((btn,i)=>{
      btn.classList.toggle('current', i===STATE.idx);
      btn.classList.toggle('answered', STATE.answers[i] !== undefined);
    });
  }

  $('#prev-btn').addEventListener('click', ()=>{
    if(STATE.idx>0){ STATE.idx--; renderQuestion(); }
  });
  $('#next-btn').addEventListener('click', ()=>{
    if(STATE.idx<currentQuestions().length-1){ STATE.idx++; renderQuestion(); }
  });

  $('#submit-btn').addEventListener('click', ()=>{
    $('#confirm-box').classList.remove('hidden');
  });
  $('#cancel-submit').addEventListener('click', ()=>{
    $('#confirm-box').classList.add('hidden');
  });
  $('#confirm-submit').addEventListener('click', ()=>{
    $('#confirm-box').classList.add('hidden');
    if(STATE.timerId) clearInterval(STATE.timerId);
    STATE.submitted = true;
    showResults();
  });

  function showResults(){
    $('#test-screen').classList.add('hidden');
    $('#results-screen').classList.remove('hidden');
    $('#print-btn').classList.remove('hidden');
    const qs = currentQuestions();
    let correctCount = 0;
    qs.forEach((q,i)=>{ if(STATE.answers[i]===q.correct) correctCount++; });
    $('.score-big').textContent = correctCount + ' / ' + qs.length;
    $('#results-title').textContent = TEST.label + ' \u2014 Results';

    const container = $('#review-container');
    container.innerHTML = '';
    qs.forEach((q,i)=>{
      const userAns = STATE.answers[i];
      const isCorrect = userAns === q.correct;
      const card = document.createElement('div');
      card.className = 'review-card ' + (isCorrect ? 'correct':'incorrect');

      let html = '<div class="review-q"></div><div class="review-choices"></div>';
      html += '<div class="review-section"><div class="review-section-label">Rule</div><div class="review-rule"></div></div>';
      html += '<div class="review-section"><div class="review-section-label">Tip</div><div class="review-tip"></div></div>';
      if (q.trap) {
        html += '<div class="review-section"><div class="review-section-label">Trap</div><div class="review-trap"></div></div>';
      }
      html += '<div class="review-section"><div class="review-section-label">Process of Elimination</div><ul class="review-poe-list"></ul></div>';
      card.innerHTML = html;

      card.querySelector('.review-q').textContent = 'Question ' + (i+1) + ': ' + q.question.replace(/<[^>]+>/g,' ');
      const choicesDiv = card.querySelector('.review-choices');
      ['A','B','C','D'].forEach(letter=>{
        if(!q.choices[letter]) return;
        const row = document.createElement('div');
        row.className = 'review-choice' +
          (letter===q.correct ? ' right-answer' : '') +
          (letter===userAns && letter!==q.correct ? ' user-wrong' : '');
        row.innerHTML = '<span>'+letter+'.</span><span></span>';
        row.querySelectorAll('span')[1].textContent = q.choices[letter];
        choicesDiv.appendChild(row);
      });

      card.querySelector('.review-rule').textContent = q.rule || '';
      card.querySelector('.review-tip').textContent = q.tip || '';
      if (q.trap) card.querySelector('.review-trap').textContent = q.trap;

      const poeList = card.querySelector('.review-poe-list');
      ['A','B','C','D'].forEach(letter=>{
        if(!q.poe || !q.poe[letter]) return;
        const li = document.createElement('li');
        li.textContent = letter + '. ' + q.poe[letter];
        if (letter === q.correct) li.classList.add('correct-letter');
        poeList.appendChild(li);
      });

      container.appendChild(card);
    });
  }

  $('#print-btn').addEventListener('click', ()=> window.print());
});
})();
</script>

</body>
</html>
