const STATE = { idx:0, answers:{}, submitted:false, minutesChosen:0, secondsLeft:0, timerId:null };

function $(sel){ return document.querySelector(sel); }
function $all(sel){ return document.querySelectorAll(sel); }

function currentQuestions(){ return TEST.questions; }

document.addEventListener('DOMContentLoaded', function(){

  function initIntro(){
    $('#intro-title').textContent = TEST.label;
    $('#intro-subtitle').textContent = TEST.description || '';
    $('#intro-count').textContent = TEST.questions.length + ' questions. Choose your timing, then click Start when you\'re ready.';
    const standard = Math.round(TEST.questions.length * 1.5);
    const extended = Math.round(standard * 1.25);
    $('#timing-options').innerHTML =
      '<div class="timing-card selected" data-minutes="' + standard + '"><h3>Standard Time</h3><div class="mins">' + standard + ' min</div></div>' +
      '<div class="timing-card" data-minutes="' + extended + '"><h3>Extended Time (+25%)</h3><div class="mins">' + extended + ' min</div></div>';
    STATE.minutesChosen = standard;
    $all('.timing-card').forEach(card=>{
      card.addEventListener('click', ()=>{
        $all('.timing-card').forEach(c=>c.classList.remove('selected'));
        card.classList.add('selected');
        STATE.minutesChosen = parseFloat(card.dataset.minutes);
      });
    });
  }

  initIntro();

  $('.start-btn').addEventListener('click', function(){
    $('#intro-screen').classList.add('hidden');
    $('#test-screen').classList.remove('hidden');
    buildNav();
    renderQuestion();
    startTimer();
  });

  function startTimer(){
    STATE.secondsLeft = Math.round(STATE.minutesChosen*60);
    updateTimerDisplay();
    STATE.timerId = setInterval(()=>{
      STATE.secondsLeft--;
      updateTimerDisplay();
      if(STATE.secondsLeft<=0){
        clearInterval(STATE.timerId);
        STATE.submitted = true;
        showResults();
      }
    }, 1000);
  }
  function updateTimerDisplay(){
    const m = Math.floor(STATE.secondsLeft/60);
    const s = STATE.secondsLeft%60;
    const box = $('#timer-box');
    if(!box) return;
    box.textContent = 'Time Remaining: ' + m + ':' + (s<10?'0':'')+s;
    box.classList.toggle('low-time', STATE.secondsLeft <= 120);
  }

  function buildNav(){
    const nav = $('#nav-grid');
    nav.innerHTML = '';
    currentQuestions().forEach((q,i)=>{
      const btn = document.createElement('button');
      btn.className = 'nav-btn';
      btn.textContent = (i+1);
      btn.addEventListener('click', ()=>{ STATE.idx = i; renderQuestion(); });
      nav.appendChild(btn);
    });
  }

  function renderQuestion(){
    const q = currentQuestions()[STATE.idx];
    $('#q-text').innerHTML = q.question.replace(/\n/g,'<br>');
    const choicesEl = $('#choices');
    choicesEl.innerHTML = '';
    ['A','B','C','D'].forEach(letter=>{
      if(!q.choices[letter]) return;
      const row = document.createElement('div');
      row.className = 'choice-row' + (STATE.answers[STATE.idx]===letter ? ' selected':'');
      row.innerHTML = '<span class="choice-letter">'+letter+'</span><span class="choice-text"></span>';
      row.querySelector('.choice-text').textContent = q.choices[letter];
      row.addEventListener('click', ()=>{
        STATE.answers[STATE.idx] = letter;
        renderQuestion();
      });
      choicesEl.appendChild(row);
    });
    updateNav();
    $('#q-counter').textContent = 'Question ' + (STATE.idx+1) + ' of ' + currentQuestions().length;
  }

  function updateNav(){
    $all('.nav-btn').forEach((btn,i)=>{
      btn.classList.toggle('current', i===STATE.idx);
      btn.classList.toggle('answered', STATE.answers[i] !== undefined);
    });
  }

  $('#prev-btn').addEventListener('click', ()=>{
    if(STATE.idx>0){ STATE.idx--; renderQuestion(); }
  });
  $('#next-btn').addEventListener('click', ()=>{
    if(STATE.idx<currentQuestions().length-1){ STATE.idx++; renderQuestion(); }
  });

  $('#submit-btn').addEventListener('click', ()=>{
    $('#confirm-box').classList.remove('hidden');
  });
  $('#cancel-submit').addEventListener('click', ()=>{
    $('#confirm-box').classList.add('hidden');
  });
  $('#confirm-submit').addEventListener('click', ()=>{
    $('#confirm-box').classList.add('hidden');
    if(STATE.timerId) clearInterval(STATE.timerId);
    STATE.submitted = true;
    showResults();
  });

  function showResults(){
    $('#test-screen').classList.add('hidden');
    $('#results-screen').classList.remove('hidden');
    $('#print-btn').classList.remove('hidden');
    const qs = currentQuestions();
    let correctCount = 0;
    qs.forEach((q,i)=>{ if(STATE.answers[i]===q.correct) correctCount++; });
    $('.score-big').textContent = correctCount + ' / ' + qs.length;
    $('#results-title').textContent = TEST.label + ' \u2014 Results';

    const container = $('#review-container');
    container.innerHTML = '';
    qs.forEach((q,i)=>{
      const userAns = STATE.answers[i];
      const isCorrect = userAns === q.correct;
      const card = document.createElement('div');
      card.className = 'review-card ' + (isCorrect ? 'correct':'incorrect');

      let html = '<div class="review-q"></div><div class="review-choices"></div>';
      html += '<div class="review-section"><div class="review-section-label">Rule</div><div class="review-rule"></div></div>';
      html += '<div class="review-section"><div class="review-section-label">Tip</div><div class="review-tip"></div></div>';
      if (q.trap) {
        html += '<div class="review-section"><div class="review-section-label">Trap</div><div class="review-trap"></div></div>';
      }
      html += '<div class="review-section"><div class="review-section-label">Process of Elimination</div><ul class="review-poe-list"></ul></div>';
      card.innerHTML = html;

      card.querySelector('.review-q').textContent = 'Question ' + (i+1) + ': ' + q.question.replace(/<[^>]+>/g,' ');
      const choicesDiv = card.querySelector('.review-choices');
      ['A','B','C','D'].forEach(letter=>{
        if(!q.choices[letter]) return;
        const row = document.createElement('div');
        row.className = 'review-choice' +
          (letter===q.correct ? ' right-answer' : '') +
          (letter===userAns && letter!==q.correct ? ' user-wrong' : '');
        row.innerHTML = '<span>'+letter+'.</span><span></span>';
        row.querySelectorAll('span')[1].textContent = q.choices[letter];
        choicesDiv.appendChild(row);
      });

      card.querySelector('.review-rule').textContent = q.rule || '';
      card.querySelector('.review-tip').textContent = q.tip || '';
      if (q.trap) card.querySelector('.review-trap').textContent = q.trap;

      const poeList = card.querySelector('.review-poe-list');
      ['A','B','C','D'].forEach(letter=>{
        if(!q.poe || !q.poe[letter]) return;
        const li = document.createElement('li');
        li.textContent = letter + '. ' + q.poe[letter];
        if (letter === q.correct) li.classList.add('correct-letter');
        poeList.appendChild(li);
      });

      container.appendChild(card);
    });
  }

  $('#print-btn').addEventListener('click', ()=> window.print());
});
})();
</script>

</body>
</html>
