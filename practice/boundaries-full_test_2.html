on following it, a comma can\u2019t be used in this way to join two main clauses."}}, {"question": "The Balkan nation of Bosnia and Herzegovina does not have one president but ______ as members of the office of the presidency, one representing the nation\u2019s Bosniaks, one its Serbs, and one its Croats, these elected officials take turns serving as the office\u2019s chairperson.<br><br><b>Which choice completes the text so that it conforms to the conventions of Standard English?</b>", "choices": {"A": "three, known", "B": "three. Known", "C": "three who are known", "D": "three, who are known"}, "correct": "B", "difficulty": "Hard", "skill": "Run-ons & Comma Splices", "domain": "Standard English Conventions", "tags": [], "rule": "The convention being tested is punctuation use between sentences. In this choice, the period is used correctly to mark the boundary between one sentence (\u201cThe Balkan...three\u201d) and another (\u201cKnown...chairperson\u201d). While the supplementary element (\u201cknown...Croats\u201d) could logically be attached to either the first main clause (\u201cThe Balkan...three\u201d) or the second main clause (\u201cthese elected...chairperson\u201d), end-of-sentence punctuation is needed to indicate to which sentence the supplementary element belongs.", "tip": "If two complete sentences are joined with only a comma or with no punctuation at all, that is an error \u2014 fix it with a period, a semicolon, or a comma plus a FANBOYS word.", "trap": "Because it results in a comma splice. In this choice, the first sentence, consisting of a main clause (\u201cThe Balkan...three\u201d) and supplementary element (\u201cknown...Croats\u201d), is incorrectly joined with a second main clause (\u201cthese elected...chairperson\u201d) using a comma. A comma can\u2019t be used in this way to join two sentences.", "poe": {"B": "The convention being tested is punctuation use between sentences. In this choice, the period is used correctly to mark the boundary between one sentence (\u201cThe Balkan...three\u201d) and another (\u201cKnown...chairperson\u201d). While the supplementary element (\u201cknown...Croats\u201d) could logically be attached to either the first main clause (\u201cThe Balkan...three\u201d) or the second main clause (\u201cthese elected...chairperson\u201d), end-of-sentence punctuation is needed to indicate to which sentence the supplementary element belongs.", "A": "Because it results in a comma splice. In this choice, the first sentence, consisting of a main clause (\u201cThe Balkan...three\u201d) and supplementary element (\u201cknown...Croats\u201d), is incorrectly joined with a second main clause (\u201cthese elected...chairperson\u201d) using a comma. A comma can\u2019t be used in this way to join two sentences.", "C": "Because it results in a comma splice. In this choice, the first sentence, consisting of a main clause (\u201cThe Balkan...three\u201d) and a relative clause (\u201cwho are...Croats\u201d), is incorrectly joined with a second main clause (\u201cthese elected...chairperson\u201d) using a comma. A comma can\u2019t be used in this way to join two sentences. Additionally, this choice omits the comma needed after \u201cthree\u201d to mark the beginning of the supplementary relative clause (\u201cwho are known...Croats\u201d).", "D": "Because it results in a comma splice. In this choice, the first sentence, consisting of a main clause (\u201cThe Balkan...three\u201d) and a supplementary relative clause (\u201cwho are...Croats\u201d), is incorrectly joined with a second main clause (\u201cthese elected...chairperson\u201d) using a comma. A comma can\u2019t be used in this way to join two sentences."}}, {"question": "Winding through the ice atop Norway\u2019s Jotunheim Mountains is the Lendbreen pass, an ancient route that was used by hunters, farmers, traders, and travelers in the Middle Ages before eventually falling into disuse. Recently, archeologists have ______ knives, horseshoes, wool tunics, and thousands of other artifacts from the icy pass.<br><br><b>Which choice completes the text so that it conforms to the conventions of Standard English?</b>", "choices": {"A": "unearthed:", "B": "unearthed,", "C": "unearthed\u2014", "D": "unearthed"}, "correct": "D", "difficulty": "Hard", "skill": "Colon", "domain": "Standard English Conventions", "tags": [], "rule": "No punctuation should separate the verb \"unearthed\" and its objects (i.e, what was \"unearthed\"): \"knives, horseshoes, wool tunics, and thousands of other artifacts.\"", "tip": "Cover everything after the colon \u2014 what remains before it must be a complete, independent sentence.", "trap": "This choice creates a punctuation error, separating the verb \"unearthed\" from its objects (i.e, what was \"unearthed\") with a colon.", "poe": {"D": "No punctuation should separate the verb \"unearthed\" and its objects (i.e, what was \"unearthed\"): \"knives, horseshoes, wool tunics, and thousands of other artifacts.\"", "A": "This choice creates a punctuation error, separating the verb \"unearthed\" from its objects (i.e, what was \"unearthed\") with a colon.", "B": "This choice creates a punctuation error, separating the verb \"unearthed\" from its objects (i.e, what was \"unearthed\") with a comma.", "C": "This choice creates a punctuation error, separating the verb \"unearthed\" from its objects (i.e, what was \"unearthed\") with a dash."}}, {"question": "In her large-scale sculpture Casa-Isla, artist Edra Soto included references to her childhood in Puerto Rico. For example, the sculpture\u2019s steel panels have a crisscrossing pattern inspired by the iron gates ______<br><br><b>Which choice completes the text so that it conforms to the conventions of Standard English?</b>", "choices": {"A": "Soto would see in her neighborhood?", "B": "Soto would see in her neighborhood.", "C": "would Soto see in her neighborhood.", "D": "would Soto see in her neighborhood?"}, "correct": "B", "difficulty": "Medium", "skill": "Comma", "domain": "Standard English Conventions", "tags": [], "rule": "The convention being tested is end-of-sentence punctuation. This choice correctly uses a period to punctuate a declarative sentence (\"For example...neighborhood\").", "tip": "Test non-essential phrases by removing them: if the sentence still makes complete sense, commas belong on both sides.", "trap": "It\u2019s unconventional to use a question mark in this way to punctuate a declarative sentence.", "poe": {"B": "The convention being tested is end-of-sentence punctuation. This choice correctly uses a period to punctuate a declarative sentence (\"For example...neighborhood\").", "A": "It\u2019s unconventional to use a question mark in this way to punctuate a declarative sentence.", "C": "The structure requires a declarative clause at the end of the sentence that states where Soto saw the steel panels, not an incomplete interrogative clause that asks a direct question, such as \"would Soto see in her neighborhood.\"", "D": "The structure requires a period and a declarative clause at the end of the sentence that states where Soto saw the steel panels, not an incomplete interrogative clause asking a direct question, such as \"would Soto see in her neighborhood?\""}}, {"question": "To illustrate Albert Einstein\u2019s special theory of relativity, picture two jugglers: one juggling on a steadily moving parade float, the other juggling while standing still on a sidewalk. The laws of physics are identical for both ______ motion relative to each other. But what, Einstein wondered, about the speed of light?<br><br><b>Which choice completes the text so that it conforms to the conventions of Standard English?</b>", "choices": {"A": "jugglers\u2019, regardless of they\u2019re", "B": "jugglers, regardless of there", "C": "juggler\u2019s, regardless of their", "D": "jugglers, regardless of their"}, "correct": "D", "difficulty": "Medium", "skill": "Nouns & Apostrophes", "domain": "Stan ppropriate punctuation to separate the supplementary element from the rest of the sentence."}}, {"question": "Julia Alvarez\u2019s 1994 novel In the Time of the Butterflies, a fictionalized account of the lives of the Mirabal ______ can serve as a starting point for those wanting to explore how the rule of dictator Rafael Trujillohas been represented in Dominican American literature.<br><br><b>Which choice completes the text so that it conforms to the conventions of Standard English?</b>", "choices": {"A": "sisters, and", "B": "sisters and", "C": "sisters,", "D": "sisters"}, "correct": "C", "difficulty": "Hard", "skill": "Comma", "domain": "Standard English Conventions", "tags": [], "rule": "The convention being tested is the punctuation of a supplementary element within a sentence. The comma after \"sisters\" pairs with the comma after \"Butterflies\" to separate the supplementary element \"a fictionalized account of the lives of the Mirabal sisters\" from the rest of the sentence. This supplementary element functions to describe the novel In the Time of the Butterflies, and the pair of commas indicates that this element could be removed without affecting the grammatical coherence of the sentence.", "tip": "Test non-essential phrases by removing them: if the sentence still makes complete sense, commas belong on both sides.", "trap": "Because a comma and conjunction can\u2019t be used in this way to separate the supplementary element from the rest of the sentence.", "poe": {"C": "The convention being tested is the punctuation of a supplementary element within a sentence. The comma after \"sisters\" pairs with the comma after \"Butterflies\" to separate the supplementary element \"a fictionalized account of the lives of the Mirabal sisters\" from the rest of the sentence. This supplementary element functions to describe the novel In the Time of the Butterflies, and the pair of commas indicates that this element could be removed without affecting the grammatical coherence of the sentence.", "A": "Because a comma and conjunction can\u2019t be used in this way to separate the supplementary element from the rest of the sentence.", "B": "Because it fails to use appropriate punctuation to separate the supplementary element from the rest of the sentence.", "D": "Because it fails to use appropriate punctuation to separate the supplementary element from the rest of the sentence."}}, {"question": "While constructing the Limyra Bridge, ancient Roman builders relied on temporary wooden beams to support the stone and brick structure. These temporary supports, a construction system known as ______ were removed when the bridge was completed.<br><br><b>Which choice completes the text so that it conforms to the conventions of Standard English?</b>", "choices": {"A": "falsework;", "B": "falsework", "C": "falsework,", "D": "falsework:"}, "correct": "C", "difficulty": "Medium", "skill": "Semicolon", "domain": "Standard English Conventions", "tags": [], "rule": "The convention being tested is the use of punctuation within a sentence. The comma after \"falsework\" pairs with the comma after \"supports\" to separate the supplementary element \"a construction system known as falsework\" from the rest of the sentence. This supplementary element functions to clarify the term \"these temporary supports,\" and the pair of commas indicates that this element could be removed without affecting the grammatical coherence of the sentence.", "tip": "Check both sides of the punctuation mark: could each one stand alone as its own complete sentence? If yes, a semicolon can work.", "trap": "Because a semicolon can\u2019t be paired with a comma in this way to separate the supplementary element from the rest of the sentence.", "poe": {"C": "The convention being tested is the use of punctuation within a sentence. The comma after \"falsework\" pairs with the comma after \"supports\" to separate the supplementary element \"a construction system known as falsework\" from const STATE = { idx:0, answers:{}, submitted:false, minutesChosen:0, secondsLeft:0, timerId:null };

function $(sel){ return document.querySelector(sel); }
function $all(sel){ return document.querySelectorAll(sel); }

function currentQuestions(){ return TEST.questions; }

document.addEventListener('DOMContentLoaded', function(){

  function initIntro(){
    $('#intro-title').textContent = TEST.label;
    $('#intro-subtitle').textContent = TEST.description || '';
    $('#intro-count').textContent = TEST.questions.length + ' questions. Choose your timing, then click Start when you\'re ready.';
    const standard = Math.round(TEST.questions.length * 1.5);
    const extended = Math.round(standard * 1.25);
    $('#timing-options').innerHTML =
      '<div class="timing-card selected" data-minutes="' + standard + '"><h3>Standard Time</h3><div class="mins">' + standard + ' min</div></div>' +
      '<div class="timing-card" data-minutes="' + extended + '"><h3>Extended Time (+25%)</h3><div class="mins">' + extended + ' min</div></div>';
    STATE.minutesChosen = standard;
    $all('.timing-card').forEach(card=>{
      card.addEventListener('click', ()=>{
        $all('.timing-card').forEach(c=>c.classList.remove('selected'));
        card.classList.add('selected');
        STATE.minutesChosen = parseFloat(card.dataset.minutes);
      });
    });
  }

  initIntro();

  $('.start-btn').addEventListener('click', function(){
    $('#intro-screen').classList.add('hidden');
    $('#test-screen').classList.remove('hidden');
    buildNav();
    renderQuestion();
    startTimer();
  });

  function startTimer(){
    STATE.secondsLeft = Math.round(STATE.minutesChosen*60);
    updateTimerDisplay();
    STATE.timerId = setInterval(()=>{
      STATE.secondsLeft--;
      updateTimerDisplay();
      if(STATE.secondsLeft<=0){
        clearInterval(STATE.timerId);
        STATE.submitted = true;
        showResults();
      }
    }, 1000);
  }
  function updateTimerDisplay(){
    const m = Math.floor(STATE.secondsLeft/60);
    const s = STATE.secondsLeft%60;
    const box = $('#timer-box');
    if(!box) return;
    box.textContent = 'Time Remaining: ' + m + ':' + (s<10?'0':'')+s;
    box.classList.toggle('low-time', STATE.secondsLeft <= 120);
  }

  function buildNav(){
    const nav = $('#nav-grid');
    nav.innerHTML = '';
    currentQuestions().forEach((q,i)=>{
      const btn = document.createElement('button');
      btn.className = 'nav-btn';
      btn.textContent = (i+1);
      btn.addEventListener('click', ()=>{ STATE.idx = i; renderQuestion(); });
      nav.appendChild(btn);
    });
  }

  function renderQuestion(){
    const q = currentQuestions()[STATE.idx];
    $('#q-text').innerHTML = q.question.replace(/\n/g,'<br>');
    const choicesEl = $('#choices');
    choicesEl.innerHTML = '';
    ['A','B','C','D'].forEach(letter=>{
      if(!q.choices[letter]) return;
      const row = document.createElement('div');
      row.className = 'choice-row' + (STATE.answers[STATE.idx]===letter ? ' selected':'');
      row.innerHTML = '<span class="choice-letter">'+letter+'</span><span class="choice-text"></span>';
      row.querySelector('.choice-text').textContent = q.choices[letter];
      row.addEventListener('click', ()=>{
        STATE.answers[STATE.idx] = letter;
        renderQuestion();
      });
      choicesEl.appendChild(row);
    });
    updateNav();
    $('#q-counter').textContent = 'Question ' + (STATE.idx+1) + ' of ' + currentQuestions().length;
  }

  function updateNav(){
    $all('.nav-btn').forEach((btn,i)=>{
      btn.classList.toggle('current', i===STATE.idx);
      btn.classList.toggle('answered', STATE.answers[i] !== undefined);
    });
  }

  $('#prev-btn').addEventListener('click', ()=>{
    if(STATE.idx>0){ STATE.idx--; renderQuestion(); }
  });
  $('#next-btn').addEventListener('click', ()=>{
    if(STATE.idx<currentQuestions().length-1){ STATE.idx++; renderQuestion(); }
  });

  $('#submit-btn').addEventListener('click', ()=>{
    $('#confirm-box').classList.remove('hidden');
  });
  $('#cancel-submit').addEventListener('click', ()=>{
    $('#confirm-box').classList.add('hidden');
  });
  $('#confirm-submit').addEventListener('click', ()=>{
    $('#confirm-box').classList.add('hidden');
    if(STATE.timerId) clearInterval(STATE.timerId);
    STATE.submitted = true;
    showResults();
  });

  function showResults(){
    $('#test-screen').classList.add('hidden');
    $('#results-screen').classList.remove('hidden');
    $('#print-btn').classList.remove('hidden');
    const qs = currentQuestions();
    let correctCount = 0;
    qs.forEach((q,i)=>{ if(STATE.answers[i]===q.correct) correctCount++; });
    $('.score-big').textContent = correctCount + ' / ' + qs.length;
    $('#results-title').textContent = TEST.label + ' \u2014 Results';

    const container = $('#review-container');
    container.innerHTML = '';
    qs.forEach((q,i)=>{
      const userAns = STATE.answers[i];
      const isCorrect = userAns === q.correct;
      const card = document.createElement('div');
      card.className = 'review-card ' + (isCorrect ? 'correct':'incorrect');

      let html = '<div class="review-q"></div><div class="review-choices"></div>';
      html += '<div class="review-section"><div class="review-section-label">Rule</div><div class="review-rule"></div></div>';
      html += '<div class="review-section"><div class="review-section-label">Tip</div><div class="review-tip"></div></div>';
      if (q.trap) {
        html += '<div class="review-section"><div class="review-section-label">Trap</div><div class="review-trap"></div></div>';
      }
      html += '<div class="review-section"><div class="review-section-label">Process of Elimination</div><ul class="review-poe-list"></ul></div>';
      card.innerHTML = html;

      card.querySelector('.review-q').textContent = 'Question ' + (i+1) + ': ' + q.question.replace(/<[^>]+>/g,' ');
      const choicesDiv = card.querySelector('.review-choices');
      ['A','B','C','D'].forEach(letter=>{
        if(!q.choices[letter]) return;
        const row = document.createElement('div');
        row.className = 'review-choice' +
          (letter===q.correct ? ' right-answer' : '') +
          (letter===userAns && letter!==q.correct ? ' user-wrong' : '');
        row.innerHTML = '<span>'+letter+'.</span><span></span>';
        row.querySelectorAll('span')[1].textContent = q.choices[letter];
        choicesDiv.appendChild(row);
      });

      card.querySelector('.review-rule').textContent = q.rule || '';
      card.querySelector('.review-tip').textContent = q.tip || '';
      if (q.trap) card.querySelector('.review-trap').textContent = q.trap;

      const poeList = card.querySelector('.review-poe-list');
      ['A','B','C','D'].forEach(letter=>{
        if(!q.poe || !q.poe[letter]) return;
        const li = document.createElement('li');
        li.textContent = letter + '. ' + q.poe[letter];
        if (letter === q.correct) li.classList.add('correct-letter');
        poeList.appendChild(li);
      });

      container.appendChild(card);
    });
  }

  $('#print-btn').addEventListener('click', ()=> window.print());
});
})();
</script>

</body>
</html>
