": "C", "difficulty": "Hard", "skill": "Subject-Verb Agreement", "domain": "Standard English Conventions", "tags": [], "rule": "The convention being tested is the use of verb forms within a sentence. The plural verb \"study\" agrees in number with the plural subject \"many.\"", "tip": "Find the true subject by mentally crossing out any phrase that sits between the subject and the verb, then check that the verb matches that subject in number.", "trap": "Because the singular verb \"is studying\" doesn\u2019t agree in number with the plural subject \"many.\"", "poe": {"C": "The convention being tested is the use of verb forms within a sentence. The plural verb \"study\" agrees in number with the plural subject \"many.\"", "A": "Because the singular verb \"is studying\" doesn\u2019t agree in number with the plural subject \"many.\"", "B": "Because the singular verb \"has studied\" doesn\u2019t agree in number with the plural subject \"many.\"", "D": "Because the singular verb \"studies\" doesn\u2019t agree in number with the plural subject \"many.\""}}, {"question": "When a given term\u2014\u201cself-fulfilling prophecies\u201d and \u201crole models\u201d are two well-known examples\u2014is generally accepted and frequently used, ______ susceptible to obliteration by incorporation (OBI). In cases of OBI, widely used terms are rarely, if at all, attributed to the individuals who coined them.<br><br><b>Which choice completes the text so that it conforms to the conventions of Standard English?</b>", "choices": {"A": "they often become", "B": "these often become", "C": "this often becomes", "D": "it often becomes"}, "correct": "D", "difficulty": "Hard", "skill": "Pronouns", "domain": "Standard English Conventions", "tags": [], "rule": "The convention being tested is pronoun-antecedent agreement. The singular pronoun \u201cit\u201d agrees in number with the singular antecedent \u201ca given term\u201d and clearly indicates that the term becomes susceptible to obliteration by incorporation.", "tip": "Find the antecedent first, then check that the pronoun matches it in number \u2014 and make sure it is clear which noun the pronoun refers to.", "trap": "Because the plural pronoun \u201cthey\u201d neither agrees in number with the singular antecedent \u201ca given term\u201d nor clearly indicates that the given term\u2014not another plural noun in the sentence, such as \u201cexamples\u201d\u2014becomes susceptible to obliteration by incorporation.", "poe": {"D": "The convention being tested is pronoun-antecedent agreement. The singular pronoun \u201cit\u201d agrees in number with the singular antecedent \u201ca given term\u201d and clearly indicates that the term becomes susceptible to obliteration by incorporation.", "A": "Because the plural pronoun \u201cthey\u201d neither agrees in number with the singular antecedent \u201ca given term\u201d nor clearly indicates that the given term\u2014not another plural noun in the sentence, such as \u201cexamples\u201d\u2014becomes susceptible to obliteration by incorporation.", "B": "Because the plural pronoun \u201cthese\u201d neither agrees in number with the singular antecedent \u201ca given term\u201d nor clearly indicates that the given term\u2014not another plural noun in the sentence, such as \u201cexamples\u201d\u2014becomes susceptible to obliteration by incorporation.", "C": "Because the singular pronoun \u201cthis\u201d is ambiguous in this context, leaving unclear what exactly becomes susceptible to obliteration by incorporation."}}, {"question": "In his 1963 exhibition Exposition of Music\u2014Electronic Television, Korean American artist Nam June Paik showed how television images could be manipulated to express an artist\u2019s perspective. Today, Paik ______ considered the first video artist.<br><br><b>Which choice completes the text so that it conforms to the conventions of Standard English?</b>", "choices": {"A": "will be", "B": "had been", "C": "was", "D": "is"}, "correct": "D", " d interference from nearby landmasses together cause ______ to swirl into a massive, churning whirlpool\u2014also called the North Atlantic Gyre\u2014that spins clockwise.<br><br><b>Which choice completes the text so that it conforms to the conventions of Standard English?</b>", "choices": {"A": "these", "B": "those", "C": "them", "D": "it"}, "correct": "D", "difficulty": "Hard", "skill": "Pronouns", "domain": "Standard English Conventions", "tags": [], "rule": "The convention being tested is pronoun-antecedent agreement. The singular pronoun \"it\" agrees in number with the singular antecedent \"water\" and clearly indicates that the water swirls into a whirlpool.", "tip": "Find the antecedent first, then check that the pronoun matches it in number \u2014 and make sure it is clear which noun the pronoun refers to.", "trap": "The plural pronoun \"these\" neither agrees in number with the singular antecedent \"water\" nor clearly indicates that the water\u2014not another plural noun in the sentence, such as \"landmasses\" or \"winds\"\u2014swirls into a whirlpool.", "poe": {"D": "The convention being tested is pronoun-antecedent agreement. The singular pronoun \"it\" agrees in number with the singular antecedent \"water\" and clearly indicates that the water swirls into a whirlpool.", "A": "The plural pronoun \"these\" neither agrees in number with the singular antecedent \"water\" nor clearly indicates that the water\u2014not another plural noun in the sentence, such as \"landmasses\" or \"winds\"\u2014swirls into a whirlpool.", "B": "The plural pronoun \"those\" neither agrees in number with the singular antecedent \"water\" nor clearly indicates that the water\u2014not another plural noun in the sentence, such as \"landmasses\" or \"winds\"\u2014swirls into a whirlpool.", "C": "The plural pronoun \"them\" neither agrees in number with the singular antecedent \"water\" nor clearly indicates that the water\u2014not another plural noun in the sentence, such as \"landmasses\" or \"winds\"\u2014swirls into a whirlpool."}}, {"question": "Scientists believe that, unlike most other species of barnacle, turtle barnacles (Chelonibia testudinari) can dissolve the cement-like secretions they use to attach ______ to a sea turtle shell, enabling the barnacles to move short distances across the shell\u2019s surface.<br><br><b>Which choice completes the text so that it conforms to the conventions of Standard English?</b>", "choices": {"A": "it", "B": "themselves", "C": "them", "D": "itself"}, "correct": "B", "difficulty": "Medium", "skill": "Pronouns", "domain": "Standard English Conventions", "tags": [], "rule": "The convention being tested is pronoun-antecedent agreement. The plural reflexive pronoun \u201cthemselves\u201d agrees in number with the plural antecedent \u201cturtle barnacles,\u201d correctly indicating what is attached to a sea turtle shell.", "tip": "Find the antecedent first, then check that the pronoun matches it in number \u2014 and make sure it is clear which noun the pronoun refers to.", "trap": "Because the singular pronoun \u201cit\u201d doesn\u2019t agree in number with the plural antecedent \u201cturtle barnacles.\u201d", "poe": {"B": "The convention being tested is pronoun-antecedent agreement. The plural reflexive pronoun \u201cthemselves\u201d agrees in number with the plural antecedent \u201cturtle barnacles,\u201d correctly indicating what is attached to a sea turtle shell.", "A": "Because the singular pronoun \u201cit\u201d doesn\u2019t agree in number with the plural antecedent \u201cturtle barnacles.\u201d", "C": "Because it results in an unclear and confusing sentence. In this context, it\u2019s unclear what the plural pronoun \u201cthem\u201d refers to.", "D": "Because the singular reflexive pronoun \u201citself\u201d doesn\u2019t agree in number with the plural antecedent \u201cturtle barnacles.\u201d"}}, {"question": "During the American Civil War, Thomas Morris Chester braved the front lines as a war c const STATE = { idx:0, answers:{}, submitted:false, minutesChosen:0, secondsLeft:0, timerId:null };

function $(sel){ return document.querySelector(sel); }
function $all(sel){ return document.querySelectorAll(sel); }

function currentQuestions(){ return TEST.questions; }

document.addEventListener('DOMContentLoaded', function(){

  function initIntro(){
    $('#intro-title').textContent = TEST.label;
    $('#intro-subtitle').textContent = TEST.description || '';
    $('#intro-count').textContent = TEST.questions.length + ' questions. Choose your timing, then click Start when you\'re ready.';
    const standard = Math.round(TEST.questions.length * 1.5);
    const extended = Math.round(standard * 1.25);
    $('#timing-options').innerHTML =
      '<div class="timing-card selected" data-minutes="' + standard + '"><h3>Standard Time</h3><div class="mins">' + standard + ' min</div></div>' +
      '<div class="timing-card" data-minutes="' + extended + '"><h3>Extended Time (+25%)</h3><div class="mins">' + extended + ' min</div></div>';
    STATE.minutesChosen = standard;
    $all('.timing-card').forEach(card=>{
      card.addEventListener('click', ()=>{
        $all('.timing-card').forEach(c=>c.classList.remove('selected'));
        card.classList.add('selected');
        STATE.minutesChosen = parseFloat(card.dataset.minutes);
      });
    });
  }

  initIntro();

  $('.start-btn').addEventListener('click', function(){
    $('#intro-screen').classList.add('hidden');
    $('#test-screen').classList.remove('hidden');
    buildNav();
    renderQuestion();
    startTimer();
  });

  function startTimer(){
    STATE.secondsLeft = Math.round(STATE.minutesChosen*60);
    updateTimerDisplay();
    STATE.timerId = setInterval(()=>{
      STATE.secondsLeft--;
      updateTimerDisplay();
      if(STATE.secondsLeft<=0){
        clearInterval(STATE.timerId);
        STATE.submitted = true;
        showResults();
      }
    }, 1000);
  }
  function updateTimerDisplay(){
    const m = Math.floor(STATE.secondsLeft/60);
    const s = STATE.secondsLeft%60;
    const box = $('#timer-box');
    if(!box) return;
    box.textContent = 'Time Remaining: ' + m + ':' + (s<10?'0':'')+s;
    box.classList.toggle('low-time', STATE.secondsLeft <= 120);
  }

  function buildNav(){
    const nav = $('#nav-grid');
    nav.innerHTML = '';
    currentQuestions().forEach((q,i)=>{
      const btn = document.createElement('button');
      btn.className = 'nav-btn';
      btn.textContent = (i+1);
      btn.addEventListener('click', ()=>{ STATE.idx = i; renderQuestion(); });
      nav.appendChild(btn);
    });
  }

  function renderQuestion(){
    const q = currentQuestions()[STATE.idx];
    $('#q-text').innerHTML = q.question.replace(/\n/g,'<br>');
    const choicesEl = $('#choices');
    choicesEl.innerHTML = '';
    ['A','B','C','D'].forEach(letter=>{
      if(!q.choices[letter]) return;
      const row = document.createElement('div');
      row.className = 'choice-row' + (STATE.answers[STATE.idx]===letter ? ' selected':'');
      row.innerHTML = '<span class="choice-letter">'+letter+'</span><span class="choice-text"></span>';
      row.querySelector('.choice-text').textContent = q.choices[letter];
      row.addEventListener('click', ()=>{
        STATE.answers[STATE.idx] = letter;
        renderQuestion();
      });
      choicesEl.appendChild(row);
    });
    updateNav();
    $('#q-counter').textContent = 'Question ' + (STATE.idx+1) + ' of ' + currentQuestions().length;
  }

  function updateNav(){
    $all('.nav-btn').forEach((btn,i)=>{
      btn.classList.toggle('current', i===STATE.idx);
      btn.classList.toggle('answered', STATE.answers[i] !== undefined);
    });
  }

  $('#prev-btn').addEventListener('click', ()=>{
    if(STATE.idx>0){ STATE.idx--; renderQuestion(); }
  });
  $('#next-btn').addEventListener('click', ()=>{
    if(STATE.idx<currentQuestions().length-1){ STATE.idx++; renderQuestion(); }
  });

  $('#submit-btn').addEventListener('click', ()=>{
    $('#confirm-box').classList.remove('hidden');
  });
  $('#cancel-submit').addEventListener('click', ()=>{
    $('#confirm-box').classList.add('hidden');
  });
  $('#confirm-submit').addEventListener('click', ()=>{
    $('#confirm-box').classList.add('hidden');
    if(STATE.timerId) clearInterval(STATE.timerId);
    STATE.submitted = true;
    showResults();
  });

  function showResults(){
    $('#test-screen').classList.add('hidden');
    $('#results-screen').classList.remove('hidden');
    $('#print-btn').classList.remove('hidden');
    const qs = currentQuestions();
    let correctCount = 0;
    qs.forEach((q,i)=>{ if(STATE.answers[i]===q.correct) correctCount++; });
    $('.score-big').textContent = correctCount + ' / ' + qs.length;
    $('#results-title').textContent = TEST.label + ' \u2014 Results';

    const container = $('#review-container');
    container.innerHTML = '';
    qs.forEach((q,i)=>{
      const userAns = STATE.answers[i];
      const isCorrect = userAns === q.correct;
      const card = document.createElement('div');
      card.className = 'review-card ' + (isCorrect ? 'correct':'incorrect');

      let html = '<div class="review-q"></div><div class="review-choices"></div>';
      html += '<div class="review-section"><div class="review-section-label">Rule</div><div class="review-rule"></div></div>';
      html += '<div class="review-section"><div class="review-section-label">Tip</div><div class="review-tip"></div></div>';
      if (q.trap) {
        html += '<div class="review-section"><div class="review-section-label">Trap</div><div class="review-trap"></div></div>';
      }
      html += '<div class="review-section"><div class="review-section-label">Process of Elimination</div><ul class="review-poe-list"></ul></div>';
      card.innerHTML = html;

      card.querySelector('.review-q').textContent = 'Question ' + (i+1) + ': ' + q.question.replace(/<[^>]+>/g,' ');
      const choicesDiv = card.querySelector('.review-choices');
      ['A','B','C','D'].forEach(letter=>{
        if(!q.choices[letter]) return;
        const row = document.createElement('div');
        row.className = 'review-choice' +
          (letter===q.correct ? ' right-answer' : '') +
          (letter===userAns && letter!==q.correct ? ' user-wrong' : '');
        row.innerHTML = '<span>'+letter+'.</span><span></span>';
        row.querySelectorAll('span')[1].textContent = q.choices[letter];
        choicesDiv.appendChild(row);
      });

      card.querySelector('.review-rule').textContent = q.rule || '';
      card.querySelector('.review-tip').textContent = q.tip || '';
      if (q.trap) card.querySelector('.review-trap').textContent = q.trap;

      const poeList = card.querySelector('.review-poe-list');
      ['A','B','C','D'].forEach(letter=>{
        if(!q.poe || !q.poe[letter]) return;
        const li = document.createElement('li');
        li.textContent = letter + '. ' + q.poe[letter];
        if (letter === q.correct) li.classList.add('correct-letter');
        poeList.appendChild(li);
      });

      container.appendChild(card);
    });
  }

  $('#print-btn').addEventListener('click', ()=> window.print());
});
})();
</script>

</body>
</html>
