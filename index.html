<style>
  :root{
    --ink:#141a2b;
    --paper:#ffffff;
    --surface:#f7f8fa;
    --muted:#5b6472;
    --line:#e2e5eb;
    --accent:#a9781f;
    --accent-soft:#f6ecd8;
    --english:#7b3f61;
    --english-soft:#f4e9ee;
    --practice:#1f6f78;
    --practice-soft:#e7f2f1;
    --full:#3a4f8a;
    --full-soft:#eaeef8;
    --shadow: 0 1px 2px rgba(20,26,43,.06), 0 8px 24px rgba(20,26,43,.06);
  }
  @media (prefers-color-scheme: dark){
    :root[data-theme="dark"]{
      --ink:#e7ebf3; --paper:#0d121e; --surface:#161e30; --muted:#9aa5b8; --line:#2a3550;
      --accent:#e4bb6c; --accent-soft:#2c2413;
      --english:#e19bbb; --english-soft:#2a1f28;
      --practice:#6fd0d8; --practice-soft:#122a2b;
      --full:#8fa3e0; --full-soft:#1c2340;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --ink:#e7ebf3; --paper:#0d121e; --surface:#161e30; --muted:#9aa5b8; --line:#2a3550;
    --accent:#e4bb6c; --accent-soft:#2c2413;
    --english:#e19bbb; --english-soft:#2a1f28;
    --practice:#6fd0d8; --practice-soft:#122a2b;
    --full:#8fa3e0; --full-soft:#1c2340;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:'Inter',-apple-system,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{font-family:'Fraunces',Georgia,'Times New Roman',serif; text-wrap:balance;}
  .mono{font-family:'IBM Plex Mono','Courier New',monospace; font-variant-numeric:tabular-nums;}
  button{font-family:inherit;}
  #app{max-width:720px; margin:0 auto; min-height:100%; display:flex; flex-direction:column; padding:0 16px;}
  .topbar{
    position:sticky; top:env(safe-area-inset-top,0px); z-index:20;
    background:var(--paper); border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:10px; padding:14px 0; margin:0 -16px; padding-left:16px; padding-right:16px;
  }
  .backbtn{
    border:none; background:var(--surface); color:var(--ink); width:36px; height:36px; border-radius:10px;
    display:flex; align-items:center; justify-content:center; cursor:pointer; box-shadow:var(--shadow); flex-shrink:0;
    font-size:16px;
  }
  .backbtn:focus-visible, button:focus-visible, input:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  .topbar h1{font-size:18px; margin:0; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .topbar-logo{width:26px; height:26px; object-fit:contain; flex-shrink:0;}
  main{flex:1; padding:20px 0 48px;}
  .eyebrow{font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:600; margin:0 0 6px;}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:20px; box-shadow:var(--shadow); margin-bottom:14px;}
  .tile{
    display:flex; align-items:center; gap:14px; width:100%; text-align:left; background:var(--surface);
    border:1px solid var(--line); border-radius:16px; padding:18px; cursor:pointer; box-shadow:var(--shadow);
    margin-bottom:12px; transition:transform .12s ease;
  }
  .tile:hover{transform:translateY(-1px);}
  .tile .icon{width:46px; height:46px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:21px; flex-shrink:0;}
  .tile .body{flex:1; min-width:0;}
  .tile .body strong{display:block; font-size:17px; margin-bottom:2px;}
  .tile .body span{display:block; font-size:13px; color:var(--muted); line-height:1.4;}
  .tile .chev{color:var(--muted); font-size:18px; flex-shrink:0;}
  .section-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px;}
  @media (max-width:480px){.section-grid{grid-template-columns:1fr 1fr 1fr; gap:8px;}}
  .tile-col{
    display:flex; flex-direction:column; align-items:center; text-align:center; gap:6px;
    background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:20px 10px;
    cursor:pointer; box-shadow:var(--shadow); transition:transform .12s ease;
  }
  .tile-col:hover{transform:translateY(-2px);}
  .tile-col .icon{width:48px; height:48px; border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:22px; margin-bottom:4px;}
  .tile-col strong{font-size:14.5px;}
  .tile-col span{font-size:11.5px; color:var(--muted); line-height:1.3;}
  @media (max-width:380px){
    .tile-col{padding:14px 6px;}
    .tile-col strong{font-size:13px;}
    .tile-col span{font-size:10.5px;}
  }
  .btn{border:none; border-radius:12px; padding:13px 20px; font-size:15px; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:8px; width:100%;}
  .btn.primary{background:var(--ink); color:var(--paper);}
  .btn.ghost{background:var(--surface); color:var(--ink); border:1px solid var(--line);}
  .btn.gold{background:var(--accent); color:#fff;}
  .field{width:100%; padding:13px 14px; border-radius:12px; border:1px solid var(--line); background:var(--surface); color:var(--ink); font-size:15px; margin-bottom:12px;}
  .subject-strip{height:4px; border-radius:4px 4px 0 0; margin:-20px -20px 16px;}
  .empty{text-align:center; color:var(--muted); padding:36px 16px; font-size:14px; line-height:1.6;}
  .empty .big{font-size:32px; margin-bottom:10px;}
  footer.foot{text-align:center; color:var(--muted); font-size:12.5px; padding:20px 0 8px;}
  .badge{display:inline-block; font-size:11px; font-weight:700; padding:3px 9px; border-radius:999px; letter-spacing:.02em;}
  .badge.easy{background:#e5f3ec; color:#2f7d5a;}
  .badge.medium{background:var(--accent-soft); color:var(--accent);}
  .badge.hard{background:#fbe9e7; color:#b4433a;}
  :root[data-theme="dark"] .badge.easy{background:#102a1f; color:#69cd9c;}
  :root[data-theme="dark"] .badge.hard{background:#2c1714; color:#e88478;}
  .progress-dots{display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap;}
  .progress-dots span{width:20px; height:6px; border-radius:4px; background:var(--line);}
  .progress-dots span.done{background:var(--ink);}
  .progress-dots span.current{background:var(--accent);}
  .passage{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; font-size:15px; line-height:1.65;}
  .qstem{font-size:16px; line-height:1.55; margin:0 0 16px; font-weight:600;}
  .choice{
    display:flex; align-items:flex-start; gap:12px; width:100%; text-align:left; background:var(--surface);
    border:1.5px solid var(--line); border-radius:12px; padding:14px; margin-bottom:10px; cursor:pointer; font-size:15px; line-height:1.4;
  }
  .choice .letter{width:26px; height:26px; border-radius:8px; background:var(--paper); display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; flex-shrink:0; font-family:'IBM Plex Mono',monospace;}
  .choice.correct{border-color:#2f7d5a; background:#e5f3ec;}
  .choice.correct .letter{background:#2f7d5a; color:#fff;}
  .choice.incorrect{border-color:#b4433a; background:#fbe9e7;}
  .choice.incorrect .letter{background:#b4433a; color:#fff;}
  :root[data-theme="dark"] .choice.correct{border-color:#69cd9c; background:#102a1f;}
  :root[data-theme="dark"] .choice.correct .letter{background:#69cd9c; color:#0d121e;}
  :root[data-theme="dark"] .choice.incorrect{border-color:#e88478; background:#2c1714;}
  :root[data-theme="dark"] .choice.incorrect .letter{background:#e88478; color:#2c1714;}
  .explain-panel{border:1px solid var(--line); border-radius:14px; padding:16px; margin:6px 0 16px; background:var(--surface);}
  .explain-panel .row2{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
  .explain-panel .verdict{font-weight:700; font-size:14px;}
  .explain-panel .verdict.ok{color:#2f7d5a;}
  .explain-panel .verdict.no{color:#b4433a;}
  .explain-block{margin-bottom:10px; font-size:13.5px; line-height:1.55;}
  .explain-block b{display:block; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin-bottom:2px; font-weight:700;}
  .poe-item{font-size:13px; line-height:1.5; margin-bottom:6px; padding-left:4px;}
  .score-hero{text-align:center; padding:28px 20px; border-radius:18px; background:var(--accent-soft); border:1px solid var(--line); margin-bottom:16px;}
  .score-hero .num{font-family:'Fraunces',serif; font-size:44px; font-weight:700; line-height:1; color:var(--accent);}
  .score-hero .lbl{color:var(--muted); font-size:13px; margin-top:6px;}
  .slideshow{border:1px solid var(--line); border-radius:14px; overflow:hidden; background:#111; margin-bottom:12px;}

  .slideshow-bar{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:16px;}
  .slideshow-bar .navbtn{
    border:none; background:var(--surface); color:var(--ink); width:40px; height:40px; border-radius:10px;
    display:flex; align-items:center; justify-content:center; cursor:pointer; box-shadow:var(--shadow); font-size:18px; flex-shrink:0;
  }
  .slideshow-bar .navbtn:disabled{opacity:.35; cursor:not-allowed;}
  .slideshow-bar .count{font-size:13px; color:var(--muted); font-family:'IBM Plex Mono',monospace;}

  .signin-card{
    max-width:400px; margin:48px auto; background:#faf6ec; border:1px solid #e7ddc7;
    border-radius:4px; padding:40px 36px 36px; text-align:center; box-shadow:var(--shadow);
  }
  .signin-logo{width:88px; height:auto; margin:0 auto 14px; display:block;}
  .signin-brand{font-family:'Fraunces',Georgia,serif; font-size:20px; font-weight:400; color:#2b2f3a; margin:0 0 14px;}
  .signin-brand b{font-weight:700;}
  .signin-divider{width:46px; height:2px; background:#a8822f; margin:0 auto 22px;}
  .signin-title{font-size:24px; margin:0 0 10px; color:#1c2340;}
  .signin-sub{color:#6b6f78; font-size:14px; line-height:1.55; max-width:300px; margin:0 auto 24px;}
  .signin-row2{display:flex; gap:10px;}
  .signin-row2 .field{flex:1;}
  .signin-card .field{background:#fff; border:1px solid #d9d2bd; color:#1c2340;}
  .signin-btn{width:100%; background:#7a1f2b; color:#fff; margin-top:6px; padding:14px; font-weight:600; letter-spacing:.01em; border-radius:4px;}
  .signin-btn:hover{background:#661a24;}
  .signin-error{color:#b4433a; font-size:13px; margin:-4px 0 12px; text-align:left;}
  body.signin-page{background:#f5f1e6;}
  body.signin-page #app{padding:0 16px;}
  body.signin-page main{padding:0;}
  @media (prefers-color-scheme: dark){
    :root[data-theme="dark"] body.signin-page{background:#12161f;}
  }
  :root[data-theme="dark"] body.signin-page{background:#12161f;}
  @media (prefers-color-scheme: dark){
    :root[data-theme="dark"] .signin-card{background:#1b1f2e; border-color:#2f3650;}
    :root[data-theme="dark"] .signin-brand,:root[data-theme="dark"] .signin-title{color:#e7ebf3;}
    :root[data-theme="dark"] .signin-card .field{background:#141a2b; border-color:#2f3650; color:#e7ebf3;}
  }
  :root[data-theme="dark"] .signin-card{background:#1b1f2e; border-color:#2f3650;}
  :root[data-theme="dark"] .signin-brand,:root[data-theme="dark"] .signin-title{color:#e7ebf3;}
  :root[data-theme="dark"] .signin-card .field{background:#141a2b; border-color:#2f3650; color:#e7ebf3;}

  var ENGLISH_QUESTIONS = [{"domain": "Boundaries", "num": 1, "diff": "Easy", "stem": "The Kaiparowits Formation is a fossil-rich layer of sedimentary rock in the Grand Staircase, a colossal sequence of rock layers stretching from Utah's Bryce Canyon to Arizona's Grand Canyon. The sandstones and mudstones of the Kaiparowits Formation were deposited ______ the Late Cretaceous, preserving many species from that time. Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": ["during:", "during;", "during,", "during"], "correct": 3, "rule": "'During' is a PREPOSITION, not a conjunction — it simply attaches to the noun phrase that follows it ('during the Late Cretaceous') with no punctuation at all. A colon, semicolon, or comma would incorrectly try to separate the verb 'deposited' from the prepositional phrase that completes its meaning.", "tip": "Say the sentence out loud without any pause where the blank is. If it reads naturally as one unbroken phrase ('were deposited during the Late Cretaceous'), you need NO punctuation — that's your first clue on these short boundary questions.", "why": "'Were deposited during the Late Cretaceous' is a single, unified verb phrase — the preposition 'during' needs to sit directly next to its object with nothing in between.", "trap": "Choice A (colon) is the most commonly picked wrong answer — students see a fact following and reflexively add a colon, forgetting that a colon can only follow a complete, independent clause, and 'the sandstones... were deposited' isn't complete without the 'during' phrase attached.", "poe": [{"letter": "A", "idx": 0, "text": "A colon must be preceded by a complete independent clause. 'The sandstones and mudstones... were deposited' is NOT complete without 'during the Late Cretaceous' attached — you can't cut the sentence there."}, {"letter": "B", "idx": 1, "text": "A semicolon needs a complete, independent clause on BOTH sides. What follows ('during the Late Cretaceous, preserving...') isn't an independent clause at all."}, {"letter": "C", "idx": 2, "text": "A comma would wrongly separate the verb 'deposited' from the prepositional phrase 'during the Late Cretaceous' that it needs to complete its meaning — there's no grammatical reason for a pause here."}]}, {"domain": "Boundaries", "num": 2, "diff": "Easy", "stem": "Mia Heavener's 2019 novel Under Nushagak Bluff, which takes place in a mid-twentieth-century rural Alaskan fishing ______ the story of three Yup'ik women who grapple with the rise of commercial fisheries and other changes affecting their community. Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": ["village. Tells", "village tells", "village: tells", "village, tells"], "correct": 3, "rule": "When a nonessential ('extra information') clause — here, 'which takes place in a...village' — interrupts a sentence, it must be opened AND closed with a comma, like a pair of parentheses. The sentence already opens the clause with a comma after 'Bluff,' so it must close with a comma before the main verb resumes.", "tip": "Whenever you see a 'which' clause tucked into the middle of a sentence, physically bracket it off in your head — [novel Under Nushagak Bluff], (which takes place in...village), [tells the story...]. Then check: does the punctuation close the bracket properly before the main verb?", "why": "The comma before 'tells' closes the nonessential 'which...village' clause that was opened right after 'Bluff,' — completing the matched pair of commas the sentence needs.", "trap": "Choice B is the most commonly picked wrong answer, because 'village tells' sounds fine read quickly — but skipping the closing comma leaves the interrupting clause improperly attached, a very common boundary error students miss when reading fast.", "poe": [{"letter": "A", "idx": 0, "text": "A period here would cut off 'Tells the story of three Yup'ik women' as its own sentence — but ' reads as one run-together phrase instead of two separate list items."}, {"letter": "B", "idx": 1, "text": "Dashes aren't used to separate simple parallel list items like this — dashes signal a stronger, different kind of interruption, and pairing them this way isn't standard."}, {"letter": "D", "idx": 3, "text": "Also missing the comma between the first two titles, causing the same run-together problem as A."}]}, {"domain": "Boundaries", "num": 4, "diff": "Easy", "stem": "The capital city of the Aztec empire, Tenochtitlan, was built on an island in a lake. Because of the marshy conditions, the Aztec people ______ floating farms called “chinampas.” Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": ["created", "created:", "created,", "created;"], "correct": 0, "rule": "A transitive verb ('created') connects directly to its object ('floating farms') with no punctuation in between — punctuation should never separate a verb from the object that completes its meaning.", "tip": "Read the core sentence skeleton without any modifiers: 'the Aztec people [blank] floating farms.' If that skeleton reads naturally as subject-verb-object with no pause, you need zero punctuation.", "why": "'The Aztec people created floating farms called chinampas' is a simple, complete subject-verb-object sentence — no pause is grammatically needed or allowed between 'created' and its object.", "trap": "Choice C is the most commonly picked wrong answer — students often add a comma out of habit after a verb, especially in longer sentences, but a comma here would wrongly separate the verb from its direct object.", "poe": [{"letter": "B", "idx": 1, "text": "A colon requires a complete independent clause before it. 'The Aztec people created' isn't complete without its object 'floating farms' attached directly."}, {"letter": "C", "idx": 2, "text": "A comma incorrectly separates the verb 'created' from the object 'floating farms' that it needs — th b here, making the sentence structurally unclear.", "poe": [{"letter": "A", "idx": 0, "text": "A semicolon requires an independent clause after it, but 'published from 1866 to 1899...' has no subject of its own — it's a participial phrase, not an independent clause."}, {"letter": "B", "idx": 1, "text": "A period followed by 'Published from 1866 to 1899...' creates a fragment — a participial phrase can't stand alone as its own sentence."}, {"letter": "C", "idx": 2, "text": "Without the comma, 'Belgravia published from 1866 to 1899' misleadingly reads as though 'published' is the main verb with 'Belgravia' as its subject, which creates confusing, non-standard sentence structure."}]}, {"domain": "Boundaries", "num": 17, "diff": "Hard", "stem": "— As jazz singer Sarah Vaughan honed her vocal abilities acquiring a sophisticated timbre and precise control over pitch, dynamics, and ______ she earned comparisons to opera icon Leontyne Price, one of her personal heroes. The comparisons highlight how Vaughan, a jazz star, had transcended genre boundaries with her singing prowess. Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": ["vibrato:", "vibrato,", "vibrato —", "vibrato"], "correct": 1, "rule": "A long introductory subordinate clause beginning with 'As' must be separated from the main clause that follows with a comma — this marks the boundary between the setup ('As Vaughan honed her abilities...') and the main action ('she earned comparisons...').", "tip": "When a sentence opens with 'As,' 'While,' 'Because,' or similar words, find where that opening clause ends and the main clause with the 'real' subject begins — that boundary almost always needs a comma.", "why": "'Vibrato,' closes the long introductory 'As...' clause with a comma before the main clause 'she earned comparisons to opera icon Leontyne Price' begins — exactly where the sentence's main action starts.", "trap": "Choice D is the most commonly picked wron ed with a comma and includes a clear subject ('who') and verb ('are known') rather than an ambiguous shortened form.", "why": "'Three, who are known as members of the office of the presidency' properly attaches the nonessential descriptive clause to 'three' with a comma, using a complete and clear relative clause.", "trap": "Choice A is the most commonly picked wrong answer — dropping 'who are' to just 'three, known as members...' is grammatically possible, but the full relative clause in D is the clearer, more standard construction this question is testing.", "poe": [{"letter": "A", "idx": 0, "text": "While grammatically workable, this shortened form drops necessary clarity in a sentence that's already dense with numbers and description — the full 'who are known' construction is the standard, unambiguous choice."}, {"letter": "B", "idx": 1, "text": "A period followed by 'Known as members of the office of the presidency' creates a fragment — this phrase has no subject and can't stand alone as its own sentence."}, {"letter": "C", "idx": 2, "text": "Without the comma before 'who,' the descriptive clause isn't properly marked as nonessential extra information, leaving the boundary between 'three' and its description unclear."}]}, {"domain": "Form, Structure, and Sense", "num": 1, "diff": "Easy", "stem": "An imposing spire of igneous rock rising high above the Belle Fourche River in eastern Wyoming, Devils Tower (also known as Bear Lodge) is one of the most prominent examples of columnar jointing, a pattern of fracturing in rocks that ______ in parallel arrays of long polygonal prisms. Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": ["resulting", "were resulting", "results", "to result"], "correct": 2, "rule": "Subject-verb agreement rule: the verb inside a 'that' clause must agree with the singular or plural noun that 'that' refers back to. Here, 'that' refers to 'a pattern' (singular), so the verb must be singular present tense: 'results.'", "tip": "Find the exact noun that 'that,' 'which,' or 'who' is standing in for — ignore any other nouns sitting in between. Here, 'that' sits right after 'fracturing in rocks,' but it actually refers back to 'a pattern,' not 'rocks.'", "why": "'That' refers back to 'a pattern of fracturing' — a singular subject — so it needs the singular present-tense verb 'results,' matching 'a pattern... that results in...'", "trap": "Choice A ('resulting') is the most commonly picked wrong answer — it can look fine at a quick glance because '-ing' words often show up in casual writing, but a bare '-ing' form can't function as the main verb of a clause; the clause needs a real, tensed verb.", "poe": [{"letter": "A", "idx": 0, "text": "'Resulting' is a present participle, not a finite verb — a clause needs an actual tensed verb ('results'), and 'resulting' can't complete 'that resulting' as a full clause."}, {"letter": "B", "idx": 1, "text": "'Were resulting' is plural and past tense — but the subject 'a pattern' is singular, and the sentence is describing a general, ongoing present-tense fact, not something limited to the past."}, {"letter": "D", "idx": 3, "text": "'To result' is an infinitive, which can't serve as the main verb of the 'that' clause — infinitives need a helping structure like 'seems to result,' which isn't what's set up here."}]}, {"domain": "Form, Structure, and Sense", "num": 2, "diff": "Easy", "stem": "Cycads are palmlike plants with cones. ______ plants were abundant throughout the Mesozoic Era (66 to 252 million years ago). Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": ["These", "That", "Each", "This"], "correct": 0, "rule": "Pronoun-antecedent agreement: a demonstrative word standing in for a plural noun ('plants') must itself be plural. 'These' is plural; 'this,' 'that,' and 'each' are all singular.", "tip": "Check the noun immediately following the blank ('plants' — plural) and match your pronoun's number to it directly, ignoring what 'sounds' natural in isolation.", "why": "'Plants' is plural, so it needs the plural demonstrative 'these' — 'These plants were abundant throughout the Mesozoic Era.'", "trap": "Choice D ('This') is the most commonly picked wrong answer — 'this' and 'these' look and sound similar, and students sometimes pick the singular form out of habit without checking the plural noun it needs to match.", "poe": [{"letter": "B", "idx": 1, "text": "'That plants' doesn't agree in the way English demonstratives are used before a plural noun in this construction — 'that' pairs with singular nouns ('that plant'), not plural ones like 'plants.'"}, {"letter": "C", "idx": 2, "text": "'Each' specifically means 'every individual one considered separately' and takes a SINGULAR verb/noun form — 'each plant,' not 'each plants' — so it can't pair with the plural noun here."}, {"letter": "D", "idx": 3, "text": "'This' is singular and cannot modify the plural noun 'plants' — you'd need 'this plant' (singular) to use 'this' correctly."}]}, {"domain": "Form, Structure, and Sense", "num": 3, "diff": "Easy", "stem": "Water is constantly moving and changing forms on Earth and in the atmosphere. This process is called the water cycle, and it is typically thought to consist of evaporation, condensation, and precipitation. However, the National Oceanic and Atmospheric Administration seeks ______ understanding of the water cycle to include transpiration, sublimation, and other types of water movement. Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": ["is expanding", "to expand", "has expanded", "expands"], "correct": 1, "rule": "The verb 'seek' is followed by an infinitive ('to' + base verb) when describing a goal or aim — 'seeks to expand,' not 'seeks expanding' or any finite verb form.", "tip": "Certain verbs (seek, want, hope, plan, decide, etc.) are always followed by 'to + verb. mber to that subject exactly.", "why": "'Dark fiction does more than entertain readers: it uses horror tropes...' directly and clearly refers 'it' back to 'dark fiction,' the singular subject of the first clause.", "trap": "Choice C ('they') is the most commonly picked wrong answer — students sometimes assume the sentence is about the authors (plural) rather than the singular concept ('dark fiction') that was actually just named.", "poe": [{"letter": "A", "idx": 0, "text": "'One' is a generic, indefinite pronoun that doesn't clearly connect back to 'dark fiction' — it introduces vague, unnecessary ambiguity where a direct reference is expected."}, {"letter": "B", "idx": 1, "text": "'We' would refer to the writer/reader collectively, but no such group has been introduced in the sentence — there's no clear antecedent for 'we.'"}, {"letter": "C", "idx": 2, "text": "'They' is plural, but the sentence's clear, singular antecedent is 'dark fiction,' not a plural group of people — this creates a pronoun-agreement mismatch."}]}, {"domain": "Form, Structure, and Sense", "num": 6, "diff": "Easy", "stem": "In 2019, New Zealand produced 88,465 hectograms per hectare (hg/ha) of wheat, and Portugal produced 23,298 hg/ha. This is the type of information on global food production that the United Nations' Food and Agriculture Organization ______ since 1945. Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": ["is collecting", "has collected", "will collect", "collects"], "correct": 1, "rule": "'Since 1945' is a classic present-perfect signal — when an action started in the past and continues up to now, English uses the present perfect tense ('has collected'), not simple present, future, or present progressive.", "tip": "Whenever you see 'since [a past date/year],' your ears should immediately go to present perfect ('has/have + past participle') — this is one of the most consistently tested patterns on Standard English Conventions.", "why": "'Since 1945' signals an action that began in the past and continues into the present, which is exactly what the present perfect tense 'has collected' expresses.", "trap": "Choice D ('collects') is the most commonly picked wrong answer — simple present tense sounds natural for general facts, but it doesn't capture the 'started in the past and still ongoing' meaning that 'since 1945' specifically requires.", "poe": [{"letter": "A", "idx": 0, "text": "'Is collecting' (present progressive) suggests an action happening right now, not a fact about continuous collection since a past date — it doesn't match the 'since 1945' signal."}, {"letter": "C", "idx": 2, "text": "'Will collect' is future tense, but the sentence is describing something that has been happening since 1945 up to now — not something that will happen later."}, {"letter": "D", "idx": 3, "text": "'Collects' (simple present) describes a general habitual fact but doesn't capture the specific 'ongoing since a past starting point' meaning that 'since 1945' requires — that's what present perfect is for."}]}, {"domain": "Form, Structure, and Sense", "num": 7, "diff": "Medium", "stem": "In October of 1648, representatives from 96 different parties convened to sign the final treaties of the Peace of Westphalia. The treaties, which ' brought an end to the Thirty Years War, ______ signed in the cities of Osnabrück and Münster, both located in the Holy Roman Empire–controlled region of Westphalia. Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": ["were", "is", "was", "has been"], "correct": 0, "rule": "Subject-verb agreement: the subject 'the treaties' is plural, so it needs the plural past-tense verb 'were,' matching the established past-tense context of the sentence (October 1648 signing).", "tip": "Trace the verb back to its true subject, ignoring any inserted 'which' clause in between. Here, 'which brought an end to the Thirty Years' War' sits between 'treaties' and the verb — skip over it to check agreement directly against 'treaties.'", "why": "'The treaties... were signed in the cities of Osnabrück and Münster' correctly uses the plural past-tense verb 'were' to match the plural subject 'treaties.'", "trap": "Choice C ('was') is the most commonly picked wrong answer — students sometimes let the nearby singular-sounding inserted clause pull their attention away from the true plural subject 'treaties.'", "poe": [{"letter": "B", "idx": 1, "text": "'Is' is both present tense (wrong — the event is historical, 1648) and doesn't match the plural subject 'treaties,' which needs 'are,' not 'is,' if present tense were even appropriate."}, {"letter": "C", "idx": 2, "text": "'Was' is singular, but the subject 'the treaties' is plural — this is a subject-verb agreement error."}, {"letter": "D", "idx": 3, "text": "'Has been' is singular in form ('have been' would be needed for plural) and present-perfect, which doesn't match the clearly past, completed historical event being described."}]}, {"domain": "Form, Structure, and Sense", "num": 8, "diff": "Medium", "stem": "A worker cooperative is a business that is owned and operated by its workers. This model stands in contrast to traditional models in which a smaller group of owners controls a company. Because the profits made by a cooperative are shared by all workers —who are also owners — the workers ______ directly from its success. Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": ["benefit", "benefited", "were benefiting", "had benefited"], "correct": 0, "rule": "Subject-verb agreement: 'the workers' is a plural subject, so it needs the plural present-tense verb 'benefit' (no -s), matching the sentence's general, ongoing-truth present tense.", "tip": "When you see a plural subject like 'workers,' remember the verb should NOT have an -s ending in present tense — that's the classic plural-verb signal in English ('workers benefit,' not 'workers benefits').", "why": "'The workers benefit directly from its success' correctly matches the plural subject 'workers' with the plural present-tense verb form 'benefit.'", "trap": "None of the other choices are close phonetically, but the most common error pattern here is choosing a past-tense form (B) when the surrounding sentence describes a general, ongoing truth in the present.", "poe": [{"letter": "B", "idx": 1, "text": "'Benefited' is past tense, but the sentence describes a general, ongoing truth about how cooperatives work — not a one-time past event."}, {"letter": "C", "idx": 2, "text": "'Were benefiting' is past progressive, describing an action in progress at a specific past time — again, mismatched with the sentence's general-truth present tense."}, {"letter": "D", "idx": 3, "text": "'Had benefited' is past perfect, implying an action completed before another past action — there's no such past-before-past relationship being described here."}]}, {"domain": "Form, Structure, and Sense", "num": 9, "diff": "Medium", "stem": "Both Arteaga, in the state of Coahuila, and Lagos de Moreno, in the state of Jalisco, have been designated by Mexico as pueblos mágicos (magical villages) to celebrate these ______ natural beauty and unique cultural traditions. Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": ["town", "town's", "towns", "towns'"], "correct": 3, "rule": "Possessive agreement: since TWO towns (Arteaga and Lagos de Moreno) are being discussed, the possessive noun must be both PLURAL and POSSESSIVE — 'towns'' (plural noun + apostrophe after the s), not singular or non-possessive.", "tip": "Count how many 'owners' are involved before choosing a possessive form. Two towns means you need the plural possessive ending, formed by adding just an apostrophe after the existing plural -s: towns → towns'.", "why": "'These towns' natural beauty and unique cultural traditions' correctly uses xt": "1,680 doesn't correspond to a clean derivation from this problem — possibly from an unrelated calculation error."}, {"letter": "C", "text": "840 comes from multiplying 210 by 4 and then dividing by something, or another miscalculation that doesn't correctly apply the square-root relationship between area ratio and linear scale factor."}], "desmos": ["Step 1: Open Desmos and calculate the area ratio first: type 2520/630 — this confirms the ratio is 4.", "Step 2: Find the linear scale factor by taking the square root: type sqrt(4) — this confirms the scale factor is 2.", "Step 3: Apply this scale factor to Rectangle A's perimeter: type 210*2", "Step 4: Press Enter — Desmos will evaluate this to 420, confirming n = 420 and matching choice D."]}, {"gi": 10, "domain": "Area and volume", "num": 10, "diff": "Hard", "gridin": true, "correct": "50", "rule": "When a rectangle's vertices are given as coordinate points (not aligned with the x and y axes), find the side lengths using the DISTANCE FORMULA between adjacent vertices, then multiply those two side lengths together for the area — just like any other rectangle.", "tip": "For a 'tilted' rectangle on a coordinate grid, identify which pairs of points are adjacent (connected by a side) versus diagonal (opposite corners) — adjacent sides should be PERPENDICULAR to each other, which you can verify by checking that their slopes multiply to −1.", "why": "Reading the four points from the graph: approximately (−4,−1), (4,5), (7,1), and (−1,−5). Using the distance formula, one side has length √[(4−(−4))² + (5−(−1))²] = √(64+36) = √100 = 10, and the adjacent side has length √[(7−4)² + (1−5)²] = √(9+16) = √25 = 5. The area is 10 × 5 = 50.", "steps": ["Step 1: Read the four vertex coordinates from the graph: approximately (−4,−1), (4,5), (7,1), and (−1,−5).", "Step 2: Calculate the length of one side using the distance formula between two adjacent vertices, (−4,−1) and (4,5): distance = √[(4−(−4))² + (5−(−1))²] = √[(8)² + (6)²] = √(64+36) = √100 = 10.", "Step 3: Calculate the length of the adjacent side between (4,5) and (7,1): distance = √[(7−4)² + (1−5)²] = √[(3)² + (−4)²] = √(9+16) = √25 = 5.", "Step 4: Verify these two sides are perpendicular (confirming it's truly a rectangle) by checking their slopes multiply to −1: slope of first side = 6/8 = 3/4; slope of second side = −4/3. Product: (3/4)×(−4/3) = −1. Confirmed perpendicular.", "Step 5: Calculate the area by multiplying the two side lengths: Area = 10 × 5 = 50.", "Step 6: This is a grid-in question — enter 50 as your final answer."], "trap": "A common error on this problem is misreading the exact coordinates of the points from the graph (since they're not always sitting exactly on grid intersections), which throws off the entire distance calculation — always double check each point's position carefully against the grid lines.", "poe": [], "desmos": ["Step 1: Open Desmos and plot the four points you read from the graph: (-4,-1), (4,5), (7,1), (-1,-5)", "Step 2: To calculate the distance between two adjacent points, type: sqrt((4-(-4))^2+(5-(-1))^2) — this confirms one side length is 10.", "Step 3: Type: sqrt((7-4)^2+(1-5)^2) — this confirms the adjacent side length is 5.", "Step 4: Calculate the area: type 10*5 — Desmos will evaluate this to 50, confirming your grid-in answer."]}, {"gi": 11, "domain": "Area and volume", "num": 11, "diff": "Hard", "gridin": true, "correct": "594", "rule": "The volume of a cone is calculated using the formula: Volume = (1/3) × π × r² × height, where r is the RADIUS of the circular base (not the diameter). Always remember to divide the given diameter by 2 to get the radius before plugging into the formula.", "tip": "When a cone problem gives you the DIAMETER instead of the radius, immediately divide by 2 as your very first step, before touching the volume formula — using the diameter directly in place of the radius is one of the most common errors on cone and cylinder problems.", "why": "The diameter is 18 cm, so the radius is 18 ÷ 2 = 9 cm. Using the cone volume formula: Volume = (1/3) × π × 9² × 22 = (1/3) × π × 81 × 22 = (1/3) × 1,782 × π = 594π. Since the volume is given as nπ, this means n = 594.", "steps": ["Step 1: Convert the given diameter to radius: radius = diameter ÷ 2 = 18 ÷ 2 = 9 cm.", "Step 2: Recall the cone volume formula: Volume = (1/3) × π × r² × height.", "Step 3: Substitute the values: Volume = (1/3) × π × 9² × 22.", "Step 4: Calculate 9² = 81.", "Step 5: Multiply: 81 × 22 = 1,782.", "Step 6: Multiply by (1/3): (1/3) × 1,782 = 594.", "Step 7: The volume is 594π cubic centimeters, so comparing to the given form nπ, we get n = 594.", "Step 8: This is a grid-in question — enter 594 as your final answer."], "trap": "A common error on this problem is using the given diameter (18) directly as the radius in the formula, instead of first dividing by 2 to get the correct radius (9) — this would lead to an answer four times too large, since the radius is squared in the formula.", "poe": [], "desmos": ["Step 1: Open Desmos and calculate the radius first: type 18/2 — this confirms the radius is 9 cm.", "Step 2: Calculate the volume coefficient (the value of n): type (1/3)*9^2*22", "Step 3: Press Enter — Desmos will evaluate this to 594, confirming n = 594 for your grid-in answer. (Desmos will show 594 as a plain number since you're calculating the coefficient of π, not the full numeric volume.)"]}, {"gi": 12, "domain": "Area and volume", "num": 12, "diff": "Hard", "gridin": false, "correct": "A", "rule": "For SIMILAR three-dimensional shapes, the ratio of their SURFACE AREAS equals the SQUARE of the ratio of their corresponding linear dimensions (like edge length) — this is the 3D analog of how area scales for similar 2D shapes.", "tip": "Whenever you see a ratio comparing similar shapes' surface areas (a 2D measurement), square whatever linear (1D) ratio you're given — don't use the linear ratio directly, and don't cube it either (cubing is for VOLUME ratios, not surface area).", "why": "The edge length ratio of cube Y to cube X is 3/88. Since surface area scales as the SQUARE of the linear ratio, the surface area ratio n = (3/88)² = 9/7,744.", "steps": ["Step 1: Identify the given linear (edge length) ratio: cube Y's edge is 3/88 of cube X's edge.", "Step 2: Recall that surface area scales as the SQUARE of the linear scale factor for similar 3D shapes.", "Step 3: Square the given ratio: n = (3/88)² = (3²)/(88²) = 9/7,744.", "Step 4: This matches choice A."], "trap": "Choice C (3/88) is the most commonly picked wrong answer — it uses the LINEAR edge-length ratio directly as the answer, without squaring it to correctly account for the fact that surface area is a two-dimensional measurement.", "poe": [{"letter": "B", "text": "27/3,872 comes from CUBING the ratio (3³/88² or a similar mismatched operation) instead of correctly squaring both the numerator and denominator — cubing would be appropriate for VOLUME ratios, not surface area."}, {"letter": "C", "text": "3/88 is simply the original linear edge-length ratio, used directly without squaring — this doesn't account for surface area being a two-dimensional measurement."}, {"letter": "D", "text": "9/44 doesn't correctly square the denominator (88² = 7,744, not 44) — this likely results from only partially squaring the ratio."}], "desmos": ["Step 1: Open Desmos and calculate the surface area ratio by squaring the given edge-length ratio: type (3/88)^2", "Step 2: Press Enter — Desmos will evaluate this to a decimal (approximately 0.000388...), and you can compare it to 9/7744 by typing that as well to confirm they match exactly, verifying choice A."]}, {"gi": 13, "domain": "Area and volume", "num": 13, "diff": "Hard", "gridin": true, "correct": "4", "rule": "For SIMILAR three-dimensional shapes, the ratio of their VOLUMES equals the CUBE of the ratio of their corresponding linear dimensions — this is different from area, which uses the SQUARE of the ratio.", "tip": "When given a volume ratio for similar solids and asked to find a linear dimension, take the CUBE ROOT of the volume ratio to find the actual linear scale factor — don't take the square root (that's for area problems) or use the volume ratio directly.", "why": "The volume ratio of prism P to prism Q is 972/36 = 27. Since volume scales as the CUBE of the linear scale factor, the actual linear scale factor is the cube root of 27, which is 3. This means every edge of prism P is 3 times the corresponding edge of prism Q. Since one edge of P is 12 cm, the corresponding edge of Q is 12 ÷ 3 = 4 cm.", "steps": ["Step 1: Calculate the volume ratio between the two similar prisms: prism P's volume ÷ prism Q's volume = 972 ÷ 36 = 27.", "Step 2: Since volume scales as the CUBE of the linear scale factor, find the actual scale factor by taking the cube root of the volume ratio: the cube root of 27 is 3 (since 3×3×3 = 27).", "Step 3: This means every linear dimension of prism P is 3 times the corresponding dimension of prism Q.", "Step 4: Since the given edge of prism P is 12 cm, find the corresponding edge of prism Q by dividing by the scale factor: 12 ÷ 3 = 4.", "Step 5: This is a grid-in question — enter 4 as your final answer."], "trap": "A common error on this problem is taking the SQUARE ROOT of the volume ratio (√27 ≈ 5.2) instead of the correct CUBE ROOT (3) — remembering that volume is a three-dimensional measurement (requiring a cube root to find the linear scale) is the key insight here.", "poe": [], "desmos": ["Step 1: Open Desmos and calculate the volume ratio first: type 972/36 — this confirms the ratio is 27.", "Step 2: Find the linear scale factor by taking the cube root: type 27^(1/3) — Desmos will show this equals 3.", "Step 3: Calculate the corresponding edge of prism Q: type 12/3", "Step 4: Press Enter — Desmos will evaluate this to 4, confirming your grid-in answer."]}, {"gi": 14, "domain": "Area and volume", "num": 14, "diff": "Hard", "gridin": false, "correct": "A", "rule": "For a right square pyramid, the total surface area equals the base area PLUS the combined lateral (side) face area. The slant height relates to the pyramid's actual height through the Pythagorean theorem, using half the base's side length as the other leg of a right triangle.", "tip": "Break this multi-step problem into clear stages: (1) find the base area by subtracting lateral area from total surface area, (2) find the base's side length by taking the square root, (3) find the slant height using the lateral area formula, and (4) use the Pythagorean theorem to find the actual height. Tackling one stage at a time prevents getting overwhelmed.", "why": "The base area is 70,560 − 38,160 = 32,400 square inches, so the base's side length is √32,400 = 180 inches. The lateral area formula for a square pyramid is 2 × (side length) × (slant height) = 38,160, so slant height = 38,160 ÷ (2×180) = 38,160 ÷ 360 = 106. Using the Pythagorean theorem with half the base (90) and the slant height (106): height² = 106² − 90² = 11,236 − 8,100 = 3,136, so height = √3,136 = 56.", "steps": ["Step 1: Find the base area by subtracting the lateral surface area from the total surface area: base area = 70,560 − 38,160 = 32,400 square inches.", "Step 2: Since the base is a square, find its side length by taking the square root: side length = √32,400 = 180 inches.", "Step 3: Use the lateral surface area formula for a square pyramid (4 triangular faces, each with area (1/2) × base side × slant height, combined = 2 × base side × slant height): 38,160 = 2 × 180 × slant height.", "Step 4: Solve for slant height: slant height = 38,160 ÷ 360 = 106 inches.", "Step 5: Set up the Pythagorean theorem relating the pyramid's height, half the base side length, and the slant height (these three form a right triangle): height² + (base side/2)² = slant height².", "Step 6: Substitute the values: height² + 90² = 106².", "Step 7: Calculate: height² + 8,100 = 11,236.", "Step 8: Solve for height²: height² = 11,236 − 8,100 = 3,136.", "Step 9: Take the square root: height = √3,136 = 56.", "Step 10: This matches choice A."], "trap": "Choice B (90) is the most commonly picked wrong answer — it's actually HALF the base side length (used as an intermediate step in the Pythagorean theorem calculation), not the final height — a student who completes most of the steps correctly but stops early might mistakenly select this intermediate value.", "poe": [{"letter": "B", "text": "90 is half the base's side length (180÷2=90), an intermediate value used WITHIN the Pythagorean theorem calculation — it's not the final height the question asks for."}, {"letter": "C", "text": "106 is the SLANT HEIGHT (a different measurement along the triangular face), not the perpendicular height of the pyramid that the question asks for."}, {"letter": "D", "text": "180 is the full side length of the square base — not the height of the pyramid at all."}], "desmos": ["Step 1: Open Desmos and calculate the base area: type 70560-38160 — this confirms 32,400 square inches.", "Step 2: Find the base's side length: type sqrt(32400) — this confirms 180 inches.", "Step 3: Find the slant height: type 38160/(2*180) — this confirms 106 inches.", "Step 4: Use the Pythagorean theorem to find the actual height: type sqrt(106^2-90^2)", "Step 5: Press Enter — Desmos will evaluate this to 56, confirming the height and matching choice A."]}, {"gi": 15, "domain": "Area and volume", "num": 15, "diff": "Hard", "gridin": true, "correct": "5800", "rule": "The volume of any right prism (including one with a square base) is calculated using the formula: Volume = (base area) × height.", "tip": "For a prism with a square base, calculate the base area first (side length squared) as a separate step, then multiply by the height — breaking the calculation into two clean stages reduces the chance of a multiplication error.", "why": "The square base has area = side² = 10² = 100 square inches. Using the prism volume formula:
