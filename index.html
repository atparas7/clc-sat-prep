6) is the most commonly picked wrong answer — it correctly combines the x² terms but incorrectly changes the sign of the constant term, subtracting 6 instead of keeping it positive (the original +6 was never being subtracted — only the 8x² term was in the second set of parentheses).", "poe": [{"letter": "A", "text": "7 completely drops the x² term, treating the expression as if it were only constants — this ignores that x² terms don't cancel out (9x² − 8x² = x², not 0)."}, {"letter": "B", "text": "17x² + 6 adds the x² coefficients (9 + 8 = 17) instead of subtracting them — this incorrectly treats the operation between the two parentheses as addition rather than subtraction."}, {"letter": "C", "text": "x² − 6 correctly combines the x² terms but incorrectly applies the subtraction to the constant 6 as well — but the 6 was inside the FIRST parentheses (being added), not affected by the subtraction of the second parentheses."}], "desmos": ["Step 1: Open Desmos and type the original expression as a function: y=(9x^2+6)-(8x^2)", "Step 2: Press Enter — Desmos graphs this as a parabola.", "Step 3: Type your simplified answer as a second function: y=x^2+6", "Step 4: Press Enter — Desmos graphs this as well. If your simplification is correct, this second curve should land EXACTLY on top of the first one (they'll appear as a single curve, since they're mathematically identical).", "Step 5: As an extra check, use the table feature to compare both functions at a specific x-value, like x = 2 — both should give the same output (10), confirming the expressions are truly equivalent and verifying choice D."]}, {"gi": 22, "domain": "Equivalent expressions", "num": 2, "diff": "Medium", "gridin": false, "correct": "B", "rule": "To find a specific coefficient in a combined polynomial expression (like the 'b' in ax² + bx + c), you must fully multiply out (FOIL) any products first, then combine ALL like terms — including terms from a subtraction — before identifying which coefficient the question is asking about.", "tip": "When a problem gives you the FINAL form (ax² + bx + c) and asks for just one specific letter's value, do the ENTIRE multiplication and simplification first, writing out the complete simplified expression — then simply read off the coefficient the question asks for. Don't try to shortcut by guessing which original term becomes 'b.'", "why": "First multiply f(x) and g(x): (2x+3)(7x−2) = 2x(7x) + 2x(−2) + 3(7x) + 3(−2) = 14x² − 4x + 21x − 6 = 14x² + 17x − 6. Now subtract h(x) = 5x + 6: (14x² + 17x − 6) − (5x + 6) = 14x² + 17x − 6 − 5x − 6 = 14x² + 12x − 12. Comparing to ax² + bx + c, the coefficient of x is b = 12.", "steps": ["Step 1: Write out f(x) · g(x) as a multiplication: (2x + 3)(7x − 2).", "Step 2: Use FOIL (First, Outer, Inner, Last) to expand this product: First: 2x × 7x = 14x². Outer: 2x × (−2) = −4x. Inner: 3 × 7x = 21x. Last: 3 × (−2) = −6.", "Step 3: Combine these four terms: 14x² − 4x + 21x − 6.", "Step 4: Combine the like x-terms: −4x + 21x = 17x. So f(x) · g(x) = 14x² + 17x − 6.", "Step 5: Now subtract h(x) = 5x + 6 from this result: (14x² + 17x − 6) − (5x + 6).", "Step 6: Distribute the negative sign across h(x): 14x² + 17x − 6 − 5x − 6.", "Step 7: Combine like terms: the x-terms: 17x − 5x = 12x. The constants: −6 − 6 = −12.", "Step 8: The fully simplified expression is: 14x² + 12x − 12.", "Step 9: Comparing this to the general form ax² + bx + c, we can see b = 12 (the coefficient of the x term).", "Step 10: This matches choice B."], "trap": "Choice D (22) is the most commonly picked wrong answer — it typically results from adding the −4x and 21x terms correctly to get 17x, but then making a sign error while subtracting the 5x from h(x), perhaps adding instead of subtracting (17 + 5 = 22).", "poe": [{"letter": "A", "text": "−5 doesn't correspond to a correct simplification path — likely from a significant sign or arithmetic error somewhere in the FOIL expansion or final combination."}, {"letter": "C", "text": "20 could result from correctly finding 17x from the FOIL step but then making an error while combining with h(x)'s x-term, perhaps adding 5 instead of subtracting it (17 + 5 = 22, close to this but not quite matching this specific wrong value — regardless, it doesn't match the correct combination)."}, {"letter": "D", "text": "22 typically comes from adding 17 + 5 = 22 instead of correctly subtracting 17 − 5 = 12, reversing the sign of the operation when combining with h(x)'s x-coefficient."}], "desmos": ["Step 1: Open Desmos and type each function separately: f(x)=2x+3 then g(x)=7x-2 then h(x)=5x+6", "Step 2: On a new line, type the full combined expression: y=f(x)*g(x)-h(x)", "Step 3: Press Enter — Desmos graphs this as a parabola (since it now includes an x² term from the multiplication).", "Step 4: Click the settings/wrench icon or use the table feature to inspect this parabola's equation in standard form, or simply evaluate the expression at a few x-values and compare to 14x²+12x−12 to confirm they match.", "Step 5: As a direct check, type 14x^2+12x-12 as a separate function on another line — this should produce a curve that lands EXACTLY on top of the one from Step 2, confirming b = 12 is correct and matches choice B."]}, {"gi": 23, "domain": "Equivalent expressions", "num": 3, "diff": "Medium", "gridin": false, "correct": "B", "rule": "To multiply an expression by a fraction times two binomials, like 2(x − 9/2)(x + 8), it's often cleanest to first combine the leading 2 with the fractional term to clear the fraction, THEN use FOIL to expand the two binomials — this avoids carrying an awkward fraction through the entire expansion.", "tip": "When you see a fraction like 9/2 paired with a leading coefficient like 2 sitting right outside the parentheses, check if multiplying them together first eliminates the fraction entirely — here, 2 × (9/2) = 9, a whole number, which makes the rest of the expansion much cleaner.", "why": "Distribute the 2 into the first binomial only: 2(x − 9/2) = 2x − 9. Now the expression is (2x − 9)(x + 8). Use FOIL: First: 2x × x = 2x². Outer: 2x × 8 = 16x. Inner: −9 × x = −9x. Last: −9 × 8 = −72. Combine: 2x² + 16x − 9x − 72 = 2x² + 7x − 72.", "steps": ["Step 1: Start with the given expression: 2(x − 9/2)(x + 8).", "Step 2: Distribute the leading 2 into the first binomial to clear the fraction: 2 × x = 2x, and 2 × (−9/2) = −9. This gives (2x − 9) for the first factor.", "Step 3: Rewrite the expression with this simplified first factor: (2x − 9)(x + 8).", "Step 4: Use FOIL to expand: First: 2x × x = 2x². Outer: 2x × 8 = 16x. Inner: −9 × x = −9x. Last: −9 × 8 = −72.", "Step 5: Combine these four terms: 2x² + 16x − 9x − 72.", "Step 6: Combine the like x-terms: 16x − 9x = 7x.", "Step 7: The fully expanded expression is: 2x² + 7x − 72.", "Step 8: This matches choice B."], "trap": "Choice A (2x² − 72) is the most commonly picked wrong answer — it correctly computes the 'First' and 'Last' terms of FOIL but completely forgets to include the 'Outer' and 'Inner' cross terms (16x and −9x), which combine to give the missing 7x term.", "poe": [{"letter": "A", "text": "This is missing the middle x-term entirely (7x) — it looks like only the 'First' and 'Last' parts of FOIL were computed, skipping the 'Outer' and 'Inner' cross-multiplication steps."}, {"letter": "C", "text": "This has the right general shape but an incorrect middle term (−x instead of +7x) and an incorrect constant (−36 instead of −72) — likely from distributing the leading 2 unevenly or incompletely."}, {"letter": "D", "text": "This drops the leading coefficient entirely (x² instead of 2x²) and has an incorrect constant (−36 instead of −72) — suggesting the initial distribution of the 2 was mishandled or skipped for some terms."}], "desmos": ["Step 1: Open Desmos and type the original expression as a function: y=2(x-9/2)(x+8)", "Step 2: Press Enter — Desmos graphs this parabola.", "Step 3: Type your expanded answer as a second function: y=2x^2+7x-72", "Step 4: Press Enter — if your expansion is correct, this curve will land EXACTLY on top of the first one.", "Step 5: As an extra check, use the table feature to compare both functions at x = 0 — both should output −72, and at x = 1, both should output 2+7−72 = −63, confirming the expressions are equivalent and verifying choice B."]}, {"gi": 24, "domain": "Equivalent expressions", "num": 4, "diff": "Hard", "gridin": true, "correct": "27", "rule": "To split a single fraction into a sum of two simpler fractions with different denominators (called 'partial fraction decomposition'), combine the two simpler fractions back into one over their common denominator, then match the resulting numerator to the original numerator term by term.", "tip": "After combining the right side into a single fraction, line up your combined numerator directly underneath the original numerator, matching the coefficient of x with the coefficient of x, and the constant term with the constant term — this creates a small system of equations you can solve directly.", "why": "Combine p/x + w/(x+51) into a single fraction using x(x+51) as the common denominator: [p(x+51) + wx] / [x(x+51)]. Expand the numerator: px + 51p + wx = (p+w)x + 51p. Set this equal to the original numerator: (p+w)x + 51p = 29x + 102. Matching coefficients: p + w = 29 (coefficient of x) and 51p = 102 (constant term). Solving the second equation: p = 102/51 = 2. Substituting into the first equation: 2 + w = 29, so w = 27.", "steps": ["Step 1: Write the right side of the given equivalence, p/x + w/(x+51), as a single combined fraction using the common denominator x(x+51): [p(x+51) + w(x)] / [x(x+51)].", "Step 2: Expand the numerator: p(x+51) = px + 51p, so the full numerator is px + 51p + wx.", "Step 3: Combine the like terms in the numerator (the x-terms): px + wx = (p+w)x. The numerator becomes (p+w)x + 51p.", "Step 4: Since this combined fraction must equal the original expression (29x+102)/[x(x+51)], and the denominators already match, set the numerators equal to each other: (p+w)x + 51p = 29x + 102.", "Step 5: Match the coefficients of x on both sides: p + w = 29.", "Step 6: Match the constant terms on both sides: 51p = 102.", "Step 7: Solve the constant-term equation for p: p = 102/51 = 2.", "Step 8: Substitute p = 2 into the x-coefficient equation: 2 + w = 29.", "Step 9: Solve for w: w = 29 − 2 = 27.", "Step 10: This is a grid-in question — enter 27 as your final answer."], "trap": "A common error on this problem is matching the coefficients incorrectly — for example, accidentally setting 51p equal to 29 (the x-coefficient) instead of 102 (the constant term), which comes from confusing which part of the combined numerator corresponds to the x-term versus the constant term.", "poe": [], "desmos": ["Step 1: Open Desmos and type the original expression: y=(29x+102)/(x*(x+51))", "Step 2: Press Enter — Desmos graphs this rational function.", "Step 3: Type your derived answer using p = 2 and w = 27: y=2/x+27/(x+51)", "Step 4: Press Enter — if your values for p and w are correct, this second curve will land EXACTLY on top of the first one.", "Step 5: As an extra check, use the table feature to compare both functions at a specific x-value, like x = 1 — both should give the same output, confirming w = 27 is correct."]}, {"gi": 25, "domain": "Equivalent expressions", "num": 5, "diff": "Hard", "gridin": true, "correct": "31/2 or 15.5", "rule": "When a quadratic-type expression (like 6x⁴ + 31x² + 35, which behaves like a quadratic in x²) needs to be factored TWO different ways, first find its unique factorization by treating x² as a single variable and factoring normally, then figure out the second factorization by redistributing the SAME two roots between the two binomial factors in a different way.", "tip": "A quadratic-type expression like this has exactly two 'roots' when treated as a quadratic in x² — but there are multiple ways to distribute those two root-values between two binomial factors (3x² + ___)(2x² + ___), depending on which root goes with which leading coefficient. This is why the problem can have BOTH an integer factorization AND a non-integer one from the very same expression.", "why": "Treating the expression as a quadratic in y = x², we have 6y² + 31y + 35, which has roots y = −5/3 and y = −7/2 (found using the quadratic formula or by testing that 6(−5/3)² + 31(−5/3) + 35 = 0). The integer factorization (3x² + a)(2x² + b) requires matching a/3 = 5/3 (giving a = 5) and b/2 = 7/2 (giving b = 7) — both integers. The non-integer factorization (3x² + c)(2x² + d) instead matches c/3 = 7/2 (giving c = 21/2) and d/2 = 5/3 (giving d = 10/3) — both non-integers, as required. So a = 5 and c = 21/2, giving a + c = 5 + 21/2 = 10/2 + 21/2 = 31/2.", "steps": ["Step 1: Notice that 6x⁴ + 31x² + 35 is a 'quadratic in disguise' — if you let y = x², the expression becomes 6y² + 31y + 35, a standard quadratic.", "Step 2: Find the roots of 6y² + 31y + 35 = 0 using the quadratic formula: y = [−31 ± √(31² − 4(6)(35))] / (2×6) = [−31 ± √(961−840)] / 12 = [−31 ± √121] / 12 = [−31 ± 11] / 12.", "Step 3: Calculate both roots: y = (−31+11)/12 = −20/12 = −5/3, and y = (−31−11)/12 = −42/12 = −7/2.", "Step 4: This means 6y² + 31y + 35 = 6(y + 5/3)(y + 7/2), which can be rewritten (redistributing the 6) as (3y + 5)(2y + 7) — substituting back y = x² gives the INTEGER factorization (3x² + 5)(2x² + 7), so a = 5 and b = 7.", "Step 5: For the SECOND (non-integer) factorization, redistribute the SAME two roots differently between the two binomials: instead of matching 5/3 with the '3' coefficient, match 7/2 with the '3' coefficient instead: (3x² + 21/2)(2x² + 10/3) — here, c/3 = 7/2 gives c = 21/2, and d/2 = 5/3 gives d = 10/3, both non-integers as required.", "Step 6: Now calculate the requested value: a + c = 5 + 21/2.", "Step 7: Convert 5 to a fraction with denominator 2: 5 = 10/2. So a + c = 10/2 + 21/2 = 31/2.", "Step 8: This is a grid-in question — enter 31/2 or its decimal equivalent, 15.5, as your final answer."], "trap": "A common error on this problem is only finding the integer factorization (a = 5, b = 7) and stopping there, without realizing the SAME expression has a completely different second factorization using the non-integer constants c and d — this requires recognizing that the two roots of the underlying quadratic can be distributed between the binomial factors in more than one way.", "poe": [], "desmos": ["Step 1: Open Desmos and type the original expression: y=6x^4+31x^2+35", "Step 2: Press Enter — Desmos graphs this quartic (degree-4) curve.", "Step 3: Type the integer factorization to verify it: y=(3x^2+5)(2x^2+7)", "Step 4: Press Enter — this curve should land exactly on top of the first one, confirming a = 5 and b = 7.", "Step 5: Type the non-integer factorization using fractions: y=(3x^2+21/2)(2x^2+10/3)", "Step 6: Press Enter — this curve should ALSO land exactly on top of the original, confirming c = 21/2 and d = 10/3 are correct.", "Step 7: Finally, type 5+21/2 directly into Desmos — it will evaluate to 15.5, confirming a + c = 31/2 and matching your grid-in answer."]}, {"gi": 26, "domain": "Equivalent expressions", "num": 6, "diff": "Hard", "gridin": false, "correct": "A", "rule": "To expand and combine an expression with multiple squared binomials (like −14(5x−2)² + 6(5x−3)²), first expand EACH squared binomial separately using the pattern (p−q)² = p² − 2pq + q², then distribute the leading coefficients, and finally combine all like terms together.", "tip": "Expand each squared term completely as its own separate step before multiplying by the leading coefficient (−14 or 6) — trying to combine the squaring and the coefficient distribution in one step is where most sign errors happen on problems like this.", "why": "Expand (5x−2)² = 25x² − 20x + 4, and (5x−3)² = 25x² − 30x + 9. Distribute: −14(25x²−20x+4) = −350x²+280x−56, and 6(25x²−30x+9) = 150x²−180x+54. Add these together: (−350+150)x² + (280−180)x + (−56+54) = −200x² + 100x − 2. Setting this equal to (a/6)x² + (b/6)x + c/6: a/6 = −200 gives a = −1200; b/6 = 100 gives b = 600; c/6 = −2 gives c = −12. Sum: a+b+c = −1200+600−12 = −612.", "steps": ["Step 1: Expand the first squared binomial: (5x−2)² = (5x)² − 2(5x)(2) + 2² = 25x² − 20x + 4.", "Step 2: Expand the second squared binomial: (5x−3)² = (5x)² − 2(5x)(3) + 3² = 25x² − 30x + 9.", "Step 3: Distribute the leading coefficient −14 across the first expansion: −14(25x² − 20x + 4) = −350x² + 280x − 56.", "Step 4: Distribute the leading coefficient 6 across the second expansion: 6(25x² − 30x + 9) = 150x² − 180x + 54.", "Step 5: Add these two results together, combining like terms: x² terms: −350x² + 150x² = −200x². x terms: 280x − 180x = 100x. Constants: −56 + 54 = −2.", "Step 6: The combined expression is: −200x² + 100x − 2.", "Step 7: Set this equal to the target form (a/6)x² + (b/6)x + c/6, meaning a/6 = −200, b/6 = 100, and c/6 = −2.", "Step 8: Solve for each constant by multiplying both sides by 6: a = −200 × 6 = −1200; b = 100 × 6 = 600; c = −2 × 6 = −12.", "Step 9: Calculate the requested sum: a + b + c = −1200 + 600 + (−12) = −612.", "Step 10: This matches choice A."], "trap": "Choice B (−306) is the most commonly picked wrong answer — it's exactly HALF of the correct answer (−612), which typically results from forgetting to multiply by 6 when solving for a, b, and c individually (i.e., using a = −200, b = 100, c = −2 directly as if they were already the final values, then only partially adjusting).", "poe": [{"letter": "B", "text": "−306 is exactly half of the correct total — this often results from a computational shortcut gone wrong, such as only multiplying some terms by 6 instead of all three constants consistently."}, {"letter": "C", "text": "−102 doesn't correspond to a clean derivation from this problem — likely a distractor value or the result of multiple compounding errors."}, {"letter": "D", "text": "−17 is far too small in magnitude to result from correctly scaling by 6 — this likely comes from forgetting to multiply by 6 at all and instead just adding −200 + 100 + (−2) = −102 (close to choice C) or a similar unscaled combination."}], "desmos": ["Step 1: Open Desmos and type the original expression: y=-14(5x-2)^2+6(5x-3)^2", "Step 2: Press Enter — Desmos graphs this parabola.", "Step 3: Type your simplified expression using the target form with the constants you found: y=(-1200/6)x^2+(600/6)x+(-12/6)", "Step 4: Press Enter — if your values for a, b, and c are correct, this curve will land EXACTLY on top of the original one.", "Step 5: As a final check, type -1200+600-12 directly into Desmos — it will evaluate to −612, confirming a+b+c = −612 and matching choice A."]}, {"gi": 27, "domain": "Equivalent expressions", "num": 7, "diff": "Hard", "gridin": false, "correct": "C", "rule": "To simplify an expression involving roots (radicals) with different index numbers (like a cube root and an eighth root), first rewrite every root as a FRACTIONAL EXPONENT (the nth root of x becomes x^(1/n)), then use standard exponent rules to combine and simplify everything into one unified expression.", "tip": "Whenever you see mixed radical types (cube roots, eighth roots, etc.) in the same expression, immediately convert ALL of them to fractional exponent notation — this turns a confusing-looking radical problem into a much more familiar exponent-simplification problem you already know how to handle.", "why": "Rewrite the original expression using fractional exponents: the numerator ∛(n^17p^5) becomes n^(17/3)p^(5/3), and the denominator's ⁸√(p^8) becomes p^(8/8) = p^1 = p. So the full expression becomes [n^(17/3)p^(5/3)] / [5n²p] = (1/5) n^(17/3−2) p^(5/3−1) = (1/5) n^(11/3) p^(2/3). Checking option I: [n^(14/3)p^(5/3)]/(5np) = (1/5)n^(14/3−1)p^(5/3−1) = (1/5)n^(11/3)p^(2/3) — matches! Checking option II: ∛(n^11p^2)/5 = (1/5)n^(11/3)p^(2/3) — also matches! Both expressions are equivalent to the original.", "steps": ["Step 1: Rewrite the numerator using fractional exponent notation: ∛(n^17p^5) = (n^17p^5)^(1/3) = n^(17/3)p^(5/3).", "Step 2: Rewrite the denominator's radical term: ⁸√(p^8) = p^(8/8) = p^1 = p (since 8 divided by 8 equals exactly 1).", "Step 3: Write the full original expression using these simplified forms: [n^(17/3)p^(5/3)] / [5n²p].", "Step 4: Simplify by subtracting exponents for matching bases (dividing powers with the same base means subtracting exponents): for n: 17/3 − 2 = 17/3 − 6/3 = 11/3. For p: 5/3 − 1 = 5/3 − 3/3 = 2/3.", "Step 5: The fully simplified original expression is: (1/5) n^(11/3) p^(2/3).", "Step 6: Check option I: [n^(14/3)p^(5/3)] / (5np). Simplify exponents: for n: 14/3 − 1 = 14/3 − 3/3 = 11/3. For p: 5/3 − 1 = 5/3 − 3/3 = 2/3. This gives (1/5)n^(11/3)p^(2/3) — an EXACT match to Step 5.", "Step 7: Check option II: ∛(n^11p^2)/5 = (n^11p^2)^(1/3)/5 = n^(11/3)p^(2/3)/5 — also an EXACT match to Step 5.", "Step 8: Since BOTH option I and option II are algebraically equivalent to the original expression, the correct answer is C: I and II."], "trap": "Choice A (I only) is the most commonly picked wrong answer — students sometimes correctly verify option I matches but assume option II (written with a cube root instead of separated exponents) must be a 'different' or 'trick' expression, without actually converting it to fractional exponent form to check.", "poe": [{"letter": "A", "text": "While option I does correctly match the original expression, option II ALSO matches when converted to fractional exponent form — dismissing option II without checking it carefully is the error here."}, {"letter": "B", "text": "While option II does correctly match, option I ALSO matches — both are valid equivalent forms of the same original expression, so 'II only' incorrectly excludes a correct option."}, {"letter": "D", "text": "Since BOTH option I and option II simplify to the exact same expression as the original (as shown in Steps 6–7), 'Neither I nor II' is incorrect — both options are actually valid."}], "desmos": ["Step 1: Since this involves variables n and p in exponents, pick simple positive test values to verify — let's use n = 8 and p = 4 (chosen because they're powers of 2, which often simplify nicely with fractional exponents). Step 2: Open Desmos and type the original expression with these values: (8^(17/3)*4^(5/3))/(5*8^2*(4^(8/8)))", "Step 3: Press Enter — Desmos will evaluate this to a specific decimal number.", "Step 4: Type option I with the same values: (8^(14/3)*4^(5/3))/(5*8*4)", "Step 5: Press Enter — compare this result to Step 3's result; they should be IDENTICAL, confirming option I matches.", "Step 6: Type option II with the same values: (8^11*4^2)^(1/3)/5", "Step 7: Press Enter — compare this to Step 3's result as well; it should ALSO be identical, confirming option II matches too, verifying choice C (I and II) is correct."]}];
  var DATAANALYSIS_QUESTIONS = [{"gi": 1, "domain": "Ratios, rates, proportional relationships, and units", "num": 1, "diff": "Easy", "gridin": false, "correct": "C", "rule": "Unit conversion problems always use the given conversion factor as a multiplier — set it up so the unit you want to CANCEL is in the denominator and the unit you want to KEEP ends up in the numerator, then multiply straight across.", "tip": "Write the conversion factor as a fraction in two different orientations (10 mm/1 cm, or 1 cm/10 mm) and pick whichever one cancels out centimeters and leaves millimeters — this prevents accidentally dividing when you should multiply, or vice versa.", "why": "Since 1 centimeter = 10 millimeters, converting FROM centimeters TO millimeters means MULTIPLYING by 10 (going from a bigger unit to a smaller one always gives a bigger number). So 76 cm/s × 10 mm/cm = 760 mm/s.", "steps": ["Step 1: Identify the given rate: 76 centimeters per second.", "Step 2: Identify the conversion factor: 1 centimeter = 10 millimeters.", "Step 3: Since millimeters are a SMALLER unit than centimeters, converting to millimeters should give a LARGER number — this means multiplying, not dividing.", "Step 4: Multiply: 76 cm/s × 10 mm/cm = 760 mm/s (the 'cm' units cancel out, leaving 'mm').", "Step 5: This matches choice C."], "trap": "Choice D (86) is the most commonly picked wrong answer — it comes from mistakenly ADDING 10 to 76 (76 + 10 = 86) instead of correctly MULTIPLYING (76 × 10 = 760), confusing an additive shift with a multiplicative unit conversion.", "poe": [{"letter": "A", "text": "7,600 is off by a factor of 10 from the correct answer — likely from multiplying by 100 instead of 10, perhaps double-applying the conversion factor."}, {"letter": "B", "text": "836 doesn't correspond to a natural calculation from this conversion — possibly from adding an unrelated number (760 + 76 = 836) rather than performing the correct single multiplication."}, {"letter": "D", "text": "86 comes from mistakenly ADDING 10 to 76 (76 + 10 = 86) instead of correctly MULTIPLYING (76 × 10 = 760) — confusing an additive shift with a multiplicative unit conversion."}], "desmos": ["Step 1: Open Desmos and type the conversion directly as a multiplication: 76*10", "Step 2: Press Enter — Desmos will instantly evaluate this to 760, confirming the converted velocity in millimeters per second, matching choice C.", "Step 3: As a sanity check on direction, type 76/10 as well — this gives 7.6, which would be the (incorrect) result of dividing instead of multiplying; comparing both results helps confirm multiplying by 10 is the correct operation when converting from a larger unit (cm) to a smaller one (mm)."]}, {"gi": 2, "domain": "Ratios, rates, proportional relationships, and units", "num": 2, "diff": "Hard", "gridin": false, "correct": "D", "rule": "For rate-conversion word problems with two different unit changes happening at once (here, converting a monthly rate to a yearly rate, AND scaling by an unknown number of years), set up the rate as a fraction and multiply by the necessary conversion factors and variables step by step, keeping careful track of what's in the numerator and denominator.", "tip": "Break multi-step unit conversions into separate, small steps rather than trying to do everything at once — first convert 'per month' to 'per year' using the fixed number 12, and only afterward multiply by the variable representing the number of years.", "why": "The plant grows 87 mm every m months, so its rate is 87/m mm per month. Converting to a yearly rate: since there are 12 months in a year, multiply by 12: (87/m) × 12 = 1044/m mm per year. For k years, multiply by k: (1044/m) × k = 1044k/m.", "steps": ["Step 1: Write the given growth rate as a fraction: 87 millimeters per m months, or 87/m mm/month.", "Step 2: Convert this monthly rate into a YEARLY rate by multiplying by 12 (since there are 12 months in one year): (87/m) × 12 = 1044/m mm per year.", "Step 3: To find the total growth over k years (not just one year), multiply this yearly rate by k: (1044/m) × k = 1044k/m.", "Step 4: This matches choice D."], "trap": "Choice C is the most commonly picked wrong answer — it correctly computes 1044 (87 × 12) but multiplies by m instead of k, and divides by k instead of m, essentially swapping the roles of the two variables in the final expression.", "poe": [{"letter": "A", "text": "29m/4k doesn't come from a clean derivation of this problem — the numbers 29 and 4 don't naturally arise from 87 and 12 in this context (87/3=29, 12/3=4, suggesting a reduction error somewhere, but the variable placement is also backwards)."}, {"letter": "B", "text": "29k/4m has the same reduction issue as choice A, with variables swapped in a way that doesn't match the correct setup."}, {"letter": "C", "text": "1,044m/k correctly computes 1,044 but swaps which variable (m or k) belongs in the numerator versus denominator — m should be in the denominator (since a larger m means slower growth per month) and k in the numerator (since more years means more total growth)."}], "desmos": ["Step 1: Since this problem has two unknown variables (m and k), pick simple test values to verify your formula — let's say m = 3 (grows 87mm every 3 months) and k = 2 (over 2 years). Step 2: Open Desmos and calculate the rate per month directly: 87/3 — this gives 29 mm per month.", "Step 3: Convert to yearly rate: type 29*12 — this gives 348 mm per year.", "Step 4: Multiply by the number of years: type 348*2 — this gives 696 mm total growth over 2 years.", "Step 5: Now test your formula 1044k/m with the same values: type 1044*2/3 — this should also give 696, confirming your formula matches the step-by-step calculation and verifying choice D."]}, {"gi": 3, "domain": "Ratios, rates, proportional relationships, and units", "num": 3, "diff": "Hard", "gridin": false, "correct": "A", "rule": "When converting AREA (not just length) between units, you must apply the conversion factor TWICE — once for each dimension (length and width) — meaning you divide (or multiply) by the SQUARE of the linear conversion factor, not just the factor itself.", "tip": "Never apply a linear conversion factor (like 12 inches = 1 foot) directly to an area measurement — always square the conversion factor first (12² = 144) before using it to convert square inches to square feet, since area involves two dimensions.", "why": "Since 1 foot = 12 inches, 1 square foot = 12 × 12 = 144 square inches. To convert 3,168 square inches to square feet, divide by 144: 3,168 ÷ 144 = 22.", "steps": ["Step 1: Recall the linear conversion: 1 foot = 12 inches.", "Step 2: Since area involves TWO dimensions (length × width), square the conversion factor to get the area conversion: 1 square foot = 12² = 144 square inches.", "Step 3: To convert the given area from square inches to square feet, divide by 144 (since square inches is the smaller unit, converting to the larger unit square feet requires dividing): 3,168 ÷ 144 = 22.", "Step 4: This matches choice A."], "trap": "Choice C (264) is the most commonly picked wrong answer — it results from dividing by 12 instead of 144, applying only the LINEAR conversion factor instead of correctly squaring it for an AREA conversion.", "poe": [{"letter": "B", "text": "56.3 doesn't correspond to a clean derivation from this problem — likely from an unrelated arithmetic error."}, {"letter": "C", "text": "264 comes from dividing 3,168 by 12 instead of 144 — this uses only the linear (one-dimensional) conversion factor rather than correctly squaring it for the two-dimensional area conversion."}, {"letter": "D", "text": "675.4 doesn't correspond to a clean derivation from this problem either — possibly from multiplying instead of dividing, or a different unrelated calculation error."}], "desmos": ["Step 1: Open Desmos and calculate the area conversion factor first: type 12^2 — this confirms 144 square inches equals 1 square foot.", "Step 2: On the next line, type 3168/144 — Desmos will evaluate this to 22, confirming the area in square feet.", "Step 3: As a sanity check, try the common error calculation as well: type 3168/12 — this gives 264, which is what you'd get if you forgot to square the conversion factor; comparing both results helps you see why squaring is necessary for area conversions.", "Percentages", "4 questions  ·  Easy 0  /  Medium 0  /  Hard 4"]}, {"gi": 4, "domain": "Percentages", "num": 1, "diff": "Hard", "gridin": false, "correct": "B", "rule": "In scale-drawing problems, the ACTUAL physical size being represented stays the same even when the drawing itself is resized — so first calculate the total actual distance represented by the original drawing, then use that same fixed actual distance to find the new scale for the resized drawing.", "tip": "Don't confuse 'the drawing got bigger' with 'the actual place got bigger' — the real-world distance being depicted stays constant; only how much space on paper represents that distance changes. Calculate the fixed real-world total first, before working with the new drawing's dimensions.", "why": "The original drawing's side is 55 inches, with each inch representing 19 actual miles, so the total actual distance across is 55 × 19 = 1,045 miles. This actual distance doesn't change when the drawing is resized. The new drawing's side length is 65% longer: 55 × 1.65 = 90.75 inches. Since this new, larger drawing still represents the same 1,045 actual miles, the new scale is 1,045 ÷ 90.75 ≈ 11.52 miles per inch.", "steps": ["Step 1: Calculate the total actual distance represented by the original drawing's side: 55 inches × 19 miles/inch = 1,045 miles.", "Step 2: Recognize that this actual distance (1,045 miles) stays the SAME even when the drawing is resized — only the drawing's size changes, not the real place it represents.", "Step 3: Calculate the new drawing's side length: the new side is 65% LONGER than the original 55 inches, so multiply by 1.65 (100% + 65% = 165%, or 1.65 as a decimal): 55 × 1.65 = 90.75 inches.", "Step 4: Since the new 90.75-inch side still represents the same 1,045 actual miles, calculate the new scale by dividing: 1,045 ÷ 90.75 ≈ 11.5152 miles per inch.", "Step 5: Rounding to match the answer choices, this is closest to 11.52, matching choice B."], "trap": "Choice C (31.35) is the most commonly picked wrong answer — it typically results from incorrectly multiplying the ORIGINAL scale (19 miles/inch) by 1.65 directly, as if the scale itself grows by 65% (19 × 1.65 ≈ 31.35), rather than recognizing that a LARGER drawing of the SAME place actually needs a SMALLER (not larger) miles-per-inch scale.", "poe": [{"letter": "A", "text": "6.65 comes from dividing 19 by something close to 1.65 backwards, or another inverted calculation — this doesn't match the correct scale-recalculation approach."}, {"letter": "C", "text": "31.35 results from multiplying the original scale (19) by 1.65, treating the SCALE itself as growing — but a bigger drawing of the same place actually needs a SMALLER scale (fewer miles per inch), not a bigger one."}, {"letter": "D", "text": "35.75 doesn't correspond to a clean derivation from this problem — likely an arithmetic slip or distractor value."}], "desmos": ["Step 1: Open Desmos and calculate the fixed actual distance first: type 55*19 — this confirms 1,045 miles is the actual distance represented by the original drawing's side.", "Step 2: Calculate the new drawing's side length: type 55*1.65 — this confirms 90.75 inches for the larger drawing.", "Step 3: Calculate the new scale by dividing the FIXED actual distance by the NEW side length: type 1045/90.75 — Desmos will evaluate this to approximately 11.5152, confirming the new scale is closest to 11.52 miles per inch, matching choice B."]}, {"gi": 5, "domain": "Percentages", "num": 2, "diff": "Hard", "gridin": false, "correct": "D", "rule": "When a problem describes percentages chained together across multiple variables (A is a percent of C, and C is a percent of B), convert EACH percentage into a decimal multiplier first, then use substitution to express everything in terms of a single variable.", "tip": "Convert every percentage to its decimal form immediately (5,900% becomes 59, and 0.008% becomes 0.00008) — working with percentages over 100% or under 1% in their original form is a common source of decimal-point errors; converting early keeps the rest of the algebra clean.", "why": "Since a is 5,900% of c, convert to decimal: a = 59c. Since c is 0.008% of b, convert to decimal: c = 0.00008b, which means b = c / 0.00008 = 12,500c. Adding: a + b = 59c + 12,500c = 12,559c.", "steps": ["Step 1: Convert 'a is 5,900% of c' into an equation: 5,900% as a decimal is 5900/100 = 59, so a = 59c.", "Step 2: Convert 'c is 0.008% of b' into an equation: 0.008% as a decimal is 0.008/100 = 0.00008, so c = 0.00008b.", "Step 3: Solve this second equation for b (since we need b in terms of c to add it to a): b = c / 0.00008.", "Step 4: Calculate this division: 1/0.00008 = 12,500, so b = 12,500c.", "Step 5: Now add a and b, both now expressed in terms of c: a + b = 59c + 12,500c.", "Step 6: Combine like terms: 59c + 12,500c = 12,559c.", "Step 7: This matches choice D."], "trap": "Choice A (1,840c) is the most commonly picked wrong answer — it typically results from a decimal-point error while converting 0.008% to a decimal, such as using 0.08 instead of the correct 0.00008, which throws off the entire calculation for b.", "poe": [{"letter": "A", "text": "1,840c likely results from a decimal-point misplacement while converting 0.008% — using too large a decimal value for this tiny percentage significantly changes the resulting value of b."}, {"letter": "B", "text": "5,908c doesn't correctly combine both relationships — possibly only accounting for one of the two given percentage relationships instead of both."}, {"letter": "C", "text": "6,025c also doesn't align with the correct chain of calculations — likely from a different decimal or arithmetic slip somewhere in converting one of the two percentages."}], "desmos": ["Step 1: Open Desmos and set up the relationships directly. First type: a=59c to represent 'a is 5,900% of c.'", "Step 2: Type: c=0.00008b to represent 'c is 0.008% of b.'", "Step 3: To find b in terms of c, type: b=c/0.00008 — Desmos will show this simplifies to b = 12500c (you can verify by typing 1/0.00008 separately, which evaluates to 12500).", "Step 4: Finally, type a+b using the c-based expressions: 59c+12500c — Desmos will confirm this combines to 12559c, matching choice D. You can also plug in a specific test value for c (like c=1) to see the numeric results directly: with c=1, a=59 and b=12500, so a+b=12559."]}, {"gi": 6, "domain": "Percentages", "num": 3, "diff": "Hard", "gridin": false, "correct": "C", "rule": "Percent increase is always calculated as (the amount of increase) divided by (the ORIGINAL, starting value), then converted to a percentage by multiplying by 100 — never divide by the new/final value.", "tip": "When both the original and new values are given as multiples of the same variable (like t and 3.49t here), the variable will always cancel out completely in the percent-increase calculation — don't be intimidated by having a variable instead of a specific number; just follow the formula exactly as you would with numbers.", "why": "The increase in hours is 3.49t − t = 2.49t. The percent increase is (increase / original) × 100 = (2.49t / t) × 100 = 2.49 × 100 = 249%.", "steps": ["Step 1: Identify the original value (July hours): t.", "Step 2: Identify the new value (August hours): 3.49t.", "Step 3: Calculate the amount of increase: new value − original value = 3.49t − t = 2.49t.", "Step 4: Apply the percent increase formula: (increase / original value) × 100%.", "Step 5: Substitute the values: (2.49t / t) × 100%.", "Step 6: The t in the numerator and denominator cancels out completely: 2.49 × 100% = 249%.", "Step 7: This matches choice C."], "trap": "Choice B (3.49%) is the most commonly picked wrong answer — it mistakes the MULTIPLIER (3.49, representing the NEW total as a multiple of the original) for the percent INCREASE itself, without first subtracting 1 (or subtracting the original amount) to isolate just the increase.", "poe": [{"letter": "A", "text": "2.49% correctly identifies the coefficient of the increase (2.49) but forgets to convert this decimal into a percentage by multiplying by 100 — leaving it 100 times too small."}, {"letter": "B", "text": "3.49% confuses the total NEW amount's multiplier (3.49, meaning August is 3.49 times July) with the percent INCREASE — but a multiplier of 3.49 actually represents a 249% increase (since 3.49 = 1 + 2.49, meaning 100% of the original PLUS a 249% increase), not a 3.49% increase."}, {"letter": "D", "text": "349% incorrectly uses the full multiplier 3.49 converted directly to a percentage (349%) without first subtracting the original 100% (representing the unchanged portion) to isolate just the increase."}], "desmos": ["Step 1: Since this problem involves a variable (t) that cancels out, pick a simple test value to make it concrete — let's use t = 100 (100 hours in July). Step 2: Open Desmos and calculate August's hours: type 3.49*100 — this gives 349 hours in August.", "Step 3: Calculate the increase: type 349-100 — this gives 249 hours of increase.", "Step 4: Calculate the percent increase using the original (July) value as the base: type (249/100)*100 — Desmos will show this evaluates to 249, confirming a 249% increase and matching choice C.", "Step 5: Try this with a different test value for t (like t = 50) to confirm the percentage stays the same regardless of which specific value you pick — this confirms the variable genuinely cancels out in the percent-increase formula."]}, {"gi": 7, "domain": "Percentages", "num": 4, "diff": "Hard", "gridin": true, "correct": "2.31", "rule": "When a quantity increases by p%, the new total is always (100% + p%) of the original — expressed as a decimal multiplier, this is (1 + p/100). Never use just p/100 alone as the multiplier, since that would only represent the AMOUNT of increase, not the new TOTAL.", "tip": "Whenever you see 'increased by X%' and need to find a multiplier that gives you the NEW TOTAL directly (not just the increase amount), always add 1 to X/100 — this combines the original 100% (which is 1, in decimal form) with the X% increase.", "why": "Since the number of audiobooks increased by 131% from last year (n) to this year, the new total is the original 100% PLUS the 131% increase, totaling 231% of the original, or 2.31 as a decimal multiplier. Since this year's count is given as bn, this means b = 2.31.", "steps": ["Step 1: Understand what 'increased by 131%' means: the new amount equals the original amount (100%) PLUS an additional 131% increase, for a total of 100% + 131% = 231%.", "Step 2: Convert 231% into a decimal multiplier: 231/100 = 2.31.", "Step 3: Since the new amount is bn (b times the original n), and we just determined the new amount is 2.31 times the original, this means b = 2.31.", "Step 4: This is a grid-in question — enter 2.31 as your final answer."], "trap": "A common error on this problem is using 1.31 instead of 2.31 — this happens when a student converts 131% directly to a decimal (1.31) without recognizing that this decimal already represents the FULL new total's relationship to the original as an increase multiplier, but forgetting that 'increased BY 131%' means adding this to the original 100%, or alternatively, using just 0.31 or 1.31 by misunderstanding which part represents the total versus just the increase.", "poe": [], "desmos": ["Step 1: Since this problem involves the variable n, pick a simple test value to make it concrete — let's use n = 100 (100 audiobooks last year). Step 2: Open Desmos and calculate the increase amount: type 100*1.31 — this gives 131, representing the SIZE of the increase (131% of 100 is 131 additional audiobooks).", "Step 3: Calculate this year's total by adding the increase to the original: type 100+131 — this gives 231, the total number of audiobooks this year.", "Step 4: Since this year's count is bn, and n = 100, solve for b: type 231/100 — Desmos will show this equals 2.31, confirming b = 2.31 and matching your grid-in answer.", "One-variable data: distributions and measures of center and spread", "4 questions  ·  Easy 1  /  Medium 1  /  Hard 2"]}, {"gi": 8, "domain": "One-variable data: distributions and measures of center and spread", "num": 1, "diff": "Easy", "gridin": true, "correct": "6", "rule": "On a bar graph, the frequency of any specific data value is read directly from the HEIGHT of that value's bar, measured against the vertical (frequency) axis.", "tip": "Trace straight up from the data value you're asked about on the horizontal axis until you hit the top of its bar, then trace straight across (left) to read the exact height on the vertical axis — this two-step 'trace up, then trace across' method prevents misreading a neighboring bar.", "why": "Looking at the bar directly above the data value '2' on the horizontal axis, its height reaches exactly 6 on the frequency (vertical) axis.", "steps": ["Step 1: Locate '2' on the horizontal (data value) axis.", "Step 2: Trace straight up from that point until you reach the top of the bar directly above it.", "Step 3: From the top of that bar, trace straight across (left) to the vertical (frequency) axis to read its height.", "Step 4: The bar for data value 2 reaches a height of 6.", "Step 5: This is a grid-in question — enter 6 as your final answer."], "trap": "A common error on this type of problem is misreading an adjacent bar (like the bar for data value 1, which has height 4, or data value 3, which has height 3) instead of carefully tracing up from exactly '2' on the horizontal axis.", "poe": [], "desmos": ["This is a straightforward graph-reading question that doesn't require Desmos to solve — the answer (6) is read directly from the bar graph provided in the question. However, if you want to double check your reading, you could recreate the bar heights as a list in Desmos (typing the data values 1 through 6 and their corresponding frequencies 4, 6, 3, 8, 5, 9 as a table) and confirm that the frequency listed for data value 2 is indeed 6."]}, {"gi": 9, "domain": "One-variable data: distributions and measures of center and spread", "num": 2, "diff": "Medium", "gridin": false, "correct": "D", "rule": "Standard deviation measures how SPREAD OUT a data set is from its mean — a data set with values tightly clustered close together (especially with repeated identical values) will always have a SMALLER standard deviation than one with values spread far apart, even if both sets share the same mean.", "tip": "You don't need to calculate the exact standard deviation for problems like this — just visually compare how 'spread out' or 'clustered together' each list's values are. The list with values closest together (and most repeated identical values) will have the smallest standard deviation.", "why": "List D (53, 54, 54, 54, 55) has values clustered extremely tightly around 54, with three of the five values being EXACTLY 54 — this tight clustering around the mean gives it the smallest spread, and therefore the smallest standard deviation, compared to the other lists.", "steps": ["Step 1: Calculate (or estimate) the mean of each list — notice all four lists happen to have a mean of 54.", "Step 2: Since all means are equal, compare how far each list's individual values deviate from 54 — the list with the SMALLEST deviations overall will have the smallest standard deviation.", "Step 3: List A (51,52,54,56,57): deviations of −3,−2,0,2,3 — fairly spread out.", "Step 4: List B (52,52,54,56,56): deviations of −2,−2,0,2,2 — moderately spread out.", "Step 5: List C (52,53,54,55,56): deviations of −2,−1,0,1,2 — more tightly clustered.", "Step 6: List D (53,54,54,54,55): deviations of −1,0,0,0,1 — extremely tightly clustered, with three values exactly AT the mean.", "Step 7: List D has by far the smallest deviations from the mean, meaning it has the smallest standard deviation.", "Step 8: This matches choice D."], "trap": "Choice C is the most commonly picked wrong answer — its values are evenly and closely spaced (52 through 56, each one apart), which LOOKS tightly clustered, but list D's heavy repetition of the exact mean value (54 appearing three times) actually creates even less spread than C's evenly-spaced-but-still-varying values.", "poe": [{"letter": "A", "text": "List A has the widest range of values (51 to 57, a spread of 6) among all four lists, giving it the LARGEST standard deviation, not the smallest."}, {"letter": "B", "text": "List B has a moderate spread (52 to 56), larger than both C and D — its values aren't as tightly clustered around the mean as list D's."}, {"letter": "C", "text": "List C has evenly spaced values with no repeats, giving it a real but moderate spread — list D's heavy repetition of the exact mean (54 three times) creates even less variability than C's evenly distributed values."}], "desmos": ["Step 1: Open Desmos and enter each list as a set of points to calculate statistics. For list D, type: stdev({53,54,54,54,55})", "Step 2: Press Enter — Desmos will calculate and display the exact standard deviation for this list.", "Step 3: Repeat this same process for lists A, B, and C: stdev({51,52,54,56,57}), stdev({52,52,54,56,56}), and stdev({52,53,54,55,56})", "Step 4: Compare all four calculated standard deviations directly — you'll see list D's value is clearly the smallest of the four, confirming choice D without needing to estimate visually."]}, {"gi": 10, "domain": "One-variable data: distributions and measures of center and spread", "num": 3, "diff": "Hard", "gridin": false, "correct": "C", "rule": "The median of a data set is the MIDDLE value when all values are arranged in order (for an odd number of values), or the AVERAGE of the two middle values (for an even number of values). Removing a value that's far from the middle (like an outlier or error) often doesn't change the median at all.", "tip": "When a data set is described using a frequency table (value paired with how many times it occurs), first 'unroll' it into a full ordered list before trying to find the median — this makes it much easier to correctly count to the middle position(s), especially for larger data sets.", "why": "Data set A (11 values, unrolled from the table): 0, 0, 3, 3, 4, 4, 5, 5, 6, 7, 13. With 11 values, the median is the 6th value: counting in order, this is 4. After removing the erroneous 13, data set B (10 values): 0, 0, 3, 3, 4, 4, 5, 5, 6, 7. With 10 values (even), the median is the average of the 5th and 6th values: both are 4, so the median is (4+4)/2 = 4. Since both medians equal 4, they are equal.", "steps": ["Step 1: 'Unroll' the frequency table into a full ordered list for data set A: two 0's, two 3's, two 4's, two 5's, one 6, one 7, one 13 — giving: 0, 0, 3, 3, 4, 4, 5, 5, 6, 7, 13 (11 values total).", "Step 2: Find the median of data set A: with 11 values (an odd number), the median is the middle (6th) value. Counting through the ordered list: 1st=0, 2nd=0, 3rd=3, 4th=3, 5th=4, 6th=4. The median of set A is 4.", "Step 3: Create data set B by removing the erroneous value 13: 0, 0, 3, 3, 4, 4, 5, 5, 6, 7 (10 values total).", "Step 4: Find the median of data set B: with 10 values (an even number), the median is the average of the two middle values (the 5th and 6th). Counting through: 5th=4, 6th=4. The median of set B is (4+4)/2 = 4.", "Step 5: Compare the two medians: both data set A and data set B have a median of 4 — they are EQUAL.", "Step 6: This matches choice C."], "trap": "Choice A is the most commonly picked wrong answer — students sometimes assume that removing the largest value (13) from a data set must automatically lower the median, without actually counting through the ordered list to check whether 13 was anywhere near the middle position in the first place (it wasn't — it was the very last, most extreme value).", "poe": [{"letter": "A", "text": "Removing 13 (the LARGEST value, at the very end of the ordered list) doesn't affect which values sit in the MIDDLE of the data set — the median stays the same, not lower."}, {"letter": "B", "text": "Similarly, there's no reason removing the largest, most extreme value would cause the median to increase — the middle values of the data set are unaffected by removing an extreme outlier."}, {"letter": "D", "text": "Since the data set is fully known and given in the table (not an estimate or a sample), there IS enough information to precisely calculate and compare both medians — this choice incorrectly claims otherwise."}], "desmos": ["Step 1: Open Desmos and enter data set A as a full list based on the frequency table: median({0,0,3,3,4,4,5,5,6,7,13})", "Step 2: Press Enter — Desmos will calculate and display the median, confirming it equals 4.", "Step 3: On the next line, enter data set B (with 13 removed): median({0,0,3,3,4,4,5,5,6,7})", "Step 4: Press Enter — Desmos will show this median is also 4, confirming both medians are equal and verifying choice C."]}, {"gi": 11, "domain": "One-variable data: distributions and measures of center and spread", "num": 4, "diff": "Hard", "gridin": false, "correct": "C", "rule": "When a data set has unknown values mixed with known ones, use the GIVEN statistics (mean, median, range) as separate equations — the mean gives you a SUM equation, the median tells you which position (or unknown) sits in the middle, and the range gives you a MAX-MINUS-MIN equation. Solve this small system of equations together.", "tip": "Since the data set is already given in ascending order, use that order to immediately identify which position corresponds to the median (the exact middle value for an odd-count list) — this often directly tells you the value of one of the unknowns without any calculation.", "why": "With 7 values in ascending order (a, 26, 29, b, 31, 47, c), the median is the 4th value, which is b. Since the median is given as 29, this means b = 29. The mean is 36, so the sum of all 7 values is 7 × 36 = 252. Substituting known values: a + 26 + 29 + 29 + 31 + 47 + c = 252, which simplifies to a + c + 162 = 252, so a + c = 90. The range is 72, and since the list is in ascending order, the range equals the largest value minus the smallest: c − a = 72. Now solve the system: a + c = 90 and c − a = 72. Adding these two equations: 2c = 162, so c = 81.", "steps": ["Step 1: Since the 7 values are listed in ascending order (a, 26, 29, b, 31, 47, c), identify the median's position: for 7 values, the median is the 4th (middle) value, which is b.", "Step 2: Since the median is given as 29, set b = 29.", "Step 3: Use the mean to find the sum of all values: mean × count = sum, so 36 × 7 = 252.", "Step 4: Substitute all known values into the sum equation: a + 26 + 29 + 29 + 31 + 47 + c = 252.", "Step 5: Add up the known numbers: 26 + 29 + 29 + 31 + 47 = 162. The equation becomes: a + c + 162 = 252.", "Step 6: Solve for a + c: a + c = 252 − 162 = 90.", "Step 7: Use the range (largest minus smallest): since the list is ascending, the range is c − a = 72.", "Step 8: Now solve this system of two equations: a + c = 90 and c − a = 72. Add both equations together: (a+c) + (c−a) = 90 + 72, which simplifies to 2c = 162.", "Step 9: Divide both sides by 2: c = 81.", "Step 10: This matches choice C."], "trap": "Choice A (54) is the most commonly picked wrong answer — it typically results from solving only one of the two equations (like using just the range equation with an incorrect assumed value for a) without properly setting up and solving the full system using both the mean AND range information together.", "poe": [{"letter": "A", "text": "54 doesn't satisfy both the sum equation (a+c=90) and the range equation (c−a=72) simultaneously — it likely comes from an incomplete calculation using only one piece of given information."}, {"letter": "B", "text": "72 is actually the value of the RANGE itself (given in the problem), not the value of c — a student might mistakenly select the given range number instead of solving for c."}, {"letter": "D", "text": "98 doesn't satisfy the system of equations either — if c = 98, then from c − a = 72, a would be 26, but then a + c = 26 + 98 = 124, which doesn't match the required sum of 90."}], "desmos": ["Step 1: Open Desmos and set up the two equations from the problem as a system. First type: a+c=90", "Step 2: Type the second equation: c-a=72", "Step 3: Desmos will treat these as two lines if you use x and y instead — replace a with x and c with y: x+y=90 and y-x=72", "Step 4: Press Enter after each — Desmos graphs both lines and shows their intersection point when you click on it.", "Step 5: The intersection point will show x = 9 (the value of a) and y = 81 (the value of c), confirming c = 81 and matching choice C.", "Two-variable data: models and scatterplots", "3 questions  ·  Easy 1  /  Medium 2  /  Hard 0"]}, {"gi": 12, "domain": "Two-variable data: models and scatterplots", "num": 1, "diff": "Easy", "gridin": false, "correct": "B", "rule": "For an exponential model y = a(b)^x, the constant 'a' (the coefficient out front) represents the STARTING value (the y-intercept, where x = 0), and the base 'b' tells you whether the data is growing (b > 1) or decaying (b < 1). Match both features to the scatterplot's visual pattern.", "tip": "Always check the y-intercept FIRST on an exponential scatterplot — it should closely match the leading coefficient 'a' in the correct equation. Then check whether the data is rising or falling overall to determine if the base should be greater than or less than 1.", "why": "The scatterplot shows data starting at approximately y = 43 when x = 0, and clearly INCREASING (growing) as x increases up to 50. This matches a = 43 (the starting value) and a base greater than 1 with a POSITIVE exponent (1.04)^x, giving y = 43(1.04)^x.", "steps": ["Step 1: Read the y-intercept directly from the scatterplot: the leftmost point (at x = 0) sits at approximately y = 43.", "Step 2: Observe the overall trend of the data: as x increases from 0 to 50, y clearly increases (grows) from about 43 up to nearly 290 — this is GROWTH, not decay.", "Step 3: Match these observations to the exponential model form y = a(b)^x: the starting value a should be approximately 43, and since the data is growing, the exponent should be POSITIVE x (not negative x, which would represent decay).", "Step 4: This matches choice B: y = 43(1.04)^x."], "trap": "Choice A is the most commonly picked wrong answer — it uses the correct starting value (43) but a NEGATIVE exponent (−x), which would actually make the function DECREASE as x increases, contradicting the clearly increasing pattern shown in the scatterplot.", "poe": [{"letter": "A", "text": "The negative exponent (−x) would make this function DECREASE as x increases, but the scatterplot clearly shows the data values GROWING over time — this doesn't match the visual trend."}, {"letter": "C", "text": "Starting at 288 doesn't match the scatterplot's y-intercept, which is clearly close to 43 (the point at x=0), not near 288 — this starting value belongs to a very different curve."}, {"letter": "D", "text": "Similarly, this uses 288 as the starting value, which doesn't match the scatterplot's actual y-intercept of approximately 43 — the growth direction (positive exponent) is correct, but the starting point is wrong."}], "desmos": ["Step 1: Open Desmos and type the candidate equation: y=43(1.04)^x", "Step 2: Press Enter — Desmos graphs this curve.", "Step 3: Compare this graph to the scatterplot given in the question — check that the curve passes close to the plotted points, starting near (0, 43) and rising to approximately (50, 290).", "Step 4: If the curve fits the scattered points well, you've confirmed choice B. You can also try graphing the other choices (like y=288(1.04)^x) to see how poorly they fit the actual data points, reinforcing why B is the best model."]}, {"gi": 13, "domain": "Two-variable data: models and scatterplots", "num": 2, "diff": "Medium", "gridin": false, "correct": "C", "rule": "The slope of a line of best fit represents the RATE OF CHANGE between the two variables graphed — specifically, how much the DEPENDENT variable (on the y-axis) changes for every one-unit increase in the INDEPENDENT variable (on the x-axis). Always identify which variable is on which axis before interpreting the slope in context.", "tip": "Read the axis labels carefully before interpreting slope — the correct interpretation must have the y-axis variable as the one that 'increases' and the x-axis variable as the one changing 'per' some amount. Answer choices that swap these two roles are testing whether you're reading the graph correctly.", "why": "On this scatterplot, x represents the number of seeds PLANTED, and y represents the number of seeds that GERMINATED. The slope of the line of best fit, estimated from the graph (rising from about (0,30) to (500,310), giving a slope of about 280/500 = 0.56, closest to 60/100 = 0.6), means that for every 100 additional seeds planted, approximately 60 more seeds are predicted to germinate.", "steps": ["Step 1: Identify which variable is on the x-axis (independent/input variable) and which is on the y-axis (dependent/output variable): x = number of seeds planted, y = number of seeds that germinated.", "Step 2: Estimate two points on the line of best fit from the graph: approximately (0, 30) and (500, 310).", "Step 3: Calculate the slope using these two points: slope = (310 − 30) / (500 − 0) = 280/500 = 0.56.", "Step 4: Compare this slope to the answer choices, which are given as 'X seeds per 100 seeds': 0.56 is closest to 60/100 = 0.60.", "Step 5: Since the slope relates y (germinated) to x (planted), the correct interpretation must describe germinated seeds increasing per planted seeds — not the reverse.", "Step 6: This matches choice C: 'The number of seeds that germinate is predicted to increase by 60 seeds for every additional 100 seeds that are planted.'"], "trap": "Choice A is the most commonly picked wrong answer — it has the correct approximate slope value (60 per 100) but describes the WRONG variable as increasing (seeds planted, the independent/x-axis variable, rather than seeds germinated, the dependent/y-axis variable) — this reverses the cause-and-effect direction the slope actually represents.", "poe": [{"letter": "A", "text": "This describes 'seeds planted' as the variable that increases — but seeds planted is the INDEPENDENT variable (x-axis), which the researchers choose directly; it's seeds GERMINATED (y-axis) that responds to and increases with planting, not the reverse."}, {"letter": "B", "text": "This has the same variable-reversal issue as A, plus uses the wrong slope magnitude (300 instead of approximately 60) — doesn't match the graph's actual slope."}, {"letter": "D", "text": "This correctly identifies germinated seeds as the increasing variable but uses the wrong slope magnitude (300 per 100, which would be a much steeper line than what's shown) — the actual slope is closer to 60 per 100, not 300."}], "desmos": ["Step 1: Open Desmos and estimate several points from the scatterplot to check the line of best fit's slope. Type a few points you can read from the graph, like: (100,90), (200,120), (350,215), (450,315)", "Step 2: Desmos will plot these points. To find a best-fit line, click the '+' button and look for a regression feature, or manually type: y1~mx+b and Desmos will calculate the best-fit slope (m) and intercept (b) automatically using linear regression.", "Step 3: Check the calculated slope value — it should be close to 0.56 to 0.6, confirming that for every 100 seeds planted (x), about 60 seeds are predicted to germinate t": "B", "rule": "For conditional probability problems with percentages, first add up ONLY the percentages that satisfy the GIVEN condition to find the new total, then divide the specific percentage you're looking for by this new (reduced) total — not by 100%.", "tip": "Rewrite the 'given that' condition as its own smaller, self-contained group first — add up just the relevant percentages to get a new 'whole' for that group, then calculate the requested probability as a fraction of THAT smaller whole, not the original 100%.", "why": "'Given that the room has a seating capacity of at least 18 seats' means combining the '18–40 seats,' '41–65 seats,' and 'greater than 65 seats' categories: 21% + 29% + 24% = 74%. Within this 74% group, the probability of 'greater than 65 seats' is 24% ÷ 74% ≈ 0.3243, which rounds to approximately 0.32.", "steps": ["Step 1: Identify the given condition: 'seating capacity of at least 18 seats' — this includes the '18–40 seats,' '41–65 seats,' and 'greater than 65 seats' categories (everything except 'less than 18 seats').", "Step 2: Add up the percentages for these three categories to find the new total: 21% + 29% + 24% = 74%.", "Step 3: Identify what we're looking for within this reduced group: rooms with 'greater than 65 seats,' which is 24%.", "Step 4: Calculate the conditional probability by dividing the specific percentage by the new total: 24% / 74% ≈ 0.3243.", "Step 5: Rounding to match the answer choices, this is closest to 0.32.", "Step 6: This matches choice B."], "trap": "Choice A (0.24) is the most commonly picked wrong answer — it uses the original 24% directly as the answer, forgetting to divide by the reduced total (74%) that accounts for the 'given that' condition — this would be the correct answer only if the question asked for the UNCONDITIONAL probability across all rooms, not the conditional probability.", "poe": [{"letter": "A", "text": "0.24 is simply the original percentage for 'greater than 65 seats' without adjusting for the 'given that' condition — this ignores the conditional nature of the question entirely."}, {"letter": "C", "text": "0.50 doesn't correspond to a correct calculation from this table — likely a distractor or a significant miscalculation."}, {"letter": "D", "text": "0.92 might come from dividing the wrong two percentages together, or from a completely different (incorrect) combination of the given values."}], "desmos": ["Step 1: Open Desmos and calculate the new total for the 'given' condition: type 21+29+24 — this confirms 74% is the combined total for rooms with at least 18 seats.", "Step 2: Calculate the conditional probability: type 24/74 — Desmos will evaluate this to approximately 0.3243.", "Step 3: Compare this decimal to the answer choices — 0.3243 rounds to 0.32, confirming choice B.", "Inference from sample statistics and margin of error", "3 questions  ·  Easy 0  /  Medium 2  /  Hard 1"]}, {"gi": 17, "domain": "Inference from sample statistics and margin of error", "num": 1, "diff": "Medium", "gridin": false, "correct": "A", "rule": "A confidence interval (the range given for an estimate) is always constructed as (sample estimate) ± (margin of error). This means the margin of error is exactly HALF the total width of the interval, or equivalently, the distance from the sample mean to either endpoint of the interval.", "tip": "To find the margin of error from a given interval, you don't need the full formula — simply subtract the sample mean from the UPPER endpoint (or subtract the LOWER endpoint from the sample mean); both calculations give you the same margin of error value.", "why": "The sample mean is 16.59mm, and the interval's upper bound is 17.32mm. The margin of error is the difference: 17.32 − 16.59 = 0.73. (You can double check: the lower bound is 16.59 − 0.73 = 15.86, which matches the given lower bound exactly.)", "steps": ["Step 1: Identify the sample mean (the central estimate): 16.59 millimeters.", "Step 2: Identify one endpoint of the confidence interval — let's use the upper bound: 17.32 millimeters.", "Step 3: Calculate the margin of error by finding the difference between the upper bound and the sample mean: 17.32 − 16.59 = 0.73.", "Step 4: Double-check using the lower bound: sample mean − margin of error should equal the lower bound: 16.59 − 0.73 = 15.86, which matches the given lower bound exactly, confirming the calculation.", "Step 5: This matches choice A."], "trap": "Choice C (15.86) is the most commonly picked wrong answer — it directly uses the LOWER BOUND of the interval as if it were the margin of error itself, rather than correctly calculating the DIFFERENCE between the sample mean and that bound.", "poe": [{"letter": "B", "text": "2.19 doesn't correspond to a direct calculation from the given numbers — possibly from adding instead of subtracting, or another arithmetic slip."}, {"letter": "C", "text": "15.86 is simply the LOWER BOUND of the confidence interval itself, not the margin of error — the margin of error is the DISTANCE between the mean and this bound, not the bound's value directly."}, {"letter": "D", "text": "16.59 is simply the SAMPLE MEAN itself, not the margin of error — selecting this confuses the central estimate with the amount of uncertainty around it."}], "desmos": ["Step 1: Open Desmos and calculate the margin of error directly: type 17.32-16.59", "Step 2: Press Enter — Desmos will evaluate this to 0.73, confirming the margin of error and matching choice A.", "Step 3: As a double check, verify using the lower bound instead: type 16.59-15.86 — this should ALSO give 0.73, confirming your answer is consistent from both directions of the interval."]}, {"gi": 18, "domain": "Inference from sample statistics and margin of error", "num": 2, "diff": "Medium", "gridin": false, "correct": "A", "rule": "In statistical sampling, INCREASING the sample size always tends to DECREASE the margin of error (making the estimate more precise), while decreasing the sample size increases the margin of error. This is because larger samples give a more reliable, representative picture of the full population.", "tip": "Remember this general relationship as an inverse one: sample size UP means margin of error DOWN, and sample size DOWN means margin of error UP. This relationship holds true across virtually all standard statistical sampling methods, so you can answer these conceptual questions without any calculation.", "why": "Since 230 participants is a LARGER sample than 115 participants (twice as large), using this larger sample would be expected to produce a MORE precise (narrower) estimate — meaning a LOWER margin of error compared to the smaller sample.", "steps": ["Step 1: Compare the two sample sizes being considered: 115 participants versus 230 participants.", "Step 2: Recognize that 230 is the LARGER of the two sample sizes (twice as large as 115).", "Step 3: Apply the general statistical principle: larger sample sizes lead to more precise estimates, which means a SMALLER (lower) margin of error.", "Step 4: Since the question asks about the effect of using the LARGER sample (230) compared to the smaller one (115), the expected effect is a LOWER margin of error.", "Step 5: This matches choice A."], "trap": "Choice B is the most commonly picked wrong answer — it reverses the correct relationship, assuming that MORE data somehow leads to a HIGHER margin of error (more 'noise' or uncertainty), when in fact more data generally REDUCES uncertainty and produces a tighter, more reliable estimate.", "poe": [{"letter": "B", "text": "This reverses the true relationship between sample size and margin of error — larger samples produce LOWER margins of error (more precision), not higher ones."}, {"letter": "C", "text": "The sample size affects the PRECISION of the estimate (the margin of error), not necessarily the reported average value itself — a larger sample doesn't systematically make the average number of hours lower."}, {"letter": "D", "text": "Similarly, sample size doesn't systematically make the reported average HIGHER either — it affects how precise (narrow) the margin of error is around whatever the true average happens to be."}], "desmos": ["This is a conceptual statistics question about the relationship between sample size and margin of error, which doesn't require a specific calculation in Desmos. However, if you want to explore this relationship numerically, margin of error in many standard formulas is proportional to 1/√(sample size) — you could type sqrt(115) and sqrt(230) into Desmos to compare: you'll see sqrt(230) is larger than sqrt(115), and since margin of error is roughly proportional to 1 divided by this square root, a LARGER sample size (230) corresponds to a SMALLER margin of error, confirming choice A conceptually."]}, {"gi": 19, "domain": "Inference from sample statistics and margin of error", "num": 3, "diff": "Hard", "gridin": false, "correct": "D", "rule": "For simple random sampling, the margin of error is inversely proportional to the SQUARE ROOT of the sample size — meaning if you increase the sample size by some factor, the margin of error decreases by the square root of that same factor, not by the factor itself.", "tip": "When a sample size DOUBLES, don't assume the margin of error simply halves — because of the square-root relationship, doubling the sample size only shrinks the margin of error by a factor of √2 (about 1.41), not by a full factor of 2. Recognizing this square-root relationship (rather than a direct proportional one) is the key insight for these problems.", "why": "Doubling the sample size from 1,020 to 2,040 people means the margin of error decreases by a factor of √2 ≈ 1.414. So the new margin of error is approximately 2.13% ÷ 1.414 ≈ 1.506%, which is LESS than the original 2.13%.", "steps": ["Step 1: Identify the relationship between sample size and margin of error: margin of error is inversely proportional to the square root of the sample size.", "Step 2: ry a few other sample size ratios (like tripling the sample, using sqrt(3) instead of sqrt(2)) to build intuition for how margin of error shrinks more slowly than the sample size grows — this square-root relationship is a recurring theme in AP Statistics and college-level statistics as well."]}];

  function screenTitle(t){
    switch(t.screen){
      case "signin": return "CLC SAT Practice";
      case "welcome": return "Welcome";
      case "home": return "CLC SAT Practice";
      case "section": return SECTIONS[t.params.key].title;
      case "englishsub": return ENGLISH_SUBCATS.filter(function(x){return x.key===t.params.key;})[0].label;
      case "mathsub": return MATH_SUBCATS.filter(function(x){return x.key===t.params.key;})[0].label;
      case "mathTheoryTopic": return t.params.topic.label;
      case "workedBrowser": return t.params.domain;
      case "geoDomain": return t.params.d.domain;
      case "geoQuiz": return t.params.d.domain;
      case "geoQuizResult": return t.params.d.domain + " — Results";
      case "topic": return t.params.topic.label;
      case "quiz": return t.params.topic.label;
      case "quizresult": return t.params.topic.label + " — Results";
      default: return "CLC SAT Practice";
    }
  }

  function renderScreen(t){
    switch(t.screen){
      case "signin": return screenSignin();
      case "welcome": return screenWelcome();
      case "home": return screenHome();
      case "section": return screenSection(t.params.key);
      case "englishsub": return screenEnglishSub(t.params.key);
      case "mathsub": return screenMathSub(t.params.key);
      case "mathTheoryTopic": return screenMathTheoryTopic(t.params.topic);
      case "workedBrowser": return screenWorkedBrowser(t.params);
      case "geoDomain": return screenGeoDomain(t.params.d);
      case "geoQuiz": return screenGeoQuiz(t.params);
      case "geoQuizResult": return screenGeoQuizResult(t.params);
      case "topic": return screenTopic(t.params.topic);
      case "quiz": return screenQuiz(t.params);
      case "quizresult": return screenQuizResult(t.params);
      default: return "<p>Not found.</p>";
    }
  }

  var ADVMATH_QUESTIONS = [{"gi": 1, "domain": "Nonlinear functions", "num": 1, "diff": "Easy", "gridin": false, "id": "3cf2698e", "correct": "B", "rule": "For exponential growth or decay problems, the general model is: (final amount) = (initial amount) × (growth factor)^(number of periods elapsed). When something DOUBLES every fixed time interval, the growth factor is exactly 2, and the exponent should represent 'how many complete doubling periods have occurred' — usually written as x divided by the length of one period.", "tip": "Translate the words into the model piece by piece before looking at answer choices: 'doubles' tells you the base of the exponent is 2 (not 1/2, which would be halving/decay). 'Every 25 minutes' tells you the exponent must be x/25, so that when x = 25, the exponent equals exactly 1 (one full doubling).", "why": "The initial amount is 830 cells. Since the population doubles (multiplies by 2) every 25 minutes, the growth factor per minute is 2^(1/25), and after x minutes the population has gone through x/25 doubling periods. This gives f(x) = 830(2)^(x/25), matching choice B.", "steps": ["Step 1: Identify the initial amount: 830 cells (given directly in the problem).", "Step 2: Identify the growth factor: the population 'doubles,' so the base of the exponential is 2 (not 1/2 — that would represent something halving, or decaying, not growing).", "Step 3: Identify the time period: doubling happens 'every 25 minutes,' so the exponent must be x/25 — this way, when x = 25 minutes have passed, the exponent is 25/25 = 1, giving exactly one full doubling.", "Step 4: Assemble the full function: f(x) = (initial amount) × (growth factor)^(x / period) = 830(2)^(x/25).", "Step 5: This matches choice B."], "trap": "Choice A is the most commonly picked wrong answer — it uses 1/2 as the base instead of 2, which would model the population being cut IN HALF every 25 minutes (decay) rather than doubling (growth) — a direct misreading of 'doubles' as 'halves.'", "poe": [{"letter": "A", "text": "Using 1/2 as the base models decay (the population shrinking by half each period), which is the opposite of 'doubles' — this misreads growth as decay."}, {"letter": "C", "text": "Using 1/3 as the base doesn't correspond to anything in the problem — there's no tripling or thirding described, and it's also a decay-style base (less than 1)."}, {"letter": "D", "text": "Using 3 as the base would model the population TRIPLING every 25 minutes, not doubling — this doesn't match the given growth rate."}], "desmos": ["Step 1: Open Desmos and type the function you derived: f(x)=830(2)^(x/25)", "Step 2: Press Enter — Desmos will graph this exponential curve, which should start at (0, 830) and rise steeply as x increases.", "Step 3: Use the table feature (click '+' then table) and enter x = 25 — the output should show f(25) = 830(2)^1 = 1660, exactly double the starting amount, confirming the doubling behavior described in the problem.", "Step 4: Enter x = 50 in the table as well — you should see f(50) = 830(2)^2 = 3320, which is double 1660, confirming the population doubles again after another 25 minutes, verifying your equation and choice B."]}, {"gi": 2, "domain": "Nonlinear functions", "num": 2, "diff": "Easy", "gridin": false, "id": "fe62f031", "correct": "A", "rule": "Shifting a graph UP by a certain number of units means adding that number directly to the entire function's output — for any function y = f(x), shifting up k units gives the new function y = f(x) + k. Shifting DOWN would instead subtract k.", "tip": "Remember the direction rule: shifting UP always means ADDING a positive constant to the whole function (outside any exponents or parentheses affecting x), and shifting DOWN always means SUBTRACTING. Don't confuse this with horizontal shifts, which affect x INSIDE the function and work in the opposite, 'backwards' direction.", "why": "Since g is the result of shifting f up by 4 units, and f(x) = 3x^5, the new function is g(x) =
