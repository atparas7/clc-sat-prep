  var ADVMATH_QUESTIONS = [{"gi": 1, "domain": "Nonlinear functions", "num": 1, "diff": "Easy", "gridin": false, "correct": "B", "rule": "For exponential growth or decay problems, the general model is: (final amount) = (initial amount) × (growth factor)^(number of periods elapsed). When something DOUBLES every fixed time interval, the growth factor is exactly 2, and the exponent should represent 'how many complete doubling periods have occurred' — usually written as x divided by the length of one period.", "tip": "Translate the words into the model piece by piece before looking at answer choices: 'doubles' tells you the base of the exponent is 2 (not 1/2, which would be halving/decay). 'Every 25 minutes' tells you the exponent must be x/25, so that when x = 25, the exponent equals exactly 1 (one full doubling).", "why": "The initial amount is 830 cells. Since the population doubles (multiplies by 2) every 25 minutes, the growth factor per minute is 2^(1/25), and after x minutes the population has gone through x/25 doubling periods. This gives f(x) = 830(2)^(x/25), matching choice B.", "steps": ["Step 1: Identify the initial amount: 830 cells (given directly in the problem).", "Step 2: Identify the growth factor: the population 'doubles,' so the base of the exponential is 2 (not 1/2 — that would represent something halving, or decaying, not growing).", "Step 3: Identify the time period: doubling happens 'every 25 minutes,' so the exponent must be x/25 — this way, when x = 25 minutes have passed, the exponent is 25/25 = 1, giving exactly one full doubling.", "Step 4: Assemble the full function: f(x) = (initial amount) × (growth factor)^(x / period) = 830(2)^(x/25).", "Step 5: This matches choice B."], "trap": "Choice A is the most commonly picked wrong answer — it uses 1/2 as the base instead of 2, which would model the population being cut IN HALF every 25 minutes (decay) rather than doubling (growth) — a direct misreading of 'doubles' as 'halves.'", "poe": [{"letter": "A", "text": "Using 1/2 as the base models decay (the population shrinking by half each period), which is the opposite of 'doubles' — this misreads growth as decay."}, {"letter": "C", "text": "Using 1/3 as the base doesn't correspond to anything in the problem — there's no tripling or thirding described, and it's also a decay-style base (less than 1)."}, {"letter": "D", "text": "Using 3 as the base would model the population TRIPLING every 25 minutes, not doubling — this doesn't match the given growth rate."}], "desmos": ["Step 1: Open Desmos and type the function you derived: f(x)=830(2)^(x/25)", "Step 2: Press Enter — Desmos will graph this exponential curve, which should start at (0, 830) and rise steeply as x increases.", "Step 3: Use the table feature (click '+' then table) and enter x = 25 — the output should show f(25) = 830(2)^1 = 1660, exactly double the starting amount, confirming the doubling behavior described in the problem.", "Step 4: Enter x = 50 in the table as well — you should see f(50) = 830(2)^2 = 3320, which is double 1660, confirming the population doubles again after another 25 minutes, verifying your equation and choice B."]}, {"gi": 2, "domain": "Nonlinear functions", "num": 2, "diff": "Easy", "gridin": false, "correct": "A", "rule": "Shifting a graph UP by a certain number of units means adding that number directly to the entire function's output — for any function y = f(x), shifting up k units gives the new function y = f(x) + k. Shifting DOWN would instead subtract k.", "tip": "Remember the direction rule: shifting UP always means ADDING a positive constant to the whole function (outside any exponents or parentheses affecting x), and shifting DOWN always means SUBTRACTING. Don't confuse this with horizontal shifts, which affect x INSIDE the function and work in the opposite, 'backwards' direction.", "why": "Since g is the result of shifting f up by 4 units, and f(x) = 3x^5, the new function is g(x) = f(x) + 4 = 3x^5 + 4, matching choice A.", "steps": ["Step 1: Write down the original function: f(x) = 3x^5.", "Step 2: Recall the rule for vertical shifts: shifting a graph UP by k units means adding k to the entire function, giving g(x) = f(x) + k.", "Step 3: Substitute k = 4 (since the graph shifts up 4 units) and the original function: g(x) = 3x^5 + 4.", "Step 4: This matches choice A."], "trap": "Choice B is the most commonly picked wrong answer — it subtracts 4 instead of adding it, which would represent shifting the graph DOWN 4 units rather than UP, a direct sign confusion between the two vertical shift directions.", "poe": [{"letter": "B", "text": "Subtracting 4 (3x^5 − 4) represents a shift DOWN 4 units, not UP — this reverses the direction described in the problem."}, {"letter": "C", "text": "3x^20 changes the EXPONENT of x rather than adding a constant — this would represent a completely different type of transformation (not a simple vertical shift at all), and doesn't match 'shifting up.'"}, {"letter": "D", "text": "12x^5 multiplies the entire function by 4 (a vertical stretch) rather than adding 4 (a vertical shift) — stretching and shifting are different transformations."}], "desmos": ["Step 1: Open Desmos and type the original function: f(x)=3x^5", "Step 2: Press Enter — Desmos graphs this curve.", "Step 3: On the next line, type the proposed answer: g(x)=f(x)+4", "Step 4: Press Enter — Desmos graphs g(x) as well, and you'll visually see it's the exact same S-shaped curve as f(x), just moved straight up by 4 units (compare where each curve crosses the y-axis: f crosses at 0, g should cross at 4).", "Step 5: To double check, use the table feature for both functions at the same x-value (like x = 1): f(1) = 3, and g(1) should be exactly 3 + 4 = 7 — confirming the vertical shift is working correctly and matches choice A."]}, {"gi": 3, "domain": "Nonlinear functions", "num": 3, "diff": "Medium", "gridin": false, "correct": "C", "rule": "In an exponential model of the form y = a(b)^x, the constant 'a' (the number OUTSIDE the parentheses, not raised to any power) always represents the STARTING value — the value of y when x = 0, which corresponds to 'time zero,' i.e., right at the very beginning before any time has passed.", "tip": "Whenever a question asks for the value 'at the time it was purchased' or 'initially' or 'at the start,' that's asking for the value at x = 0 — and in any exponential equation, plugging in x = 0 makes the entire exponent term equal 1 (since anything to the power of 0 is 1), leaving just the leading constant 'a' by itself.", "why": "At the time of purchase, x = 0 years have passed. Substituting x = 0 into y = 7,400(0.87)^x gives y = 7,400(0.87)^0 = 7,400 × 1 = 7,400, since any nonzero number raised to the power of 0 equals 1.", "steps": ["Step 1: Recognize that 'at the time it was purchased' means x = 0 (no years have passed yet).", "Step 2: Substitute x = 0 into the given equation: y = 7,400(0.87)^0.", "Step 3: Recall that any nonzero base raised to the power of 0 equals 1: (0.87)^0 = 1.", "Step 4: Simplify: y = 7,400 × 1 = 7,400.", "Step 5: This matches choice C."], "trap": "Choice A (740) is the most commonly picked wrong answer — it results from a decimal-place error, such as accidentally dividing 7,400 by 10, rather than correctly evaluating (0.87)^0 as exactly 1.", "poe": [{"letter": "A", "text": "740 is off by a factor of 10 from the correct starting value — likely from a decimal-point slip rather than correctly evaluating the zero exponent."}, {"letter": "B", "text": "6,438 comes from actually multiplying 7,400 by 0.87 (as if x = 1, one year later), rather than using x = 0 for the very start."}, {"letter": "D", "text": "8,700 doesn't correspond to a natural calculation from this equation — likely confused with a different number from the problem or a distractor."}], "desmos": ["Step 1: Open Desmos and type the given equation: y=7400(0.87)^x", "Step 2: Press Enter — Desmos graphs this decreasing exponential curve.", "Step 3: Use the table feature (click '+' then table) and enter x = 0 in the x-column.", "Step 4: Look at the corresponding y-value in the table — it will show exactly 7400, confirming that the value at the time of purchase (x = 0) is $7,400, matching choice C.", "Step 5: As an extra visual check, look at where the curve crosses the y-axis on the graph — this crossing point IS the y-intercept, which always represents the x = 0 value, and you should see it lines up with y = 7400."]}, {"gi": 4, "domain": "Nonlinear functions", "num": 4, "diff": "Medium", "gridin": false, "correct": "B", "rule": "When solving an equation where the variable is in the exponent and both sides can be written as powers of the SAME base, rewrite both sides using that common base, then set the exponents equal to each other — this converts an exponential equation into a simple linear equation you can solve directly.", "tip": "Before trying logarithms or a calculator, check whether the number on the other side of the equation (here, 10,000) can be written as a power of the SAME base already in the equation (here, base 10). If it can, this shortcut is much faster than any other method.", "why": "Rewrite 10,000 as a power of 10: 10,000 = 10^4. Now the equation 10^(5x−8) = 10^4 has matching bases, so the exponents must be equal: 5x − 8 = 4. Solving: 5x = 12, so x = 12/5.", "steps": ["Step 1: Start with the given equation: g(x) = 10^(5x−8), and we want g(x) = 10,000.", "Step 2: Set up the equation: 10^(5x−8) = 10,000.", "Step 3: Rewrite 10,000 as a power of 10: 10,000 = 10 × 10 × 10 × 10 = 10^4.", "Step 4: Now both sides have the same base (10): 10^(5x−8) = 10^4.", "Step 5: Since the bases match, set the exponents equal to each other: 5x − 8 = 4.", "Step 6: Add 8 to both sides: 5x = 12.", "Step 7: Divide both sides by 5: x = 12/5.", "Step 8: This matches choice B."], "trap": "Choice A (11/5) is the most commonly picked wrong answer — it typically results from an arithmetic slip while solving 5x − 8 = 4, such as adding 8 incorrectly or misreading the exponent 4 as a different number during the final steps.", "poe": [{"letter": "A", "text": "11/5 doesn't satisfy 5x − 8 = 4 — plugging x = 11/5 back in gives 5(11/5) − 8 = 11 − 8 = 3, not 4, so this doesn't actually solve the equation correctly."}, {"letter": "C", "text": "3 would come from a completely different (incorrect) exponent equation, not from correctly setting 5x − 8 = 4."}, {"letter": "D", "text": "4 is the value of the EXPONENT (4) itself, not the value of x — a student who correctly identifies 10,000 = 10^4 but then stops there, forgetting to actually solve 5x − 8 = 4 for x, might mistakenly select 4."}], "desmos": ["Step 1: Open Desmos and type the original function: g(x)=10^(5x-8)", "Step 2: Press Enter — Desmos graphs this steep exponential curve.", "Step 3: To find where g(x) = 10,000, type a second equation on the next line: y=10000 — this creates a flat horizontal line at height 10,000.", "Step 4: Look for where the two graphs (the curve and the horizontal line) intersect — click directly on that intersection point, and Desmos will display its exact coordinates.", "Step 5: The x-coordinate of that intersection point will show 2.4 (which is the decimal form of 12/5), confirming x = 12/5 and matching choice B."]}, {"gi": 5, "domain": "Nonlinear functions", "num": 5, "diff": "Hard", "gridin": false, "correct": "B", "rule": "For an exponential function of the form y = A(base)^(x+c) − b (where the base is greater than 1, making it an increasing exponential), the graph has a horizontal asymptote at y = −b and is always strictly increasing. A strictly increasing curve with a single horizontal asymptote crosses the x-axis EXACTLY ONCE if the asymptote is below the x-axis (negative), and NEVER crosses if the asymptote is above or on the x-axis.", "tip": "For these 'how many times does the graph cross the x-axis' questions with exponential functions, you don't need to solve any equation — just figure out the sign of the horizontal asymptote (the value the function approaches but never reaches) and whether the function is increasing or decreasing. This alone tells you the crossing count.", "why": "Since a > 7, the base a/7 is greater than 1, meaning the exponential term (a/7)^(x+c) is always positive and grows as x increases — this makes the whole function strictly increasing. As x approaches negative infinity, the exponential term approaches 0, so y approaches −b. Since b is a positive constant, −b is negative, meaning the graph's horizontal asymptote sits below the x-axis. A strictly increasing curve that starts near a negative asymptote and increases without bound must cross the x-axis exactly once.", "steps": ["Step 1: Identify the base of the exponential term: a/7. Since the problem states a > 7, this means a/7 > 1, so the exponential term is a GROWING (increasing) exponential, not a decaying one.", "Step 2: Determine the horizontal asymptote: as x → −∞, (a/7)^(x+c) → 0, so y → 0 − b = −b.", "Step 3: Since b is stated to be a positive constant, −b is a negative number — meaning the graph's horizontal asymptote is below the x-axis (in negative y territory).", "Step 4: Since the function is strictly increasing (from Step 1) and approaches a NEGATIVE value as x → −∞ but grows without bound as x → +∞, the graph must cross from below the x-axis to above it — and because it's strictly increasing (never doubles back), this crossing happens exactly once.", "Step 5: The condition b > c given in the problem is extra information not needed to answer this particular question — it doesn't change the crossing count, only potentially the crossing's exact location.", "Step 6: This matches choice B: One."], "trap": "Choice A (Zero) is the most commonly picked wrong answer — students sometimes assume that because the function has a vertical shift (−b), it might never reach zero, without realizing that since the function grows without bound in the positive direction, it's guaranteed to eventually cross the x-axis exactly once.", "poe": [{"letter": "A", "text": "The function grows without bound as x increases (since the base a/7 > 1), so it will always eventually rise above the x-axis, guaranteeing at least one crossing — 'zero crossings' isn't possible here."}, {"letter": "C", "text": "An exponential function of this form is always STRICTLY increasing (monotonic) when its base is greater than 1 — it can never curve back down to cross the x-axis a second time."}, {"letter": "D", "text": "Like choice C, three crossings would require the function to change direction multiple times, but a simple exponential function like this one only ever increases or only ever decreases — it can never reverse direction to cross more than once."}], "desmos": ["Step 1: Since this problem involves unknown constants a, b, and c, pick simple test values that satisfy the given conditions (a > 7, b > c > 0) to make the function concrete — let's use a = 14 (so a/7 = 2), c = 1, and b = 5. Step 2: Open Desmos and type: y=9(14/7)^(x+1)-5, which simplifies to y=9(2)^(x+1)-5", "Step 3: Press Enter — Desmos graphs this curve.", "Step 4: Look at how many times the curve crosses the horizontal x-axis — you should see it cross exactly ONCE, confirming choice B.", "Step 5: Try a few different valid values for a, b, and c (always keeping a > 7 and b > c > 0) and re-graph — you'll find the graph always crosses the x-axis exactly once, no matter which valid values you choose, confirming this is a general property of the function's structure, not just a coincidence of your specific numbers."]}, {"gi": 6, "domain": "Nonlinear functions", "num": 6, "diff": "Hard", "gridin": false, "correct": "B", "rule": "When a function has unknown constants and you're given two specific points the graph passes through, substitute each point's x and y values into the function to create a system of two equations — then solve that system for the unknown constants.", "tip": "Always substitute the point with x = 0 first if one is given — since anything raised to the power of 0 equals 1, this usually eliminates the exponential term entirely and gives you a much simpler equation to start solving with.", "why": "Substituting (0, 10): h(0) = a^0 + b = 1 + b = 10, so b = 9. Substituting (2, 13): h(2) = a^2 + b = a^2 + 9 = 13, so a^2 = 4, giving a = 2 (taking the positive root, since a is stated to be a positive constant). Therefore ab = 2 × 9 = 18.", "steps": ["Step 1: Write down the general function: h(x) = a^x + b.", "Step 2: Substitute the first point (0, 10): h(0) = a^0 + b. Since any nonzero number to the power of 0 equals 1, this simplifies to 1 + b = 10.", "Step 3: Solve for b: b = 10 − 1 = 9.", "Step 4: Substitute the second point (2, 13): h(2) = a^2 + b = a^2 + 9 = 13.", "Step 5: Solve for a^2: a^2 = 13 − 9 = 4.", "Step 6: Take the square root of both sides: a = 2 (using the positive root, since the problem states a is a positive constant).", "Step 7: Calculate the requested value: ab = 2 × 9 = 18.", "Step 8: This matches choice B."], "trap": "Choice A (13) is the most commonly picked wrong answer — it comes from confusing the requested product ab with one of the given y-coordinates (13) from the original points, rather than actually solving for and multiplying the two constants.", "poe": [{"letter": "A", "text": "13 is one of the given y-coordinates from the original points (0, 10) and (2, 13) — it's not the product ab, which requires solving for both constants first."}, {"letter": "C", "text": "20 doesn't correspond to a natural calculation error from this problem — likely a distractor value."}, {"letter": "D", "text": "26 might result from adding a and b incorrectly derived values instead of multiplying them, or from a sign/arithmetic slip while solving for a^2."}], "desmos": ["Step 1: Open Desmos. Step 2: Type the two given points directly to visualize them: (0,10) and (2,13) — Desmos will plot these as dots.", "Step 3: Type the general function with sliders: h(x)=a^x+b — Desmos will offer to create sliders for a and b automatically (click 'all' when prompted, or add sliders manually).", "Step 4: Adjust the sliders for a and b until the curve h(x) passes exactly through both plotted points — you should find this happens when a = 2 and b = 9.", "Step 5: With the sliders confirmed at a = 2 and b = 9, type a new line: 2*9 (or reference the slider values directly) — Desmos will show 18, confirming ab = 18 and matching choice B."]}, {"gi": 7, "domain": "Nonlinear functions", "num": 7, "diff": "Hard", "gridin": false, "correct": "D", "rule": "When a quantity 'decreases by p%' repeatedly, the correct decay factor to use in an exponential model is (1 − p/100), NOT p/100 itself — because after each period, the quantity retains (100 − p)% of its previous value, not just p%.", "tip": "Never use the percentage given in a 'decreases by p%' problem directly as the base of your exponential — always convert it first by subtracting from 100% (or from 1, in decimal form). A common trap answer will use the raw percentage as if it were the retained amount instead of the LOST amount.", "why": "Since the mass decreases by 24% every 22.96 minutes, it RETAINS 100% − 24% = 76% of its mass each period, which as a decimal is 0.76. The exponent must be t/22.96 so that after t = 22.96 minutes, exactly one full decay period has occurred. This gives M = 100(0.76)^(t/22.96), matching choice D.", "steps": ["Step 1: Identify the percentage decrease: the mass decreases by 24% every 22.96 minutes.", "Step 2: Convert this to a retention rate (the fraction of mass that REMAINS after each period): 100% − 24% = 76%, or as a decimal, 0.76.", "Step 3: Identify the time period for the exponent: since the decay happens 'every 22.96 minutes,' the exponent should be t/22.96, so that after exactly 22.96 minutes, the exponent equals 1 (one full decay period).", "Step 4: Assemble the model: M = (initial mass) × (retention rate)^(t / period) = 100(0.76)^(t/22.96).", "Step 5: This matches choice D."], "trap": "Choice B is the most commonly picked wrong answer — it correctly uses t/22.96 as the exponent, but incorrectly uses 0.24 (the percentage LOST) as the base instead of 0.76 (the percentage RETAINED), which would model the mass shrinking to 24% of its PREVIOUS value every period — an extremely fast decay, not a 24% decrease.", "poe": [{"letter": "A", "text": "This uses 0.24 as the base (should be 0.76) AND adds 22.96 directly to the exponent instead of dividing by it — both the base and the exponent structure are incorrect."}, {"letter": "B", "text": "This uses 0.24 as the base — but 0.24 represents the percentage LOST, not the percentage RETAINED; using it directly would model the mass dropping to just 24% of its value every period, a much faster decay than described."}, {"letter": "C", "text": "This uses the correct base (0.76) but the wrong exponent structure — adding 22.96 directly to t instead of dividing t by 22.96 doesn't correctly represent 'one full decay period every 22.96 minutes.'"}], "desmos": ["Step 1: Open Desmos and type the equation you derived: M=100(0.76)^(t/22.96)", "Step 2: Press Enter — Desmos graphs this decreasing exponential curve.", "Step 3: Use the table feature and enter t = 22.96 — the output should show M = 100(0.76)^1 = 76, confirming the mass has dropped to 76% of its original value (a 24% decrease) after exactly one period, matching the problem's description.", "Step 4: Enter t = 45.92 (double the period) in the table as well — you should see M = 100(0.76)^2 = 57.76, confirming the mass decreases by another 24% of its NEW value during the second period, verifying the exponential decay model and choice D."]}, {"gi": 8, "domain": "Nonlinear functions", "num": 8, "diff": "Hard", "gridin": false, "correct": "C", "rule": "For a quadratic function given in vertex form y = a(x − h)^2 + k, where (h, k) is the vertex, use ONE additional known point on the graph to solve for the leading coefficient 'a' — then you have the complete equation and can evaluate the function at any x-value needed.", "tip": "When a quadratic's vertex is given directly, always start by writing the function in VERTEX FORM (using the vertex coordinates), not standard form — vertex form requires solving for only ONE unknown (the coefficient a) using a single additional point, which is much more efficient than solving a system with three unknowns.", "why": "With vertex (1, 9), write f(x) = a(x − 1)^2 + 9. Use the point (2, 33): 33 = a(2−1)^2 + 9 = a(1) + 9, so a = 24. This gives f(x) = 24(x−1)^2 + 9. Now calculate f(−2) = 24(−2−1)^2 + 9 = 24(9) + 9 = 216 + 9 = 225, and f(0) = 24(0−1)^2 + 9 = 24(1) + 9 = 33. Finally, f(−2) − f(0) = 225 − 33 = 192.", "steps": ["Step 1: Write the quadratic in vertex form using the given vertex (1, 9): f(x) = a(x − 1)^2 + 9.", "Step 2: Use the given point (2, 33) to solve for a: substitute x = 2 and f(x) = 33: 33 = a(2 − 1)^2 + 9, which simplifies to 33 = a(1) + 9, so 33 = a + 9.", "Step 3: Solve for a: a = 33 − 9 = 24.", "Step 4: Write the complete function: f(x) = 24(x − 1)^2 + 9.", "Step 5: (Optional check using the third point (−1, 105)): f(−1) = 24(−1−1)^2 + 9 = 24(4) + 9 = 96 + 9 = 105. This matches the given point, confirming the equation is correct.", "Step 6: Calculate f(−2): f(−2) = 24(−2−1)^2 + 9 = 24(−3)^2 + 9 = 24(9) + 9 = 216 + 9 = 225.", "Step 7: Calculate f(0): f(0) = 24(0−1)^2 + 9 = 24(−1)^2 + 9 = 24(1) + 9 = 24 + 9 = 33.", "Step 8: Calculate the requested difference: f(−2) − f(0) = 225 − 33 = 192.", "Step 9: This matches choice C."], "trap": "Choice A (81) is the most commonly picked wrong answer — it results from subtracting the x-values instead of the function outputs, or from a similar mix-up between the INPUT difference and the actual OUTPUT (y-value) difference the question is asking for.", "poe": [{"letter": "A", "text": "81 doesn't come from correctly evaluating f(−2) and f(0) and subtracting — it likely results from a calculation error, such as using the wrong vertex offset value."}, {"letter": "B", "text": "129 similarly doesn't align with the correct values of f(−2) = 225 and f(0) = 33 — likely from an arithmetic slip in one of the intermediate steps."}, {"letter": "D", "text": "225 is the value of f(−2) ALONE, not the full difference f(−2) − f(0) — a student who correctly calculates f(−2) but forgets to subtract f(0) would mistakenly select this."}], "desmos": ["Step 1: Open Desmos and type the function in vertex form using the given vertex: f(x)=a(x-1)^2+9 — Desmos will offer to create a slider for 'a' (click to add it).", "Step 2: Also type the two given points to plot them: (2,33) and (-1,105)", "Step 3: Adjust the slider for 'a' until the curve f(x) passes through both plotted points — you should find this happens at a = 24.", "Step 4: Once confirmed, type f(-2) directly into Desmos — it will evaluate to 225.", "Step 5: Type f(0) on the next line — it will evaluate to 33.", "Step 6: Type f(-2)-f(0) on a final line — Desmos will compute this as 192, confirming choice C."]}, {"gi": 9, "domain": "Nonlinear functions", "num": 9, "diff": "Hard", "gridin": false, "correct": "D", "rule": "In an exponential function y = a(b)^x where the base b is a decimal between 0 and 1, the percent DECREASE from one integer x-value to the next is always (1 − b) × 100%, regardless of which specific integer values of x you compare — this percent change is constant for all exponential functions of this form.", "tip": "For 'percent change from f(n−1) to f(n)' questions with an exponential function, you never need to plug in actual numbers for n — the percent change only depends on the base of the exponential (the number being raised to the x power), which you can read directly from the function.", "why": "The function f(x) = 56(0.19)^x has a base of 0.19, meaning each time x increases by 1, the output is multiplied by 0.19 — so the new value retains only 19% of the previous value. This means the value DECREASES by 100% − 19% = 81% each time, so p = 81.", "steps": ["Step 1: Identify the base of the exponential function: 0.19 (the number being raised to the power of x).", "Step 2: Understand what multiplying by 0.19 means: each time x increases by 1, the new value is only 19% (0.19) of the previous value — meaning 19% of the value is RETAINED.", "Step 3: Calculate the percent that is LOST (the percent decrease): 100% − 19% = 81%.", "Step 4: Since f(n) is p% less than f(n−1), and we just calculated this percent decrease is 81%, we have p = 81.", "Step 5: This matches choice D."], "trap": "Choice A (19) is the most commonly picked wrong answer — it directly uses the base of the exponential (0.19, or 19%) as the answer, without realizing that 19% represents the amount RETAINED after each step, not the amount DECREASED — these are two different, complementary percentages.", "poe": [{"letter": "A", "text": "19 is the percent of the value that REMAINS (is retained) after each step — but the question asks for the percent DECREASE, which is the complement: 100 − 19 = 81, not 19 itself."}, {"letter": "B", "text": "44 doesn't correspond to any natural calculation from the base 0.19 — likely a distractor value."}, {"letter": "C", "text": "56 is simply the leading coefficient (the initial value) of the function — it has nothing to do with the percent change between consecutive terms, which depends only on the base."}], "desmos": ["Step 1: Open Desmos and type the function: f(x)=56(0.19)^x", "Step 2: Press Enter — Desmos graphs this rapidly decreasing exponential curve.", "Step 3: Use the table feature and enter x = 0 and x = 1 to see two consecutive values — you'll see f(0) = 56 and f(1) = 10.64.", "Step 4: Calculate the percent decrease directly: type (56-10.64)/56*100 into Desmos — it will evaluate to 81, confirming p = 81 and matching choice D.", "Step 5: To confirm this percent decrease is CONSTANT (the same between any two consecutive integers, not just 0 and 1), try the same calculation with x = 5 and x = 6 in the table — you'll find the percent decrease between f(5) and f(6) is also exactly 81%, confirming this is a general property of the exponential base, not specific to any particular starting point."]}, {"gi": 10, "domain": "Nonlinear functions", "num": 10, "diff": "Hard", "gridin": true, "correct": "1.1", "rule": "When a real-world quadratic model gives you height above the ground over time, 'reaching the floor' means the height equals 0 — so set the function equal to 0 and solve for the positive value of t (since negative time doesn't make sense in this context).", "tip": "First use the given starting condition (the height at t = 0) to solve for any unknown constant in the function, THEN set the complete function equal to 0 and solve for t — don't try to do both steps at once.", "why": "Since the ball is 19.36 feet above the floor at t = 0, substitute into h(t) = −16t^2 + b: h(0) = −16(0)^2 + b = b = 19.36, so b = 19.36. Now set the height to 0 to find when the ball reaches the floor: 0 = −16t^2 + 19.36. Solving: 16t^2 = 19.36, so t^2 = 19.36/16 = 1.21, giving t = √1.21 = 1.1 (taking the positive square root, since time must be positive).", "steps": ["Step 1: Use the given initial condition to find the constant b: at t = 0, the height is 19.36 feet, so substitute into h(t) = −16t^2 + b: h(0) = −16(0)^2 + b = b. Since h(0) = 19.36, this means b = 19.36.", "Step 2: Write the complete function: h(t) = −16t^2 + 19.36.", "Step 3: The ball reaches the floor when its height equals 0, so set h(t) = 0: −16t^2 + 19.36 = 0.", "Step 4: Add 16t^2 to both sides: 19.36 = 16t^2.", "Step 5: Divide both sides by 16: t^2 = 19.36/16 = 1.21.", "Step 6: Take the square root of both sides: t = √1.21 = 1.1 (using the positive root, since time elapsed must be a positive value).", "Step 7: This is a grid-in question — enter 1.1 as your final answer."], "trap": "A common error on this problem is forgetting to take the SQUARE ROOT at the final step, mistakenly submitting t^2 = 1.21 as the final answer instead of continuing to solve for t = 1.1, or alternatively including the negative root (−1.1), which doesn't make sense for a time value.", "poe": [], "desmos": ["Step 1: Open Desmos and type the equation with the constant already substituted: y=-16x^2+19.36 (using x in place of t for graphing purposes).", "Step 2: Press Enter — Desmos graphs this downward-opening parabola.", "Step 3: Look for where the curve crosses the x-axis (where height = 0) on the POSITIVE side of the x-axis (since negative time doesn't make sense here) — click on that point.", "Step 4: Desmos will display the exact coordinates of that crossing point, showing x = 1.1 (with y = 0), confirming the ball reaches the floor at t = 1.1 seconds.", "Step 5: Enter 1.1 into the grid-in answer box."]}, {"gi": 11, "domain": "Nonlinear functions", "num": 11, "diff": "Hard", "gridin": false, "correct": "D", "rule": "The y-intercept of any function is its value when x = 0. For it to be directly 'displayed as a constant or coefficient' in an equation (without needing any further calculation), the equation must be written so that setting x = 0 leaves ONLY one of the already-visible numbers by itself — not a combination or product of multiple constants.", "tip": "For each candidate equation, mentally plug in x = 0 and simplify as far as possible. If what's left over is just ONE of the letters/constants already sitting alone in the original equation (not added to or multiplied by anything else), that equation displays its y-intercept directly. If you still need to compute a sum or product to get the final value, it does NOT count as being 'displayed.'", "why": "For equation I, p(0) = a(4.1)^0 + b = a(1) + b = a + b — this requires ADDING two constants together, so the y-intercept isn't a single constant or coefficient already sitting in the equation by itself. For equation II, r(0) = a(4.1)^(0+b) = a(4.1)^b — this requires MULTIPLYING a by a power of 4.1, again not a single displayed constant. Since neither equation shows its y-intercept as a single already-visible constant or coefficient, the answer is 'Neither I nor II.'", "steps": ["Step 1: For equation I, p(x) = a(4.1)^x + b, substitute x = 0: p(0) = a(4.1)^0 + b.", "Step 2: Simplify using the rule that anything to the power of 0 equals 1: p(0) = a(1) + b = a + b.", "Step 3: Notice that a + b is a SUM of two separate constants — it's not simply 'a' or simply 'b' displayed alone; you'd need to actually calculate this sum to know the y-intercept's value. So equation I does NOT directly display its y-intercept as a single constant or coefficient.", "Step 4: For equation II, r(x) = a(4.1)^(x+b), substitute x = 0: r(0) = a(4.1)^(0+b) = a(4.1)^b.", "Step 5: This is a PRODUCT of a and a power of 4.1 raised to b — again, not simply 'a' or simply 'b' by itself; you'd need to calculate this product to find the actual y-intercept value. So equation II also does NOT directly display its y-intercept.", "Step 6: Since neither equation shows its y-intercept as an already-visible single constant or coefficient, the correct answer is D: Neither I nor II."], "trap": "Choice C (I and II) is the most commonly picked wrong answer — students sometimes assume that because both equations CONTAIN the letters a and b, one of those letters must represent the y-intercept directly, without carefully checking whether evaluating at x = 0 actually isolates just one constant or requires further calculation (addition or multiplication).", "poe": [{"letter": "A", "text": "Equation I's y-intercept is a + b (a sum), not simply 'a' or 'b' displayed alone — you still need to add two numbers together to find it, so it's not directly 'displayed.'"}, {"letter": "B", "text": "Equation II's y-intercept is a(4.1)^b (a product involving an exponent), not simply 'a' or 'b' displayed alone — significant calculation is still needed to find the actual value."}, {"letter": "C", "text": "Since NEITHER equation isolates its y-intercept as a single already-visible constant (both require additional calculation — addition for I, multiplication with an exponent for II), 'I and II' incorrectly claims both work when neither actually does."}], "desmos": ["Step 1: Since this problem involves abstract reasoning about GENERAL constants a and b rather than specific numbers, pick simple test values to verify your reasoning — let's use a = 2 and b = −3 (remembering b < 0 as given). Step 2: Open Desmos and type equation I with these values: y=2(4.1)^x+(-3)", "Step 3: Use the table feature and enter x = 0 — the output will show y = 2(1) − 3 = −1. Notice this value (−1) doesn't match either a (2) or b (−3) directly — it required computing a + b, confirming equation I doesn't display its y-intercept as a simple constant.", "Step 4: Now type equation II with the same values: y=2(4.1)^(x+(-3))", "Step 5: Enter x = 0 in the table — the output will show some computed decimal value (from 2 × 4.1^(−3)), which again doesn't match a or b directly, confirming equation II also requires calculation, not direct display — verifying choice D.", "Nonlinear equations in one variable and systems of equations in two variables", "9 questions  ·  Easy 1  /  Medium 2  /  Hard 6"]}, {"gi": 12, "domain": "Nonlinear equations in one variable and systems of equations in two variables", "num": 1, "diff": "Easy", "gridin": false, "correct": "B", "rule": "To match a graphed parabola or line to its equation, first read the KEY FEATURES directly off the graph — for a parabola, its vertex (lowest or highest point); for a line, its y-intercept and slope — then compare these features to each answer choice.", "tip": "Start with the parabola's vertex — it's usually the easiest feature to spot exactly on a grid. The vertex's y-coordinate directly tells you the constant term in the parabola's equation when written as y = x^2 + (constant), instantly narrowing your choices.", "why": "The parabola's vertex sits at (0, −8), meaning its equation is y = x^2 − 8 (matching the pattern y = x^2 + k, where k = −8 is the vertical shift). The line passes through the origin and through approximately (−1, 5), giving a slope of (5−0)/(−1−0) = −5, so its equation is y = −5x. Together, these match choice B.", "steps": ["Step 1: Identify the parabola's vertex directly from the graph: it appears to be at (0, −8), the lowest point of the U-shaped curve.", "Step 2: Since a basic parabola y = x^2 shifted down by 8 units has equation y = x^2 − 8, and the vertex confirms this shift, the parabola's equation is y = x^2 − 8.", "Step 3: Identify a second clear point on the line: it appears to pass through the origin (0, 0) and through approximately (−1, 5).", "Step 4: Calculate the line's slope using these two points: slope = (5 − 0) / (−1 − 0) = 5 / (−1) = −5.", "Step 5: Since the line passes through the origin with slope −5, its equation is y = −5x.", "Step 6: Compare both equations to the answer choices: y = −5x and y = x^2 − 8 matches choice B exactly."], "trap": "Choice A is the most commonly picked wrong answer — it uses the correct line equation but the WRONG sign on the parabola's vertical shift (+8 instead of −8), which would place the parabola's vertex ABOVE the x-axis instead of below it, not matching the graph shown.", "poe": [{"letter": "A", "text": "This uses y = x^2 + 8, which would place the parabola's vertex at (0, 8) — well above the x-axis — but the graph clearly shows the vertex below the x-axis, around y = −8."}, {"letter": "C", "text": "This uses y = 5x for the line, which has a POSITIVE slope — but the line in the graph is clearly decreasing (going down from left to right), meaning it needs a NEGATIVE slope."}, {"letter": "D", "text": "This combines the wrong-sign line (positive slope 5x instead of −5x) with the correct parabola — but the line's direction doesn't match the graph, which shows a decreasing line."}], "desmos": ["Step 1: Open Desmos and type the system you determined: y=-5x and on a second line y=x^2-8", "Step 2: Press Enter after each — Desmos will graph both.", "Step 3: Compare this graph directly to the picture given in the question — check that the parabola's lowest point matches (0, −8) and that the line passes through the origin, sloping steeply downward to the right.", "Step 4: If everything matches the original picture, you've confirmed choice B is correct. If you're ever unsure between two candidate systems, graph both pairs in Desmos (they'll appear in different colors) and see which pair visually overlaps the original picture most closely."]}, {"gi": 13, "domain": "Nonlinear equations in one variable and systems of equations in two variables", "num": 2, "diff": "Medium", "gridin": true, "correct": "16 (or 10)", "rule": "For an equation already written as a product of factors set equal to zero, the Zero Product Property says the equation is true whenever ANY ONE of the individual factors equals zero — so you can find every solution by setting each factor equal to zero separately and solving.", "tip": "Never expand or multiply out a fully-factored equation like this one — that would create unnecessary work. Instead, immediately set each individual factor equal to zero, one at a time, to instantly find each solution.", "why": "Setting each factor equal to zero: (x − 16) = 0 gives x = 16; (x − 10) = 0 gives x = 10; (x + 7) = 0 gives x = −7; (x + 17) = 0 gives x = −17. The positive solutions are 16 and 10 — either one is an acceptable grid-in answer.", "steps": ["Step 1: Recognize that the equation is already fully factored: (x − 16)(x − 10)(x + 7)(x + 17) = 0.", "Step 2: Apply the Zero Product Property: since the product of these four factors equals 0, at least one of the factors itself must equal 0.", "Step 3: Set each factor equal to 0 individually and solve: x − 16 = 0 gives x = 16; x − 10 = 0 gives x = 10; x + 7 = 0 gives x = −7; x + 17 = 0 gives x = −17.", "Step 4: The complete solution set is {16, 10, −7, −17}. The question asks for a POSITIVE solution — both 16 and 10 qualify.", "Step 5: This is a grid-in question — enter either 16 or 10 as your final answer; both are accepted as correct."], "trap": "A common error on this type of problem is accidentally flipping the sign when setting a factor to zero — for example, incorrectly solving (x − 16) = 0 as x = −16 instead of x = 16, which would produce a negative value instead of the correct positive solution.", "poe": [], "desmos": ["Step 1: Open Desmos and type the equation exactly as given: (x-16)(x-10)(x+7)(x+17)=0", "Step 2: Press Enter — since this is a one-variable equation, Desmos will find and plot ALL solutions as labeled points along the x-axis.", "Step 3: You should see four labeled points: x = −17, x = −7, x = 10, and x = 16.", "Step 4: Since the question asks for a POSITIVE solution, choose either x = 10 or x = 16 and enter it into the grid-in box — both are correct answers."]}, {"gi": 14, "domain": "Nonlinear equations in one variable and systems of equations in two variables", "num": 3, "diff": "Medium", "gridin": false, "correct": "A", "rule": "When a graph shows the intersection of a line and a curve, the x-coordinate of ANY intersection point is automatically a valid solution to the system those two graphs represent — you can read this directly off the graph without doing any algebra, as long as you can identify the intersection points clearly.", "tip": "When answer choices give you SPECIFIC numbers to check against a graph, don't try to find the exact equations of the curves first — just look directly at the graph for where the two curves cross, and check which of the given x-values lines up with a crossing point.", "why": "The horizontal line y = 7 intersects the parabola at two points, occurring at approximately x = 4 and x = 6 (visually symmetric around the parabola's vertex, which appears to be at x = 5). Since x = 4 is one of these intersection points, it's a valid solution to the system, matching choice A.", "steps": ["Step 1: Identify the horizontal line's equation from the graph: it appears to be a flat line at y = 7.", "Step 2: Look for where this horizontal line crosses the parabola — these crossing points are the solutions to the system.", "Step 3: Reading the graph carefully, the line and parabola appear to intersect at approximately x = 4 and x = 6 (the parabola's vertex is at approximately (5, 8), and the two intersection points are symmetric around this vertex).", "Step 4: Compare these x-values to the answer choices: x = 4 is listed as choice A, confirming it as a valid solution."], "trap": "Choice C (7.2) is the most commonly picked wrong answer — it confuses the y-coordinate of the horizontal line (y = 7) with a required x-coordinate, creating a plausible-looking decimal that doesn't actually correspond to any point where the graphs intersect.", "poe": [{"letter": "B", "text": "x = 5 corresponds to the parabola's VERTEX (its highest point, around y = 8), not to where it crosses the horizontal line y = 7 — at x = 5, the parabola's y-value doesn't equal 7."}, {"letter": "C", "text": "7.2 seems to borrow the '7' from the horizontal line's y-value but doesn't correspond to any actual intersection point visible on the graph."}, {"letter": "D", "text": "x = 8 is close to where the parabola comes back down to the x-axis (y = 0), not where it crosses the horizontal line at y = 7 — this is reading the wrong feature of the graph."}], "desmos": ["Step 1: Since this is a graph-reading problem, you can use Desmos to find the actual equations first, if you want to double check. Estimate the parabola's vertex from the picture — it looks like (5, 8) — and that it passes through the origin area near (2, 0) and (8, 0). Step 2: Open Desmos and type a test parabola: y=-(x-5)^2+8", "Step 3: Compare this to the picture — if it matches the shape shown, you've found the right equation.", "Step 4: Type the horizontal line: y=7", "Step 5: Press Enter — Desmos will show the exact intersection points when you click on them, confirming the parabola and line cross at x = 4 and x = 6, verifying choice A is a valid solution."]}, {"gi": 15, "domain": "Nonlinear equations in one variable and systems of equations in two variables", "num": 4, "diff": "Hard", "gridin": true, "correct": "16", "rule": "For a quadratic equation to have NO real solutions, its discriminant (the part under the square root in the quadratic formula, b² − 4ac) must be NEGATIVE. Rearrange any given equation into standard form (ax² + bx + c = 0) first, then set up and solve the discriminant inequality to find the range of values for an unknown constant.", "tip": "Whenever a problem tells you an equation 'has no real solutions' and asks about a range of possible values for a constant, that's your signal to use the discriminant inequality (b² − 4ac < 0) rather than trying to solve the equation directly — you can't solve it directly precisely because it has no real solutions.", "why": "Rearrange r² + qr = 2r − 55 into standard form: r² + qr − 2r + 55 = 0, which combines to r² + (q−2)r + 55 = 0. For no real solutions, the discriminant must be negative: (q−2)² − 4(1)(55) < 0, so (q−2)² < 220. Taking the square root: −√220 < q−2 < √220. Since √220 ≈ 14.83, this gives approximately −12.83 < q < 16.83. Since q must be an integer, the largest possible value is 16.", "steps": ["Step 1: Start with the given equation: r² + qr = 2r − 55.", "Step 2: Move all terms to one side to get standard form: r² + qr − 2r + 55 = 0.", "Step 3: Combine the like terms involving r: r² + (q − 2)r + 55 = 0.", "Step 4: Identify the coefficients for the discriminant formula: a = 1, b = (q − 2), c = 55.", "Step 5: For no real solutions, set up the discriminant inequality: b² − 4ac < 0, which becomes (q − 2)² − 4(1)(55) < 0.", "Step 6: Simplify: (q − 2)² − 220 < 0, so (q − 2)² < 220.", "Step 7: Take the square root of both sides (remembering this creates a two-sided inequality): −√220 < q − 2 < √220.", "Step 8: Calculate √220 ≈ 14.83.", "Step 9: Add 2 to all three parts of the inequality: 2 − 14.83 < q < 2 + 14.83, which gives approximately −12.83 < q < 16.83.", "Step 10: Since q is stated to be an INTEGER constant, find the largest integer within this range: the largest integer less than 16.83 is 16.", "Step 11: This is a grid-in question — enter 16 as your final answer."], "trap": "A common error on this problem is forgetting to properly rearrange the equation into standard form BEFORE identifying a, b, and c — for example, using b = q instead of the correct b = (q − 2), which comes from combining the qr term with the −2r term after moving everything to one side.", "poe": [], "desmos": ["Step 1: Open Desmos. Step 2: Type the rearranged equation with q as a slider variable: y=x^2+(q-2)x+55 (using x in place of r for graphing).", "Step 3: Desmos will offer to create a slider for q — click to add it.", "Step 4: Drag the slider for q and watch the parabola — when the parabola does NOT touch or cross the x-axis at all, the equation has no real solutions for that value of q.", "Step 5: Slowly increase the q slider until the parabola is JUST ABOUT to touch the x-axis (this is the boundary case) — check the q value at this point; it should be very close to 16.83.", "Step 6: Since q must be an integer and must stay strictly below this boundary (so the parabola never touches the x-axis), test q = 16 directly by typing y=x^2+14x+55 — confirm this parabola stays entirely above the x-axis, verifying q = 16 works and is the largest such integer."]}, {"gi": 16, "domain": "Nonlinear equations in one variable and systems of equations in two variables", "num": 5, "diff": "Hard", "gridin": false, "correct": "D", "rule": "To find where a line intersects a circle (or any curve) at a SPECIFIC given x-value, first use the circle's equation to find the corresponding y-value(s) at that x, then substitute BOTH the x and y values into the line's equation to solve for any remaining unknown constant.", "tip": "When a problem gives you a specific x-coordinate for an intersection point but leaves the y-coordinate as an unknown with a stated condition (like 'y < 0'), always solve for y using the OTHER equation in the system first (the one that doesn't contain the unknown you're solving for) — this narrows things down before you touch the equation with the unknown.", "why": "Substituting x = −5 into the circle's equation: (−5)² + y² = 36, which gives 25 + y² = 36, so y² = 11, meaning y = ±√11. Since the problem specifies y < 0, we take y = −√11. Now substitute x = −5 and y = −√11 into the line's equation to solve for b: −√11 = m(−5) + b/4, which gives −√11 = −5m + b/4. Adding 5m to both sides: 5m − √11 = b/4. Multiplying both sides by 4: b = 20m − 4√11.", "steps": ["Step 1: Substitute the known x-coordinate (x = −5) into the CIRCLE equation to find y: (−5)² + y² = 36.", "Step 2: Simplify: 25 + y² = 36.", "Step 3: Solve for y²: y² = 36 − 25 = 11.", "Step 4: Take the square root of both sides: y = ±√11. Since the problem states y < 0, choose the negative root: y = −√11.", "Step 5: Now substitute both x = −5 and y = −√11 into the LINE equation: y = mx + b/4, giving −√11 = m(−5) + b/4.", "Step 6: Simplify the right side: −√11 = −5m + b/4.", "Step 7: Add 5m to both sides to isolate the b/4 term: −√11 + 5m = b/4, or equivalently 5m − √11 = b/4.", "Step 8: Multiply both sides by 4 to solve for b: b = 4(5m − √11) = 20m − 4√11.", "Step 9: This matches choice D."], "trap": "Choice C (−20m + 4√11) is the most commonly picked wrong answer — it has the correct terms but with both signs flipped, typically resulting from a sign error while moving terms across the equals sign during Step 7, such as subtracting 5m instead of adding it.", "poe": [{"letter": "A", "text": "This choice has both incorrect coefficients on m (should be 20, not 5) and an incorrect overall structure — it appears to divide by 4 in the wrong place."}, {"letter": "B", "text": "Similarly, this uses the wrong coefficient on m (5m instead of 20m) — likely from forgetting to multiply through by 4 in the final step."}, {"letter": "C", "text": "This has the correct magnitude for both terms but with the signs flipped (−20m instead of 20m, and +4√11 instead of −4√11) — a sign error somewhere in isolating b likely while moving −5m across the equation."}], "desmos": ["Step 1: Open Desmos and type the circle equation: x^2+y^2=36", "Step 2: Press Enter — Desmos graphs a circle centered at the origin with radius 6.", "Step 3: To find the y-value at x = −5, use the table feature on a new expression: type y=sqrt(36-x^2) and y=-sqrt(36-x^2) as two separate expressions (representing the top and bottom halves of the circle), then create a table and enter x = −5 for each — you'll see the negative version gives y ≈ −3.317, matching −√11.", "Step 4: Since this problem involves the unknown constants m and b, pick a simple test value for m (like m = 1) to make the line concrete, then type: y=1x+b/4 with a slider for b.", "Step 5: Adjust the b slider until the line passes through the point (−5, −√11) (which you can also type directly as a point: (-5,-sqrt(11)) to see it plotted) — the b value where this happens should match 20(1) − 4√11 ≈ 6.73, confirming your formula for b in terms of m matches choice D."]}, {"gi": 17, "domain": "Nonlinear equations in one variable and systems of equations in two variables", "num": 6, "diff": "Hard", "gridin": false, "correct": "B", "rule": "For a quadratic equation that does NOT factor into nice whole numbers, use the Quadratic Formula: x = [−b ± √(b² − 4ac)] / (2a). The '+' version of this formula always gives the GREATER of the two solutions, and the '−' version always gives the smaller one.", "tip": "Before reaching for the quadratic formula, quickly check whether the equation factors nicely with whole numbers (it usually doesn't when the answer choices involve square roots, like here) — square roots in the answer choices are a strong signal you should go straight to the quadratic formula rather than wasting time trying to factor.", "why": "Using the quadratic formula on 4x² − 5x − 5 = 0 with a = 4, b = −5, c = −5: x = [−(−5) ± √((−5)² − 4(4)(−5))] / (2×4) = [5 ± √(25 + 80)] / 8 = [5 ± √105] / 8. The GREATEST solution uses the '+' sign: x = 5/8 + √105/8.", "steps": ["Step 1: Identify the coefficients from the standard form ax² + bx + c = 0: a = 4, b = −5, c = −5.", "Step 2: Write out the quadratic formula: x = [−b ± √(b² − 4ac)] / (2a).", "Step 3: Substitute the coefficients: x = [−(−5) ± √((−5)² − 4(4)(−5))] / (2(4)).", "Step 4: Simplify the numerator's first term: −(−5) = 5.", "Step 5: Simplify inside the square root: (−5)² = 25, and 4(4)(−5) = −80, so subtracting a negative becomes addition: 25 − (−80) = 25 + 80 = 105.", "Step 6: Simplify the denominator: 2(4) = 8.", "Step 7: The formula now reads: x = [5 ± √105] / 8.", "Step 8: Since the question asks for the GREATEST solution, use the '+' version: x = 5/8 + √105/8.", "Step 9: This matches choice B."], "trap": "Choice A is the most commonly picked wrong answer — it correctly computes the formula but selects the '−' (minus) version instead of the '+' version, giving the SMALLER solution instead of the greatest one the question actually asks for.", "poe": [{"letter": "A", "text": "This uses the '−' version of the quadratic formula (5/8 − √105/8), which gives the SMALLER of the two solutions, not the greatest one the question asks for."}, {"letter": "C", "text": "This has the correct '−' structure but with the wrong denominator (4 instead of 8 under the square root term) — a mismatched-denominator error, and also selects the smaller solution."}, {"letter": "D", "text": "This has the correct '+' structure but the wrong denominator under the square root term (4 instead of 8) — the square root term should be divided by 8 (matching 2a), not 4."}], "desmos": ["Step 1: Open Desmos and type the equation exactly as given: 4x^2-5x-5=0", "Step 2: Press Enter — since this is a one-variable equation, Desmos will solve it and plot BOTH solutions as labeled points on the x-axis.", "Step 3: You should see two points — one around x ≈ −0.66 and another around x ≈ 1.9.", "Step 4: Click on the point with the LARGER x-value (the one farther to the right, around x ≈ 1.9) — this is the greatest solution.", "Step 5: To verify this matches 5/8 + √105/8 exactly (not just as a decimal), type (5+sqrt(105))/8 into Desmos on a new line — it should evaluate to the same decimal value (≈1.9), confirming choice B is correct."]}, {"gi": 18, "domain": "Nonlinear equations in one variable and systems of equations in two variables", "num": 7, "diff": "Hard", "gridin": false, "correct": "B", "rule": "To solve an equation for a variable that's inside a square (like y², here disguised as xyz where y appears squared once isolated), first clear all fractions by multiplying through by the least common denominator, then isolate the squared variable, and finally take the square root of both sides.", "tip": "When a variable appears in a term like 'xyz' alongside fraction terms with that SAME variable in the denominator (like 1/4xy or 1/3yz), multiplying the entire equation by that variable (y, in this case) is often the fastest way to consolidate everything into y² terms, avoiding messy fraction-within-fraction steps.", "why": "Multiply every term in 1/(4xy) + xyz = 1/(3yz) by y: this gives 1/(4x) + xy²z = 1/(3z). Subtract 1/(4x) from both sides: xy²z = 1/(3z) − 1/(4x). Combine the right side over a common denominator: 1/(3z) − 1/(4x) = (4x − 3z)/(12xz). So xy²z = (4x−3z)/(12xz). Divide both sides by xz: y² = (4x−3z)/(12x²z²). Take the square root of both sides (keeping the positive root since y is positive): y = √[(4x−3z)/(12x²z²)].", "steps": ["Step 1: Start with the given equation: 1/(4xy) + xyz = 1/(3yz).", "Step 2: Multiply every single term in the equation by y to begin clearing y from the denominators: y/(4xy) + xy(yz) = y/(3yz).", "Step 3: Simplify each term: y/(4xy) = 1/(4x); xy(yz) = xy²z; y/(3yz) = 1/(3z). The equation becomes: 1/(4x) + xy²z = 1/(3z).", "Step 4: Subtract 1/(4x) from both sides to isolate the xy²z term: xy²z = 1/(3z) − 1/(4x).", "Step 5: Combine the right side into a single fraction using the common denominator 12xz: 1/(3z) = 4x/(12xz), and 1/(4x) = 3z/(12xz), so 1/(3z) − 1/(4x) = (4x − 3z)/(12xz).", "Step 6: Now the equation reads: xy²z = (4x − 3z)/(12xz).", "Step 7: Divide both sides by xz to isolate y²: y² = (4x − 3z)/(12xz × xz) = (4x − 3z)/(12x²z²).", "Step 8: Take the square root of both sides. Since y is stated to be a positive number, keep only the positive root: y = √[(4x − 3z)/(12x²z²)].", "Step 9: This matches choice B."], "trap": "Choice A is the most commonly picked wrong answer — it correctly derives the expression for y², (4x−3z)/(12x²z²), but forgets to take the final square root step, mistakenly presenting y² as if it were y itself.", "poe": [{"letter": "A", "text": "This expression, (4x−3z)/(12x²z²), is actually equal to y² (as derived in Step 7), NOT y itself — the crucial final square root step was skipped."}, {"letter": "C", "text": "This has a completely different structure (1 over a difference of terms) that doesn't match the algebra needed to isolate y from the original equation — likely from an error in combining fractions."}, {"letter": "D", "text": "This applies a square root to the correct 'shape' of expression (C) but that underlying expression itself is already incorrect, compounding the earlier error rather than fixing it."}], "desmos": ["Step 1: Since this equation has three variables (x, y, z), pick simple test values for two of them to verify your algebra — let's use x = 1 and z = 1. Step 2: Open Desmos and type the original equation with these values substituted, using y as the remaining variable: 1/(4*1*y)+1*y*1=1/(3*y*1), or simplified: 1/(4y)+y=1/(3y)", "Step 3: Press Enter — Desmos will solve this one-variable equation for y and plot the positive solution as a point.", "Step 4: Now test your derived formula with the same values (x=1, z=1): type sqrt((4*1-3*1)/(12*1^2*1^2)) — this should evaluate to sqrt(1/12), and you can compare this decimal value to the y-value Desmos found by solving the original equation directly — if they match, your formula (and choice B) is confirmed correct."]}, {"gi": 19, "domain": "Nonlinear equations in one variable and systems of equations in two variables", "num": 8, "diff": "Hard", "gridin": false, "correct": "A", "rule": "The absolute value of any real number is always greater than or equal to zero — an absolute value expression can NEVER equal a negative number. If an equation sets an absolute value expression equal to a negative number, that equation has NO solutions, no matter what expression is inside the absolute value bars.", "tip": "Before doing any algebra on an absolute value equation, always glance at what's on the OTHER side of the equals sign first. If that side is a negative number, you can immediately conclude there are zero solutions without any further work — this is one of the fastest 'free points' available on this type of question.", "why": "The equation |4x − 3| = −9 sets an absolute value expression equal to −9, a negative number. Since absolute value always produces a result that is zero or positive, it can never equal a negative number like −9 — so this equation has no solutions at all.", "steps": ["Step 1: Look at the given equation: |4x − 3| = −9.", "Step 2: Recall the fundamental property of absolute value: |anything| is always greater than or equal to 0 — it can never be negative, because absolute value measures distance from zero, and distance is never negative.", "Step 3: Since the right side of the equation is −9 (a negative number), and the left side (an absolute value expression) can never be negative, there is no possible value of x that could make this equation true.", "Step 4: Conclude that the equation has zero solutions, matching choice A."], "trap": "Choice B (One) is the most commonly picked wrong answer — students sometimes rush into solving the equation algebraically (splitting into 4x − 3 = −9 and 4x − 3 = 9, or similar), without first checking whether the equation is even solvable in the first place, and may mistakenly think one of these branches gives a valid answer.", "poe": [{"letter": "B", "text": "Selecting 'One' suggests attempting to solve algebraically without first recognizing that an absolute value can never equal a negative number — this check should happen BEFORE any algebra, avoiding wasted work entirely."}, {"letter": "C", "text": "Selecting 'Two' would apply the standard 'absolute value equations have two solutions' rule, but that rule only applies when the other side of the equation is POSITIVE — with a negative number on the other side, this rule doesn't apply at all."}, {"letter": "D", "text": "'Infinitely many' would apply if the equation were something like |4x−3| = |4x−3| (always true) — but this equation asks for a SPECIFIC negative value, which absolute value expressions can never produce, regardless of x."}], "desmos": ["Step 1: Open Desmos and type the left side of the equation as a function: y=abs(4x-3)", "Step 2: Press Enter — Desmos graphs this V-shaped absolute value function, which you'll notice never dips below the x-axis (y is always ≥ 0).", "Step 3: Type a second line: y=-9 — this creates a flat horizontal line far below the x-axis.", "Step 4: Observe that the V-shaped graph and the horizontal line never touch or cross anywhere on the graph — no matter how far you scroll left or right, the absolute value graph stays at or above y = 0, while the line sits at y = −9.", "Step 5: This visual confirms there are zero intersection points, meaning zero solutions to the equation, matching choice A."]}, {"gi": 20, "domain": "Nonlinear equations in one variable and systems of equations in two variables", "num": 9, "diff": "Hard", "gridin": true, "correct": "59", "rule": "For an equation already written as a product of factors set equal to zero, first find ALL the individual solutions using the Zero Product Property, then use the given information (like the sum of all solutions) to solve for any remaining unknown constant.", "tip": "When one factor is a difference of squares pattern (like 16 − x²), remember it factors further into TWO solutions (x = 4 and x = −4), not just one — don't forget this hidden second solution when counting up all the values that make the equation true.", "why": "Setting each factor to zero: (x − k) = 0 gives x = k; (16 − x²) = 0 means x² = 16, giving x = 4 or x = −4. So the three solutions are k, 4, and −4. Since the sum of all solutions is 59: k + 4 + (−4) = 59, which simplifies to k + 0 = 59, so k = 59.", "steps": ["Step 1: Recognize the equation is already factored: (1/7)(x − k)(16 − x²) = 0.", "Step 2: Since 1/7 is just a nonzero constant multiplying everything, it doesn't affect where the equation equals zero — focus on the two remaining factors: (x − k) and (16 − x²).", "Step 3: Set the first factor equal to zero: x − k = 0, giving x = k.", "Step 4: Set the second factor equal to zero: 16 − x² = 0, which means x² = 16.", "Step 5: Take the square root of both sides: x = 4 or x = −4 (remembering that squaring EITHER a positive or negative 4 gives 16, so BOTH are valid solutions).", "Step 6: The complete solution set is {k, 4, −4}.", "Step 7: Add up all the solutions and set this equal to the given sum: k + 4 + (−4) = 59.", "Step 8: Simplify: k + 0 = 59, so k = 59.", "Step 9: This is a grid-in question — enter 59 as your final answer."], "trap": "A common error on this problem is forgetting that 16 − x² = 0 produces TWO solutions (both x = 4 and x = −4), not just one — a student who only finds x = 4 (forgetting the negative root) would set up the wrong sum equation (k + 4 = 59, giving an incorrect k = 55).", "poe": [], "desmos": ["Step 1: Open Desmos and type the equation with k as a slider: y=(1/7)(x-k)(16-x^2)", "Step 2: Desmos will offer to create a slider for k
