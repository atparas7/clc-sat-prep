tep 2: Press Enter — Desmos will evaluate this to 6.3, confirming your grid-in answer."]}, {"gi": 41, "domain": "Circles", "num": 2, "diff": "Medium", "gridin": false, "correct": "A", "rule": "For a circle equation in the form (x−h)² + (y−k)² = r², the center is at (h,k) and the radius is r (the square root of the right-hand side). Any point (q,s) on the circle must have its x-coordinate q within the range [h−r, h+r], since the circle can't extend further left or right than one radius from its center.", "tip": "Once you identify the center and radius, find the circle's LEFTMOST and RIGHTMOST possible x-values by subtracting and adding the radius to the center's x-coordinate — any answer choice OUTSIDE this range cannot be a valid x-coordinate for a point on the circle.", "why": "From the equation, the center is (3, −16) and the radius is √289 = 17. This means any point on the circle must have an x-coordinate between 3−17=−14 and 3+17=20. Checking the choices: −17 falls OUTSIDE this range (since −17 < −14), making it NOT a possible value of q.", "steps": ["Step 1: Identify the center and radius from the equation (x−3)² + (y+16)² = 289: center = (3, −16), radius = √289 = 17.", "Step 2: Determine the range of possible x-coordinates for any point on the circle: from (center x − radius) to (center x + radius), which is (3−17) to (3+17), or −14 to 20.", "Step 3: Check each answer choice against this range: −17 is LESS than −14, meaning it falls outside the circle's possible x-range.", "Step 4: Since −17 cannot be a valid x-coordinate for any point on this circle, it is NOT a possible value of q.", "Step 5: This matches choice A."], "trap": "Choice D (17) is the most commonly picked wrong answer for students who confuse the RADIUS value (17) with a boundary condition, without correctly calculating the actual x-range (which extends all the way to 20, well past 17) — 17 is actually well within the valid range.", "poe": [{"letter": "B", "text": "−3 falls within the valid range (−14 to 20), so it IS a possible value of q — a point on the circle could have this x-coordinate."}, {"letter": "C", "text": "3 is the x-coordinate of the CENTER itself, which is well within the valid range — definitely a possible value of q (in fact, points directly above/below the center have this x-coordinate)."}, {"letter": "D", "text": "17 falls within the valid range (−14 to 20), so it IS a possible value of q, even though it happens to match the radius value numerically — this is a coincidence, not a boundary violation."}], "desmos": ["Step 1: Open Desmos and type the circle equation exactly as given: (x-3)^2+(y+16)^2=289", "Step 2: Press Enter — Desmos will graph the circle.", "Step 3: Visually inspect the graph's leftmost and rightmost extent along the x-axis — you should see the circle spans from x=−14 to x=20.", "Step 4: Check each answer choice against this visible range — you'll see x=−17 falls clearly to the LEFT of where the circle exists, confirming it's not a possible value of q and matching choice A."]}, {"gi": 42, "domain": "Circles", "num": 3, "diff": "Medium", "gridin": false, "correct": "B", "rule": "For a circle equation in the form (x−h)² + (y−k)² = (expression)², the center is always at (h,k), and the radius is the SQUARE ROOT of whatever is on the right-hand side — even if that right-hand side contains a variable or constant like k.", "tip": "Don't assume the right-hand side of a circle equation is already the radius itself — it's actually the radius SQUARED. Always take the square root of the entire right-hand expression (constants and all) to find the true radius, especially when that side contains extra variables.", "why": "From the equation (x−19)² + (y−17)² = 64k², the center is directly readable as (19, 17). The radius is the square root of the right-hand side: √(64k²) = √64 × √(k²) = 8 × k = 8k (since k is stated to be positive, √(k²) = k without needing absolute value bars).", "steps": ["Step 1: Identify the center directly from the equation's structure (x−19)² + (y−17)²: the center is (19, 17).", "Step 2: Identify the radius by taking the square root of the right-hand side: radius = √(64k²).", "Step 3: Simplify this square root by taking the square root of each factor separately: √64 × √(k²) = 8 × k (since k is given as positive, √(k²) simplifies directly to k, no absolute value needed).", "Step 4: The radius is 8k.", "Step 5: This matches choice B: center (19,17), radius 8k."], "trap": "Choice C (radius 64) is the most commonly picked wrong answer — it uses the right-hand side value (64, ignoring the k² part) directly as if it were already the radius, without taking the necessary square root or accounting for the k² term.", "poe": [{"letter": "A", "text": "This gives radius 8 (a constant), completely dropping the k variable — but the right side of the equation includes k², which must be accounted for in the radius (giving 8k, not just 8)."}, {"letter": "C", "text": "This gives radius 64, using the right-hand side directly without taking the square root at all — but 64k² is the radius SQUARED, not the radius itself."}, {"letter": "D", "text": "This gives radius 64k, taking the square root of only the k² part but forgetting to also take the square root of the 64 (which becomes 8, not staying as 64)."}], "desmos": ["Step 1: Since this problem involves the variable k, pick a simple test value to verify — let's use k = 2. Step 2: Open Desmos and type the equation with this value: (x-19)^2+(y-17)^2=64*2^2", "Step 3: Press Enter — Desmos graphs this circle. Click on the circle or use the graph settings to inspect its radius — it should show a radius of 16 (since 8k = 8×2 = 16, matching choice B's formula).", "Step 4: Compare this to what choice A would predict (radius 8, ignoring k) — you'll see the actual graphed radius (16) doesn't match constant 8, confirming that k must be included in the radius formula, verifying choice B."]}, {"gi": 43, "domain": "Circles", "num": 4, "diff": "Medium", "gridin": false, "correct": "C", "rule": "To convert an angle measure from RADIANS to DEGREES, multiply by the conversion factor (180°/π). This works because a full circle is both 2π radians and 360°, so π radians = 180°, giving the conversion ratio 180°/π.", "tip": "Memorize the conversion factor as a single fraction you can multiply by: radians × (180°/π) = degrees. Keep the units visible in your head as you multiply — this helps confirm you're multiplying (not dividing) and using the correctly-oriented fraction.", "why": "To convert the given radian measure (−5/6)π to degrees, multiply by the conversion factor (180°/π): (−5/6)π × (180°/π). This matches the structure shown in choice C, using the correctly-oriented conversion fraction.", "steps": ["Step 1: Recall the radians-to-degrees conversion factor: multiply the radian measure by (180°/π).", "Step 2: Apply this to the given difference, −(5/6)π radians: multiply by (180°/π).", "Step 3: Set up the expression: −(5/6)π × (180°/π).", "Step 4: This exact structure — the original radian expression multiplied by (180°/π) — matches choice C."], "trap": "Choice B is the most commonly picked wrong answer — it uses the UPSIDE-DOWN conversion fraction (180°/π written correctly in form, but let's check: B actually shows 180°/π as well, so the key error for OTHER choices is using the wrong fraction orientation or the wrong numeric conversion constant (360 instead of 180).", "poe": [{"letter": "A", "text": "This uses 360°/π instead of 180°/π — but the correct conversion factor for radians to degrees uses 180° (since π radians = 180°, not 360°)."}, {"letter": "B", "text": "This uses the fraction the wrong way, dividing by degrees-per-something inconsistently — always double check that multiplying radians by (180/π) gives degrees, matching the units correctly."}, {"letter": "D", "text": "This drops the π entirely from the original expression, changing it from −(5/6)π to just −(5/6) before applying a conversion — this loses essential information from the original radian measure."}], "desmos": ["Step 1: Open Desmos and calculate the numeric degree value directly: type -(5/6)*pi*(180/pi)", "Step 2: Press Enter — Desmos will simplify this (the π terms cancel) and evaluate to −150, confirming the angle is −150° in degree form.", "Step 3: Compare this calculation's STRUCTURE (original radian expression × 180/π) to each answer choice — choice C matches this exact structure, confirming it's the correct expression."]}, {"gi": 44, "domain": "Circles", "num": 5, "diff": "Hard", "gridin": false, "correct": "D", "rule": "For any circle centered at the origin (0,0), every point (x,y) on the circle satisfies x² + y² = r², where r is the radius. If you know one point on the circle, you can find the radius, then use that radius to find missing coordinates of other points.", "tip": "When a circle is centered at the origin and you're given one 'nice' point (like where it crosses an axis), use that point FIRST to find the radius — points on the x-axis or y-axis are the easiest way to directly read off the radius length.", "why": "Since the point (8,0) lies on the circle centered at the origin, this tells us the radius directly: r = 8 (the distance from the origin to (8,0) along the x-axis). Now use the circle equation x² + y² = r² = 64 with the point (2,k): 2² + k² = 64, so k² = 64 − 4 = 60, giving k = √60.", "steps": ["Step 1: Use the given point (8,0) to find the radius: since this point is on the x-axis and the circle is centered at the origin, the distance from the origin to (8,0) IS the radius: r = 8.", "Step 2: Write the circle's equation using this radius: x² + y² = 8² = 64.", "Step 3: Substitute the other given point (2,k) into this equation: 2² + k² = 64.", "Step 4: Simplify: 4 + k² = 64.", "Step 5: Solve for k²: k² = 64 − 4 = 60.", "Step 6: Take the square root: k = √60 (taking the positive root, since the point appears above the x-axis in the figure).", "Step 7: This matches choice D."], "trap": "Choice C (8) is the most commonly picked wrong answer — it mistakenly uses the radius value (8) directly as k, without correctly applying the circle equation to account for the point's x-coordinate (2) as well.", "poe": [{"letter": "A", "text": "6 doesn't correspond to a correct calculation using the circle equation with the given points — likely a distractor value."}, {"letter": "B", "text": "7 similarly doesn't align with the correct calculation √60 ≈ 7.75 — close but not exact, possibly from an estimation or rounding error rather than exact calculation."}, {"letter": "C", "text": "8 is simply the radius value itself, mistakenly applied directly as k without accounting for the point (2,k)'s x-coordinate through the full circle equation."}], "desmos": ["Step 1: Open Desmos and confirm the radius using the given point: type sqrt(8^2+0^2) — this confirms radius = 8.", "Step 2: Solve for k using the circle equation with the point (2,k): type sqrt(8^2-2^2)", "Step 3: Press Enter — Desmos will evaluate this to √60 (approximately 7.746), confirming k = √60 and matching choice D."]}, {"gi": 45, "domain": "Circles", "num": 6, "diff": "Hard", "gridin": false, "correct": "B", "rule": "To find the center and radius of a circle from an equation NOT already in standard form (x−h)²+(y−k)²=r², use COMPLETING THE SQUARE on both the x-terms and y-terms separately to rewrite the equation into that standard form.", "tip": "When completing the square for a term like x² + bx, take half of the coefficient b, square it, and add (and immediately subtract) that value to keep the equation balanced — this systematic process works every time, even when the coefficient involves a square root like √t here.", "why": "Complete the square for the x-terms (x² + x√t): take half of √t (giving √t/2), square it (giving t/4), and rewrite as (x + √t/2)² − t/4. Complete the square for the y-terms (y² − y): take half of −1 (giving −1/2), square it (giving 1/4), and rewrite as (y − 1/2)² − 1/4. The full equation becomes (x+√t/2)² − t/4 + (y−1/2)² − 1/4 − 65 = 0, which rearranges to (x+√t/2)² + (y−1/2)² = 65.25 + t/4. Since the radius is given as √83, meaning radius² = 83: set 65.25 + t/4 = 83, and solve for t.", "steps": ["Step 1: Group the x-terms and y-terms separately: (x² + x√t) + (y² − y) − 65 = 0.", "Step 2: Complete the square for the x-terms: take half of the coefficient of x (which is √t), giving √t/2; square this to get t/4. Rewrite: x² + x√t = (x + √t/2)² − t/4.", "Step 3: Complete the square for the y-terms: take half of the coefficient of y (which is −1), giving −1/2; square this to get 1/4. Rewrite: y² − y = (y − 1/2)² − 1/4.", "Step 4: Substitute these completed-square forms back into the original equation: (x+√t/2)² − t/4 + (y−1/2)² − 1/4 − 65 = 0.", "Step 5: Move all the constant terms to the right side: (x+√t/2)² + (y−1/2)² = 65 + 1/4 + t/4 = 65.25 + t/4.", "Step 6: Since the radius is given as √83, the right side of the standard-form equation must equal 83 (radius squared): 65.25 + t/4 = 83.", "Step 7: Solve for t: t/4 = 83 − 65.25 = 17.75.", "Step 8: Multiply both sides by 4: t = 17.75 × 4 = 71.", "Step 9: This matches choice B."], "trap": "Choice A (73) is the most commonly picked wrong answer — it typically results from a small arithmetic slip while combining the constant terms (65, 1/4, and the target 83), such as forgetting to include the 1/4 from completing the square on the y-terms.", "poe": [{"letter": "A", "text": "73 likely comes from a minor arithmetic error while combining the constant terms during the completing-the-square process — perhaps omitting the 1/4 term from the y-completion."}, {"letter": "C", "text": "37 doesn't correspond to a clean derivation from this equation — possibly a factor-of-2 error somewhere in the process."}, {"letter": "D", "text": "35 similarly doesn't align with a correct completing-the-square derivation — likely from a more significant setup error."}], "desmos": ["Step 1: Since this problem involves solving for an /216.", "Step 4: Reduce the fraction 36/216 by dividing both by 36: 36/216 = 1/6.", "Step 5: So angle B = π/6 radians.", "Step 6: Recall the standard value: cos(π/6) = √3/2 (this is one of the standard reference angles, equivalent to 30°).", "Step 7: This matches choice D."], "trap": "Choice C (√2/2) is the most commonly picked wrong answer — it's the cosine value for a DIFFERENT standard angle (π/4, or 45°), confusing it with the correct angle π/6 (30°) found in this problem.", "poe": [{"letter": "A", "text": "0 would be the value of cos(π/2) (90°) — a completely different angle than the π/6 found in this problem."}, {"letter": "B", "text": "1/2 is actually the value of sin(π/6), not cos(π/6) — a common mix-up between sine and cosine values for the same standard angle."}, {"letter": "C", "text": "√2/2 is the value of cos(π/4) (45°) — this belongs to a different standard angle than the π/6 calculated here."}], "desmos": ["Step 1: Open Desmos and calculate angle B first: type 36*(pi/216) — this confirms angle B = π/6 (approximately 0.524 radians).", "Step 2: Calculate the cosine of this angle: type cos(36*(pi/216))", "Step 3: Press Enter — Desmos will evaluate this to approximately 0.866, which matches √3/2 (you can verify by typing sqrt(3)/2 separately to compare the decimal values), confirming choice D."]}, {"gi": 49, "domain": "Circles", "num": 10, "diff": "Hard", "gridin": true, "correct": "3", "rule": "To convert an angle from DEGREES to RADIANS, multiply by the conversion factor (π/180°). A common shortcut for recognizable angles: 60° always equals π/3 radians — memorizing a few common conversions (30°=π/6, 45°=π/4, 60°=π/3, 90°=π/2) can save time.", "tip": "When you see a degree measure that's a 'nice' fraction of 180° (like 60°, which is 180°/3), you can often recognize the radian equivalent directly from memory rather than doing the full conversion calculation each time.", "why": "Converting 60° to radians: 60° × (π/180°) = 60π/180 = π/3 (simplifying the fraction 60/180 to 1/3). Since the problem states angle L's measure is π/n radians, and we've found it equals π/3, comparing directly: π/n = π/3, so n = 3.", "steps": ["Step 1: Convert the given angle measure from degrees to radians: 60° × (π/180°).", "Step 2: Simplify the fraction 60/180 by dividing both by 60: 60/180 = 1/3.", "Step 3: So 60° = π/3 radians.", "Step 4: Compare this to the given form π/n: since angle L = π/3 = π/n, this means n = 3.", "Step 5: This is a grid-in question — enter 3 as your final answer."], "trap": "A common error on this problem is miscalculating the fraction 60/180, perhaps simplifying incorrectly or forgetting to reduce it fully to 1/3, which would lead to an incorrect value of n.", "poe": [], "desmos": ["Step 1: Open Desmos and convert 60 degrees to radians directly: type 60*pi/180", "Step 2: Press Enter — Desmos will simplify this to π/3 (or show the decimal equivalent, approximately 1.047).", "Step 3: Since the problem states the angle equals π/n, and you've found it equals π/3, this directly confirms n = 3 for your grid-in answer."]}, {"gi": 50, "domain": "Circles", "num": 11, "diff": "Hard", "gridin": true, "correct": "49", "rule": "When two circles share the SAME CENTER (concentric circles) and one radius is described as a certain amount MORE than the other (an additive relationship, not a multiplicative one), first find the original radius, then ADD the stated amount to get the new radius — don't confuse this with problems where the new radius is a MULTIPLE of the original.", "tip": "Read the relationship between the two radii VERY carefully — 'is 2 units greater than' means ADD 2 to the radius (not to the radius squared, and not multiply by 2) — this additive relationship is different from 'twice as large' problems, which require multiplication instead.", "why": "Circle F has radius² = 25 (from the equation), so radius = 5. Circle G's radius is 2 units GREATER than circle F's radius: 5 + 2 = 7. Since circle G's equation uses p as the right-hand side (equivalent to radius²), p = 7² = 49.", "steps": ["Step 1: Identify circle F's radius from its equation (x+8)² + (y+8)² = 25: radius² = 25, so radius = √25 = 5.", "Step 2: Apply the given relationship: circle G's radius is 2 units GREATER than circle F's radius (an ADDITION, not a multiplication): circle G's radius = 5 + 2 = 7.", "Step 3: Since circle G's equation is written as (x+8)² + (y+8)² = p, the value p represents circle G's radius SQUARED.", "Step 4: Calculate p: p = 7² = 49.", "Step 5: This is a grid-in question — enter 49 as your final answer."], "trap": "A common error on this problem is confusing this ADDITIVE relationship ('2 units greater') with a MULTIPLICATIVE one (like 'twice as large'), which would incorrectly lead to a radius of 10 (5×2) instead of the correct 7 (5+2), and consequently an incorrect p value of 100 instead of 49.", "poe": [], "desmos": ["Step 1: Open Desmos and calculate circle F's radius first: type sqrt(25) — this confirms radius = 5.", "Step 2: Calculate circle G's radius using the additive relationship: type 5+2 — this confirms radius = 7.", "Step 3: Calculate p (radius squared): type 7^2", "Step 4: Press Enter — Desmos will evaluate this to 49, confirming your grid-in answer."]}, {"gi": 51, "domain": "Circles", "num": 12, "diff": "Hard", "gridin": true, "correct": "-2", "rule": "To find the center and radius of a circle from an equation with x² and y² terms plus linear terms (not in standard form), use COMPLETING THE SQUARE on both the x-terms and y-terms. Once you have the standard form, you can relate the radius to any given point on a related (same-center) circle using the distance formula.", "tip": "When a problem involves TWO related circles (same center, different size) and gives you an actual POINT on the second circle, use the distance formula from the shared center to that point to find the second circle's radius directly — this is often more reliable than trying to track scale factors through multiple algebraic steps.", "why": "Complete the square on x²−10x (giving (x−5)²−25) and y²−8y (giving (y−4)²−16). The equation becomes (x−5)² + (y−4)² = 25+16+14n = 41+14n, so circle A has center (5,4) and radius² = 41+14n. Circle B has the same center (5,4) with a diameter twice circle A's — meaning circle B's radius is twice circle A's radius. Using the given point (11,8) on circle B, calculate circle B's actual radius via the distance formula: √[(11−5)²+(8−4)²] = √(36+16) = √52, so circle B's radius² = 52. Since circle B's radius = 2 × circle A's radius, circle B's radius² = 4 × circle A's radius²: 52 = 4×(41+14n). Solving: 13 = 41+14n, so 14n = −28, giving n = −2.", "steps": ["Step 1: Complete the square for the x-terms in x² − 10x: take half of −10 (giving −5), square it (giving 25), rewrite as (x−5)² − 25.", "Step 2: Complete the square for the y-terms in y² − 8y: take half of −8 (giving −4), square it (giving 16), rewrite as (y−4)² − 16.", "Step 3: Substitute back into the original equation: (x−5)² − 25 + (y−4)² − 16 − 14n = 0.", "Step 4: Rearrange to standard form: (x−5)² + (y−4)² = 25 + 16 + 14n = 41 + 14n. This means circle A has center (5,4) and radius² = 41+14n.", "Step 5: Circle B shares the same center (5,4) but has TWICE the diameter of circle A — meaning circle B's radius is also twice circle A's radius.", "Step 6: Use the given point (11,8) on circle B to find circle B's actual radius via the distance formula from the center (5,4): distance = √[(11−5)² + (8−4)²] = √(36+16) = √52. So circle B's radius² = 52.", "Step 7: Since circle B's radius = 2 × circle A's radius, squaring both sides: circle B's radius² = 4 × circle A's radius². Substitute: 52 = 4 × (41+14n).", "Step 8: Divide both sides by 4: 13 = 41 + 14n.", "Step 9: Solve for n: 14n = 13 − 41 = −28, so n = −28/14 = −2.", "Step 10: This is a grid-in question — enter −2 as your final answer."], "trap": "A common error on this problem is forgetting that DOUBLING the diameter means the radius SQUARED
