,681.", "Step 4: This means trapezoid A's area is 1,681 times as large as trapezoid B's area.", "Step 5: This is a grid-in question — enter 1,681 as your final answer."], "trap": "A common error on this problem is using the linear scale factor (41) directly as the final answer, without squaring it to correctly account for the fact that area is a two-dimensional measurement — remember, side-length ratios must always be squared to find area ratios.", "poe": [], "desmos": ["Step 1: Open Desmos and calculate the area ratio by squaring the given linear scale factor: type 41^2", "Step 2: Press Enter — Desmos will evaluate this to 1681, confirming your grid-in answer.", "Lines, angles, and triangles", "14 questions  ·  Easy 2  /  Medium 6  /  Hard 6"]}, {"gi": 17, "domain": "Lines, angles, and triangles", "num": 1, "diff": "Easy", "gridin": false, "correct": "B", "rule": "When two straight lines cross, the two angles directly ACROSS from each other (diagonally opposite, formed by the same two lines) are called vertical angles, and vertical angles are always EQUAL — this is true regardless of whether any other lines in the figure are parallel.", "tip": "Before using any parallel-line facts (corresponding, alternate interior angles), first check if the two labeled angles are simply VERTICAL angles at the SAME intersection point — if so, they're equal by a much more basic rule, and you don't need the parallel-line information at all.", "why": "The angles labeled x° and 72° are formed at the same intersection point (where line t crosses line p), positioned diagonally opposite each other — making them vertical angles, which are always equal: x = 72.", "steps": ["Step 1: Identify the two labeled angles' positions: x° and 72° are both located at the single intersection point where line t crosses line p.", "Step 2: Determine their relationship: they are diagonally opposite each other at this intersection, making them vertical angles.", "Step 3: Apply the vertical angles theorem: vertical angles are always equal, regardless of any other properties in the figure (like whether p is parallel to r).", "Step 4: Since 72° is given, x = 72.", "Step 5: This matches choice B."], "trap": "Choice A (36) is the most commonly picked wrong answer — it results from incorrectly halving 72°, perhaps confusing this problem with a different angle-bisector scenario that doesn't apply here.", "poe": [{"letter": "A", "text": "36 is half of 72 — this might come from mistakenly assuming some bisecting relationship that doesn't apply to vertical angles, which are simply equal, not related by a factor of 2."}, {"letter": "C", "text": "180 would be the result of treating x and 72 as a LINEAR PAIR (supplementary angles) instead of vertical angles — but based on their diagonal positions in the figure, they are vertical (equal), not supplementary."}, {"letter": "D", "text": "252 comes from adding 180 + 72 — this doesn't correspond to any standard angle relationship in this figure."}], "desmos": ["This is a straightforward vertical-angles reading question that doesn't require Desmos calculation — the answer (x=72) follows directly from the vertical angles theorem, visible in the figure itself. If you want to visually confirm, you could sketch the intersection using Desmos's geometry tools by plotting two intersecting lines and observing that the opposite angle pairs are always visually equal."]}, {"gi": 18, "domain": "Lines, angles, and triangles", "num": 2, "diff": "Easy", "gridin": false, "correct": "B", "rule": "When a transversal crosses two lines, CORRESPONDING angles (angles in the SAME relative position at each intersection) are equal IF AND ONLY IF the two lines are parallel. This is the Corresponding Angles Postulate, and it works in both directions — equal corresponding angles PROVE the lines are parallel.", "tip": "To identify corresponding angles, imagine 'sliding' one intersection point along the transversal until it lands on top of the other intersection point — whichever two angles end up in the same relative position (same side of the transversal, same side of the crossed lines) are corresponding angles.", "why": "The angle 24° (at the r intersection) and the angle x° (at the s intersection) are both positioned in the same relative spot — below their respective horizontal line, on the same side of the transversal t. This makes them corresponding angles. For lines r and s to be parallel, corresponding angles must be equal, so the required condition is x = 24.", "steps": ["Step 1: Identify the positions of the two labeled angles: 24° is at the intersection of t and r; x° is at the intersection of t and s.", "Step 2: Compare their relative positions: both angles sit in the same location relative to their own intersection (same side of line t, same side of the horizontal line) — this makes them corresponding angles.", "Step 3: Recall the Corresponding Angles Postulate: two lines cut by a transversal are parallel IF AND ONLY IF corresponding angles are equal.", "Step 4: Apply this to find the necessary condition: for r and s to be parallel, x must equal 24.", "Step 5: This matches choice B."], "trap": "Choice D is the most commonly picked wrong answer — it proposes an equation (x − 24 = 360) that doesn't correspond to any standard angle relationship; a difference of 360° doesn't make sense for two angles that should logically be somewhere between 0° and 180°.", "poe": [{"letter": "A", "text": "x < 24 doesn't establish a precise EQUALITY needed for the Corresponding Angles Postulate — parallel lines require the angles to be exactly equal, not merely one smaller than the other."}, {"letter": "C", "text": "x > 24 has the same problem as choice A — an inequality doesn't provide the precise equality condition needed to prove the lines are parallel."}, {"letter": "D", "text": "x − 24 = 360 doesn't correspond to any meaningful angle relationship — angle measures in this context are between 0° and 180°, making a 360° difference nonsensical here."}], "desmos": ["This is a conceptual angle-relationship question that doesn't require numerical calculation in Desmos — the answer follows directly from correctly identifying corresponding angles and applying the Corresponding Angles Postulate. If you want to visually verify, you could use Desmos's geometry tools to draw two parallel lines cut by a transversal and confirm that the corresponding angle positions always show equal angle measures."]}, {"gi": 19, "domain": "Lines, angles, and triangles", "num": 3, "diff": "Medium", "gridin": false, "correct": "C", "rule": "The three interior angles of ANY triangle always add up to exactly 180°. If you know the sum of two angles, you can always find the third by subtracting from 180.", "tip": "This is one of the most fundamental and frequently-used facts in geometry — memorize it so thoroughly that you can apply it instantly without hesitation: angle1 + angle2 + angle3 = 180° for every triangle, no exceptions.", "why": "Since all three angles of a triangle sum to 180°, and two of the angles sum to 64°, the third angle must be 180 − 64 = 116.", "steps": ["Step 1: Recall the triangle angle sum theorem: the three interior angles of any triangle always add up to 180°.", "Step 2: The problem states two of the angles sum to 64°.", "Step 3: Find the third angle by subtracting this sum from 180°: 180 − 64 = 116.", "Step 4: This matches choice C."], "trap": "Choice A (26) is the most commonly picked wrong answer — it results from an unrelated calculation (like 90 − 64 = 26, perhaps confusing this with a right-triangle complementary-angle problem) rather than correctly using the 180° triangle angle sum.", "poe": [{"letter": "A", "text": "26 comes from 90 − 64 = 26 — this incorrectly applies the COMPLEMENTARY angle rule (which only applies to two acute angles in a RIGHT triangle summing to 90°), not the general triangle angle sum of 180° that applies here."}, {"letter": "B", "text": "52 is exactly half of 104, or possibly half of the correct answer — doesn't correspond to a direct calculation from the given 64° sum."}, {"letter": "D", "text": "128 is exactly double the correct answer (116×... actually let's check: 128 doesn't have an obvious simple relationship, possibly from a different arithmetic error)."}], "desmos": ["Step 1: Open Desmos and calculate the third angle directly: type 180-64", "Step 2: Press Enter — Desmos will evaluate this to 116, confirming the third angle and matching choice C."]}, {"gi": 20, "domain": "Lines, angles, and triangles", "num": 4, "diff": "Medium", "gridin": false, "correct": "B", "rule": "When a transversal crosses two lines, CORRESPONDING angles (same relative position at each intersection) are equal IF AND ONLY IF the two lines are parallel. Identifying which pair of labeled angles are truly 'corresponding' (not vertical, not alternate) is the key step in these problems.", "tip": "Carefully trace the SAME relative position at each intersection point — the angle that occupies the identical corner (upper-left, upper-right, lower-left, or lower-right) relative to the crossing lines at BOTH intersections is the corresponding angle pair, regardless of how far apart the intersections are.", "why": "The angle w° (at the r intersection) and the angle y° (at the s intersection) occupy the same relative position at their respective crossings — both in the 'upper-right' region relative to the transversal k and their vertical line. This makes w and y corresponding angles. Since w = 147 (as given), for r and s to be parallel, y must also equal 147.", "steps": ["Step 1: Identify the given angle: w = 147° at the r intersection.", "Step 2: Determine which angle at the s intersection occupies the SAME relative position as w — comparing the figure, this is y° (both are in the upper-right region relative to their intersection).", "Step 3: Recall the Corresponding Angles Postulate: for two lines cut by a transversal to be parallel, corresponding angles must be equal.", "Step 4: Apply this: since w = 147, for r ∥ s, we need y = 147 as well.", "Step 5: This matches choice B."], "trap": "Choice C (w + y = 180) is the most commonly picked wrong answer — it applies the SAME-SIDE INTERIOR angle rule (which requires supplementary angles for parallel lines), but w and y are actually CORRESPONDING angles in this figure (requiring equality, not supplementary sums), not same-side interior angles.", "poe": [{"letter": "A", "text": "x = 33 is already automatically true (since w and x form a linear pair at the SAME intersection point, 147+33=180) regardless of whether r is parallel to s — this doesn't provide NEW information that would help prove the lines are parallel."}, {"letter": "C", "text": "w + y = 180 applies the co-interior (same-side interior) angle relationship — but w and y are positioned as CORRESPONDING angles in this figure, which requires EQUALITY (w=y), not a supplementary sum."}, {"letter": "D", "text": "y + z = 180 is already automatically true (since y and z form a linear pair at the SAME intersection point at s) regardless of whether r is parallel to s — like choice A, this doesn't provide new proof information."}], "desmos": ["This is a conceptual angle-relationship question about identifying corresponding angles in a figure, which doesn't require numerical calculation in Desmos. The key insight is recognizing that w and y occupy matching relative positions at their two intersections — you can verify this type of relationship by sketching two parallel lines with a transversal in Desmos's geometry tools and observing which angle positions consistently match."]}, {"gi": 21, "domain": "Lines, angles, and triangles", "num": 5, "diff": "Medium", "gridin": false, "correct": "C", "rule": "When two triangles are stated to be CONGRUENT, the order of the letters in their names tells you EXACTLY which vertices (and therefore which sides and angles) correspond to each other. Always match up the letters in order — the first letter of one triangle corresponds to the first letter of the other, and so on.", "tip": "Write out the correspondence explicitly before doing any calculations: 'triangle ABC ≅ triangle BDE' means A↔B, B↔D, C↔E — then figure out which given side lengths (r, s) correspond to which sides in each triangle before setting up any equations.", "why": "Since triangle ABC ≅ triangle BDE (correspondence A↔B, B↔D, C↔E), side AB corresponds to side BD, and side BC corresponds to side DE. Given AB = r = 54, this means BD = 54. Given DE = s = 26, this means BC = 26. Since BD = BC + CD (the full horizontal segment from B to D passes through C), we can solve: 54 = 26 + CD, so CD = 54 − 26 = 28.", "steps": ["Step 1: Write out the vertex correspondence from the congruence statement: triangle ABC ≅ triangle BDE means A↔B, B↔D, C↔E.", "Step 2: Match up corresponding sides: side AB (in triangle ABC) corresponds to side BD (in triangle BDE); side BC corresponds to side DE.", "Step 3: Use the given value r = 54 for side AB (the vertical leg in the figure): since AB corresponds to BD, this means BD = 54.", "Step 4: Use the given value s = 26 for side DE (the vertical leg on the right side of the figure): since BC corresponds to DE, this means BC = 26.", "Step 5: Notice from the figure that B, C, and D are all on the same horizontal line, with C between B and D — so BD = BC + CD.", "Step 6: Substitute the known values: 54 = 26 + CD.", "Step 7: Solve for CD: CD = 54 − 26 = 28.", "Step 8: This matches choice C."], "trap": "Choice A (26) is the most commonly picked wrong answer — it directly uses the value of s (26) as the final answer, mistakenly assuming CD equals BC (or DE) directly, without correctly working through the BD = BC + CD relationship along the shared horizontal line.", "poe": [{"letter": "A", "text": "26 is simply the given value of s (which equals BC, not CD) — this skips the necessary step of using BD = BC + CD to solve for the specific segment CD."}, {"letter": "B", "text": "27 doesn't correspond to a clean derivation from the given values — likely an arithmetic slip in combining r and s."}, {"letter": "D", "text": "54 is simply the given value of r (which equals BD, the ENTIRE segment from B to D) — not the same as CD, which is only part of that full segment."}], "desmos": ["Step 1: Open Desmos and set up the relationship you derived: BD (=r=54) equals BC (=s=26) plus CD. Type: 54=26+x", "Step 2: Desmos will treat this as an equation to solve for x — it should plot the solution as x = 28, confirming CD = 28 and matching choice C.", "Step 3: Alternatively, just calculate directly: type 54-26 — Desmos will evaluate this to 28."]}, {"gi": 22, "domain": "Lines, angles, and triangles", "num": 6, "diff": "Medium", "gridin": false, "correct": "C", "rule": "When two triangles share a common side and have two pairs of corresponding sides equal (SSS conditions), they are congruent — and congruent triangles have all corresponding angles equal too. Use this congruence to transfer angle relationships between the two triangles.", "tip": "When a diagonal splits a quadrilateral into two triangles that share that diagonal as a common side, check whether the OTHER two pairs of sides are also equal (as stated in the problem) — if so, the shared diagonal PLUS the two given equal pairs gives you SSS congruence between the two triangles.", "why": "Since CD = EF and FC = DE (given), plus the shared diagonal DF = FD, triangles CDF and EFD are congruent by SSS (with correspondence C↔E, D↔F, F↔D). This congruence means angle CDF (in triangle CDF) equals angle EFD (in triangle EFD), which is y = 30°. The full angle CDE is the sum of angle CDF and angle FDE (which is x = 65°): angle CDE = 30 + 65 = 95.", "steps": ["Step 1: Identify the given side equalities: CD = EF and FC = DE, plus the shared diagonal DF (common to both triangles CDF and EFD).", "Step 2: Recognize this establishes SSS congruence between triangle CDF and triangle EFD, with correspondence C↔E, D↔F, F↔D.", "Step 3: From this congruence, corresponding angles are equal: angle CDF (at vertex D in triangle CDF) corresponds to angle EFD (at vertex F in triangle EFD), which is given as y = 30°. So angle CDF = 30°.", "Step 4: Identify that the full angle CDE (the angle the question asks about) is made up of two parts: angle CDF (just found to be 30°) plus angle FDE (which is given as x = 65°, the angle between DF and DE at vertex D).", "Step 5: Add these two parts together: angle CDE = angle CDF + angle FDE = 30 + 65 = 95.", "Step 6: This matches choice C."], "trap": "Choice B (65°) is the most commonly picked wrong answer — it uses only the value of x (the angle FDE alone) as the final answer, forgetting that angle CDE is actually the SUM of two parts (angle CDF PLUS angle FDE), not just the single labeled x° angle.", "poe": [{"letter": "A", "text": "30° is the value of angle CDF alone (derived from the congruence), not the full angle CDE the question asks for."}, {"letter": "B", "text": "65° is simply the given value of x (angle FDE alone) — this misses that angle CDE also includes the additional angle CDF found through the congruence relationship."}, {"letter": "D", "text": "130° would come from doubling x (65×2=130) — this doesn't correspond to the correct addition of angle CDF (30°) and angle FDE (65°)."}], "desmos": ["This problem relies on establishing triangle congruence and angle relationships, which is a geometric reasoning process rather than a numeric calculation — Desmos isn't the primary tool here. However, you can verify your final answer by adding the two angle components directly: open Desmos and type 30+65 — this confirms 95, matching choice C."]}, {"gi": 23, "domain": "Lines, angles, and triangles", "num": 7, "diff": "Medium", "gridin": false, "correct": "A", "rule": "A DILATION (resizing a figure by a scale factor) changes the SIZE of a figure (its side lengths) but never changes its SHAPE — meaning all the angle measures stay EXACTLY the same before and after dilation.", "tip": "Whenever a problem describes a dilation and asks about an ANGLE measure in the resulting figure, you can skip all the scale-factor calculations entirely — dilations never change angles, so the answer is simply the same angle measure from the original figure.", "why": "Since dilation only changes size, not shape, all angle measures are preserved. The original angle V measures 25°, so its corresponding angle V' in the dilated triangle also measures 25°.", "steps": ["Step 1: Recall the fundamental property of dilation: it changes side lengths (by the scale factor) but NEVER changes angle measures.", "Step 2: Identify the original angle V in triangle TUV: 25° (given in the figure).", "Step 3: Since angle V' in the dilated triangle T'U'V' corresponds to angle V, and dilation preserves angles, angle V' = angle V = 25°.", "Step 4: This matches choice A."], "trap": "Choice C (50) is the most commonly picked wrong answer — it results from incorrectly applying the scale factor to the angle measure (as if angles could be 'dilated' like side lengths), perhaps by doubling 25 instead of recognizing that angles remain unchanged under dilation.", "poe": [{"letter": "B", "text": "38 doesn't correspond to any correct or clearly-derived calculation from this problem — likely a distractor value."}, {"letter": "C", "text": "50 comes from doubling the original angle (25×2=50) — but dilation NEVER changes angle measures, regardless of the scale factor used."}, {"letter": "D", "text": "76 is simply the given side length VU from the original figure — this has nothing to do with the angle measure the question asks about."}], "desmos": ["This is a conceptual question about the properties of dilation, which doesn't require numerical calculation in Desmos. The key fact — that dilation preserves all angle measures regardless of scale factor — is a fundamental geometric principle you can rely on directly. If you want to explore this visually, you could use Desmos's geometry tools to dilate a triangle by various scale factors and observe that the angle measures never change, only the side lengths do."]}, {"gi": 24, "domain": "Lines, angles, and triangles", "num": 8, "diff": "Medium", "gridin": false, "correct": "A", "rule": "When a transversal crosses two lines, SAME-SIDE INTERIOR angles (also called co-interior angles — both on the SAME side of the transversal, both between the two crossed lines) are SUPPLEMENTARY (sum to 180°) IF AND ONLY IF the two lines are parallel.", "tip": "Carefully distinguish between CORRESPONDING angles (which must be EQUAL for parallel lines) and SAME-SIDE INTERIOR angles (which must be SUPPLEMENTARY, summing to 180°) — mixing these up is one of the most common errors on these problems. Trace which side of the transversal each angle sits on, and whether it's 'between' the two lines or 'outside' them.", "why": "The angle 134° (at the j intersection) and angle x° (at the k intersection) are both positioned on the same side of the transversal t, and both face into the interior region between lines j and k — making them same-side interior (co-interior) angles. For j and k to be parallel, these must be supplementary: 134 + x = 180, so x = 46.", "steps": ["Step 1: Identify the positions of the two labeled angles: 134° is at the j intersection; x° is at the k intersection.", "Step 2: Determine their relationship: both are on the same side of transversal t, and both face into the region BETWEEN lines j and k — this makes them same-side interior (co-interior) angles.", "Step 3: Recall the Same-Side Interior Angles Theorem: for two lines cut by a transversal to be parallel, same-side interior angles must be SUPPLEMENTARY (sum to 180°).", "Step 4: Set up the equation: 134 + x = 180.", "Step 5: Solve for x: x = 180 − 134 = 46.", "Step 6: This matches choice A."], "trap": "Choice B (y = 46) is the most commonly picked wrong answer — it applies the correct NUMBER (46) but to the wrong angle (y instead of x); y is actually positioned as the CORRESPONDING angle to w (not to the given 134°), so the relevant relationship for y would require a different equation (y = w, not directly related to 134 in this supplementary way).", "poe": [{"letter": "B", "text": "y is positioned as the corresponding angle to w (not to 134°) — the relationship between y and 134° isn't a direct same-side-interior pairing, so setting y = 46 doesn't correctly use the given information."}, {"letter": "C", "text": "w = 134 is already automatically true (vertical angle to the given 134° at the SAME intersection), regardless of whether j is parallel to k — this doesn't provide new information needed to prove parallelism."}, {"letter": "D", "text": "z = 134 doesn't correspond to a valid parallel-line relationship with the given 134° — z's position relative to 134° isn't a standard corresponding, alternate, or co-interior pairing that would prove parallel lines."}], "desmos": ["This is a conceptual angle-relationship question about identifying same-side interior angles, which doesn't require numerical calculation in Desmos beyond the simple subtraction. To verify: open Desmos and type 180-134 — this confirms 46, matching the value needed for x in choice A. You can also sketch two parallel lines with a transversal in Desmos's geometry tools to visually confirm that same-side interior angles always sum to 180°."]}, {"gi": 25, "domain": "Lines, angles, and triangles", "num": 9, "diff": "Hard", "gridin": false, "correct": "B", "rule": "To prove two triangles are SIMILAR, you need either: (1) two pairs of corresponding angles equal (AA similarity), or (2) two pairs of corresponding sides in the same ratio WITH the INCLUDED angle equal (SAS similarity). A single pair of equal angles plus non-included, non-matching side information is generally NOT sufficient (this creates an ambiguous SSA situation).", "tip": "When checking if a given side-length condition is sufficient for similarity, always verify whether the given equal angle is actually the INCLUDED angle between the two sides being compared — if the angle is NOT between those two specific sides, the SAS criterion doesn't apply, and the condition is likely insufficient (ambiguous SSA case).", "why": "Option I (angle A = angle F) combined with the already-given angle B = angle G provides TWO pairs of equal corresponding angles, which is sufficient for AA similarity — I is sufficient. Option II (angle C = angle H) similarly combines with the given angle B = angle G to provide two equal angle pairs, also sufficient for AA — II is sufficient. Option III (FH = 3×AC) compares sides FH and AC, but these are NOT both adjacent to the given equal angle (B/G) — AC is opposite angle B, not adjacent to it — making this an SSA situation, which is generally NOT sufficient to prove similarity.", "steps": ["Step 1: Note the given information: angle B = angle G = 51°, AB = 6, FG = 18 (so AB/FG = 1/3).", "Step 2: Evaluate option I (angle A = angle F): combined with the given angle B = angle G, this provides two pairs of equal angles, which is sufficient for AA similarity — I is SUFFICIENT.", "Step 3: Evaluate option II (angle C = angle H): similarly, combined with angle B = angle G, this gives two pairs of equal angles, sufficient for AA similarity — II is SUFFICIENT.", "Step 4: Evaluate option III (FH = 3 × AC): check whether angle B/G is INCLUDED between the sides being compared (AB & FG, and now AC & FH). Side AC is OPPOSITE angle B (not adjacent to it), so angle B is NOT the included angle between AB and AC. This means the given ratio conditions (AB/FG = 1/3 and implied AC/FH = 1/3) don't set up a valid SAS criterion — this is an ambiguous SSA situation, which does NOT guarantee similarity — III is NOT SUFFICIENT.", "Step 5: Combining these results: I is sufficient, II is sufficient, but III is not — matching choice B."], "trap": "Choice A is the most commonly picked wrong answer — it assumes all three pieces of information (I, II, and III) are equally valid ways to establish similarity, without carefully checking whether option III's side comparison actually involves the INCLUDED angle needed for a valid SAS-type argument.", "poe": [{"letter": "A", "text": "This incorrectly includes III as sufficient — but III's side ratio (FH/AC) doesn't involve sides adjacent to the given equal angle (B/G), making it an ambiguous SSA case rather than valid SAS."}, {"letter": "C", "text": "This incorrectly excludes I as sufficient — but I (angle A = angle F) directly combines with the given angle B = angle G to provide valid AA similarity, so I IS actually sufficient, contradicting this choice."}, {"letter": "D", "text": "This incorrectly claims III is sufficient while marking both I and II as insufficient — but I and II both provide valid AA similarity conditions (as shown above), making this choice's assessment backwards."}], "desmos": ["This is a conceptual proof-based question about similarity criteria (AA, SAS, SSA), which doesn't involve numerical calculation in Desmos. The key insight — that SSA (side-side-angle, where the angle isn't included between the two given sides) does NOT guarantee similarity or congruence — is a fundamental geometric principle to internalize rather than calculate."]}, {"gi": 26, "domain": "Lines, angles, and triangles", "num": 10, "diff": "Hard", "gridin": false, "correct": "D", "rule": "When two lines intersect and create a pair of parallel segments (like LM ∥ PQ here), the two triangles formed on either side of the intersection point are SIMILAR (by AA, using vertical angles at the intersection plus alternate interior angles from the parallel lines). For similar triangles, the ratio of their AREAS equals the SQUARE of the ratio of their corresponding side lengths.", "tip": "When you spot an 'X' or bowtie shape formed by two segments crossing, with a pair of parallel sides, immediately recognize this as SIMILAR TRIANGLES (via vertical angles + alternate interior angles) — then use corresponding sides (not just any sides) to find the scale factor, and square it for the area ratio.", "why": "Since LM ∥ PQ, triangles LMR and QPR are similar (vertical angles at R, plus alternate interior angles from the parallel lines). The corresponding sides are MR and RP (both connecting to R from the parallel sides), giving a scale factor of MR/RP = 8/14 = 4/7. The area ratio is the SQUARE of this scale factor: (4/7)² = 16/49. Since the area of triangle LMR is 36, the area of triangle PQR is 36 × (49/16) = 1,764/16 = 441/4.", "steps": ["Step 1: Recognize that since LM ∥ PQ, triangles LMR and QPR are similar (by AA: vertical angles at R are equal, and alternate interior angles formed by the parallel lines and the transversals LQ, MP are equal).", "Step 2: Identify the correct corresponding sides: MR (in triangle LMR) corresponds to RP (in triangle QPR), since these are the sides connecting to point R from each parallel segment.", "Step 3: Calculate the scale factor (ratio of corresponding sides): MR/RP = 8/14 = 4/7.", "Step 4: Since triangle PQR is LARGER (RP=14 > MR=8), we need the ratio of PQR's area to LMR's area, which uses the INVERSE scale factor squared: (RP/MR)² = (14/8)² = (7/4)² = 49/16.", "Step 5: Calculate the area of triangle PQR: Area(PQR) = Area(LMR) × (49/16) = 36 × 49/16.", "Step 6: Calculate: 36 × 49 = 1,764. Then 1,764 ÷ 16 = 110.25, which as a fraction is 441/4.", "Step 7: This matches choice D."], "trap": "Choice B (144/7) is the most commonly picked wrong answer — it results from using the scale factor directly (without squaring it) to scale the area, treating area as if it scaled linearly with side length rather than with the SQUARE of the side ratio.", "poe": [{"letter": "A", "text": "576/49 uses the scale factor squared but in the wrong direction (multiplying by (4/7)² instead of (7/4)²), which would shrink the area instead of growing it — but since PQR is the larger triangle, its area should be BIGGER than LMR's 36, not smaller."}, {"letter": "B", "text": "144/7 comes from using the LINEAR scale factor (14/8 = 7/4) directly to scale the area, without squaring it — but area scales with the SQUARE of the linear ratio, not the ratio itself."}, {"letter": "C", "text": "63 doesn't correspond to a clean derivation using the correct squared ratio — likely from an intermediate arithmetic error."}], "desmos": ["Step 1: Open Desmos and calculate the scale factor: type 14/8 — this confirms the ratio is 7/4 (comparing RP to MR).", "Step 2: Square this ratio: type (14/8)^2 — this confirms 49/16.", "Step 3: Calculate the area of triangle PQR: type 36*(49/16)", "Step 4: Press Enter — Desmos will evaluate this to 110.25 (which equals 441/4), confirming your answer and matching choice D."]}, {"gi": 27, "domain": "Lines, angles, and triangles", "num": 11, "diff": "Hard", "gridin": false, "correct": "B", "rule": "To prove two triangles SIMILAR, you need either two pairs of equal corresponding angles (AA), or two pairs of sides in the same ratio WITH the included angle equal (SAS similarity). A single given angle plus a ratio between two NON-adjacent sides (where the angle isn't included between them) creates an ambiguous SSA situation, which is generally NOT sufficient.", "tip": "For each additional piece of information offered, ask: 'Does this give me a second matching angle (completing AA), or does it give me a matching side ratio where the ALREADY-KNOWN equal angle sits between the two compared sides (completing SAS)?' If neither applies, the information likely isn't sufficient.", "why": "Option I (angle A = angle F) combines with the given angle B = angle G to provide two pairs of equal angles — sufficient for AA similarity. Option II (angle C = angle H) similarly combines with the given angle B = angle G for AA similarity — also sufficient. Option III (FH = 3×AC) compares sides FH and AC, which are NOT both adjacent to the given angle B/G (AC is opposite angle B, not adjacent to it) — this creates an ambiguous SSA situation, NOT sufficient for similarity.", "steps": ["Step 1: Note the given information: angle B = angle G = 51°, AB = 6, FG = 18 (giving a ratio AB/FG = 1/3).", "Step 2: Evaluate option I (angle A = angle F): combined with the already-given angle B = angle G, this establishes TWO pairs of equal angles — sufficient for AA similarity.", "Step 3: Evaluate option II (angle C = angle H): similarly combines with angle B = angle G for a second angle pair — also sufficient for AA similarity.", "Step 4: Evaluate option III (FH = 3×AC): check whether angle B (the given equal angle) is INCLUDED between the sides being compared. Side AC is OPPOSITE angle B in triangle ABC (not adjacent to it) — so this is an SSA setup (side-side-angle where the angle isn't between the two sides), which does NOT reliably prove similarity.", "Step 5: Conclude: I is sufficient, II is sufficient, but III is not — matching choice B."], "trap": "Choice A is the most commonly picked wrong answer — it assumes all three options work equally well, without checking that option III's side comparison doesn't actually involve the included angle needed for a valid similarity proof.", "poe": [{"letter": "A", "text": "This incorrectly includes III as sufficient — but III sets up an ambiguous SSA situation (the given angle B isn't between the compared sides AC and FH), which doesn't guarantee similarity."}, {"letter": "C", "text": "This incorrectly excludes I — but I (angle A = angle F) combines validly with the given angle B = angle G for AA similarity, so I IS sufficient, contradicting this choice."}, {"letter": "D", "text": "This incorrectly claims III is sufficient while excluding both I and II — but I and II both provide valid AA similarity setups, making this choice's assessment backwards."}], "desmos": ["This is a conceptual proof-based question about similarity criteria (AA vs. ambiguous SSA), which doesn't involve numerical calculation in Desmos. The key insight — that a side ratio only helps prove similarity when the known equal angle is INCLUDED between the two compared sides — is a fundamental distinction in geometry to understand and check carefully for each option."]}, {"gi": 28, "domain": "Lines, angles, and triangles", "num": 12, "diff": "Hard", "gridin": false, "correct": "D", "rule": "To prove two triangles CONGRUENT (not just similar), you need a complete congruence criterion: SSS (three sides), SAS (two sides + included angle), ASA (two angles + included side), or AAS (two angles + a non-included side). A single side-pair equality or a single extra angle alone is generally NOT enough — you need to carefully count exactly what's established before and after each additional piece of information.", "tip": "When evaluating whether a piece of information is 'sufficient by itself,' explicitly list out everything you ALREADY know for certain (from the figure's given facts, like vertical angles or a stated perpendicularity) before adding the new piece — then check if the total matches a complete congruence criterion (SSS, SAS, ASA, or AAS).", "why": "We already know angle BAC = 90° (from AD⊥ℓ at A) and angle ACB = angle DCE (vertical angles, always true regardless of any additional info). Statement I alone (AD⊥m at D) adds a second angle equality (angle EDC = 90°), giving us TWO angle pairs equal (AA) — but AA alone proves only SIMILARITY, not congruence, since no side length is established. Statement II alone (AC = DC = 13) adds one side equality — combined with the always-true vertical angles, this gives only one side + one angle (not a complete criterion). Since NEITHER I nor II alone completes a full congruence criterion, neither is sufficient by itself.", "steps": ["Step 1: Identify what's already established from the figure regardless of any additional information: angle BAC = 90° (since AD⊥ℓ at A is given), and angle ACB = angle DCE (vertical angles at point C, always true).", "Step 2: Evaluate statement I alone (AD⊥m at D): this adds angle EDC = 90°. Combined with what we already know, we now have TWO pairs of equal angles (angle BAC = angle EDC = 90°, and angle ACB = angle DCE). This is AA, which proves the triangles are SIMILAR, but similarity alone does NOT prove congruence (the triangles could be different sizes) — I alone is NOT sufficient for congruence.", "Step 3: Evaluate statement II alone (AC = DC = 13): this adds one side equality. Combined with the always-true vertical angle equality, we have only ONE side pair and ONE angle pair equal — this is not a complete congruence criterion (we'd need either a second side for SAS or a second angle for ASA) — II alone is NOT sufficient.", "Step 4: Since neither I nor II alone provides a complete congruence criterion, the correct answer is that neither is sufficient by itself.", "Step 5: This matches choice D."], "trap": "Choice A is the most commonly picked wrong answer — it assumes that establishing two equal angles (from statement I) is enough to prove congruence, without recognizing that AA only proves SIMILARITY (matching shape), not congruence (matching size) — a common and important distinction in geometry.", "poe": [{"letter": "A", "text": "Statement I alone only establishes AA (two equal angle pairs), which proves the triangles are similar in SHAPE but says nothing about whether they're the same SIZE — congruence additionally requires at least one matching side length, which I doesn't provide."}, {"letter": "B", "text": "Statement II alone only establishes one side pair (AC=DC) plus the always-true vertical angle — this is insufficient on its own; a complete criterion like SAS needs TWO sides and the included angle, or ASA needs two angles and the included side."}, {"letter": "C", "text": "This claims both I and II are independently sufficient — but as shown, I alone only proves similarity (not congruence), and II alone only provides one side and one angle (not a complete criterion) — neither works alone."}], "desmos": ["This is a conceptual proof-based question about the difference between similarity (AA) and congruence (SSS, SAS, ASA, AAS) criteria, which doesn't involve numerical calculation in Desmos. The key insight — that matching angles alone (AA) proves shapes are similar but NOT necessarily the same size — is a fundamental distinction to understand rather than calculate."]}, {"gi": 29, "domain": "Lines, angles, and triangles", "num": 13, "diff": "Hard", "gridin": false, "correct": "B", "rule": "When a line parallel to one side of a triangle crosses the other two sides, it creates a SMALLER triangle similar to the original (Triangle Proportionality / Basic Proportionality Theorem) — the ratio of corresponding sides in the smaller triangle to the original equals the ratio of the distances along the sides from the shared vertex.", "tip": "When a figure has a diagonal crossing a parallel-line 'crossbar' at a single point, treat it as creating TWO separate pairs of similar triangles (one on each side of the crossbar) — work out the proportional ratio from ONE triangle pair first, then apply that SAME ratio (since it's determined by the SAME intersection point) to the other triangle pair.", "why": "Since EF ∥ CD (confirmed by matching angle markers), triangle AEF is similar to triangle ACD, giving AF/AD = EF/CD = 0.5 — meaning F is the midpoint of AD. Since FG is part of the same straight horizontal line as EF, FG ∥ AB too, making triangle DFG similar to triangle DAB, giving FG/AB = DF/DA. Since F is the midpoint of AD (DF/DA = 0.5, from the same ratio found above), this means FG/AB = 0.5, so FG = 0.5×AB — confirming statement II. Checking statement I: AB = 2×FG = 2×2.25CD = 4.5CD, but 2.25×EF = 2.25×0.5CD = 1.125CD, which does NOT equal 4.5CD — so I is false. Checking statement III: EF/FG = 0.5CD/2.25CD = 2/9, but AF/FD = 1 (since F is the midpoint, AF=FD) — these don't match, so III is false.", "steps": ["Step 1: Confirm EF ∥ CD using the matching x° angle markers at A and E (corresponding angles equal implies parallel lines).", "Step 2: Since EF ∥ CD, triangle AEF is similar to triangle ACD (by AA). This gives the proportion: AF/AD = EF/CD.", "Step 3: Substitute the given EF = 0.5×CD: AF/AD = 0.5. This means F is exactly the MIDPOINT of segment AD.", "Step 4: Since E, F, and G lie on the same straight horizontal line (given as segment EG), and EF is horizontal (parallel to CD, hence parallel to AB too, since AB and CD are both parts of the parallel lines ℓ and j), the continuation FG is ALSO horizontal, making FG ∥ AB.", "Step 5: Since FG ∥ AB, triangle DFG is similar to triangle DAB (by AA). This gives the proportion: FG/AB = DF/DA.", "Step 6: Since F is the midpoint of AD (from Step 3), DF/DA = 0.5 as well (DF = FA, both are half of AD).", "Step 7: Substitute into the proportion: FG/AB = 0.5, which means FG = 0.5 × AB — this confirms statement II is TRUE.", "Step 8: Check statement I: from Step 7, AB = 2 × FG = 2 × 2.25CD = 4.5CD. Compare to 2.25 × EF = 2.25 × 0.5CD = 1.125CD. Since 4.5CD ≠ 1.125CD, statement I is FALSE.", "Step 9: Check statement III: EF/FG = 0.5CD/2.25CD = 2/9. But AF/FD = 1 (since F is the exact midpoint, AF and FD are equal). Since 2/9 ≠ 1, statement III is FALSE.", "Step 10: Only statement II is true, matching choice B."], "trap": "Choice D (II and III) is the most commonly picked wrong answer — it correctly identifies II as true but incorrectly assumes III's ratio comparison (EF/FG = AF/FD) also holds, without checking that AF/FD is actually 1 (since F is the midpoint), which doesn't match EF/FG's value of 2/9.", "poe": [{"letter": "A", "text": "This includes I as true, but AB (calculated as 4.5CD from the valid FG relationship) does not equal 2.25×EF (which equals 1.125CD) — these values don't match, making I false."}, {"letter": "C", "text": "This includes both I and II as true, but as shown, I is false (AB ≠ 2.25EF based on the correctly derived relationships)."}, {"letter": "D", "text": "This includes III as true, but EF/FG (=2/9) does not equal AF/FD (=1, since F is the midpoint of AD) — these ratios don't match, making III false."}], "desmos": ["Step 1: Since this problem involves proportional relationships with an unknown base length, pick a simple test value for CD — let's use CD = 4. Step 2: Open Desmos and calculate EF and FG using the given ratios: type 0.5*4 (for EF) — this gives 2. Type 2.25*4 (for FG) — this gives 9.", "Step 3: Using the derived relationship FG=0.5×AB, calculate AB: type 9/0.5 — this gives 18.", "Step 4: Check statement I (AB=2.25×EF): type 2.25*2 — this gives 4.5, which does NOT match AB=18, confirming I is false.", "Step 5: Check statement II (FG=0.5×AB): type 0.5*18 — this gives 9, which DOES match FG=9, confirming II is true.", "Step 6: Check statement III (EF/FG=AF/FD): type 2/9 — this gives approximately 0.222, but since F is the midpoint of AD, AF/FD should equal 1 — these don't match, confirming III is false."]}, {"gi": 30, "domain": "Lines, angles, and triangles", "num": 14, "diff": "Hard", "gridin": true, "correct": "54", "rule": "In an isosceles triangle, the line from the apex through the midpoint of any segment parallel to the base is the AXIS OF SYMMETRY — it bisects the base, is perpendicular to it, and bisects the apex angle. Combined with additional given conditions (like specific angle measures or length equalities), you can set up coordinate geometry or trigonometric relationships to solve for unknown lengths.", "tip": "For complex, multi-part geometry problems like this one, setting up COORDINATES (placing key points at convenient locations like the origin) often makes the relationships much easier to track than trying to reason with angles and lengths alone — especially when a right angle or clear symmetry axis is present.", "why": "Using the given angle OAC=30° and AO=BO together with the triangle's symmetry (since AB=BC and DE∥AC with O the midpoint of DE, BF is the axis of symmetry, F is the midpoint of AC), we can determine that triangle ABC is actually equilateral (all 60° angles), then use coordinate geometry to find that O sits at a specific height along BF such that AO=BO. This determines that E divides BC such that BE = (2/3)×BC = (2/3)×81 = 54.", "steps": ["Step 1: Recognize that since AB=BC (isosceles) and DE∥AC with O as the midpoint of DE, the line BF (through B and O) is the AXIS OF SYMMETRY of the triangle — meaning F is the midpoint of AC, and BF is perpendicular to AC.", "Step 2: Set up coordinates for convenience: place F at the origin (0,0), A at (−40.5, 0), C at (40.5, 0) — using half of AB's eventual determined relationship — and B directly above F.", "Step 3: Using the given angle OAC=30° and the condition AO=BO, work through the triangle's angle relationships: since BF⊥AC and bisects angle B, and using the isosceles triangle's base angles, algebraic substitution shows that angle BAC = angle BCA = 60°, meaning triangle ABC is actually EQUILATERAL (since AB=BC=81 and the apex angle also works out to 60°, forcing AC=81 too).", "Step 4: With the equilateral triangle established, place coordinates: A=(−40.5,0), C=(40.5,0), B=(0, 40.5√3) (using the height of an equilateral triangle with side 81).", "Step 5: Find O's exact position along BF (the y-axis) using the condition AO=BO: setting O=(0,h), solve √(40.5²+h²) = 40.5√3−h, which gives h = 13.5√3 after algebraic simplification.", "Step 6: Find point E on segment BC where the horizontal line through O (at height h=13.5√3) intersects BC: parametrizing BC from B(0,40.5√3) to C(40.5,0), solving for the parameter where y=13.5√3 gives a parameter value of 2/3 (measuring from B toward C).", "Step 7: Calculate BE using this parameter: BE = (2/3) × BC = (2/3) × 81 = 54.", "Step 8: This is a grid-in question — enter 54 as your final answer."], "trap": "This problem is complex enough that the most common error is simply making an early mistake in establishing that the triangle is equilateral (from the 30° angle and AO=BO condition) — without correctly identifying this key fact, the rest of the coordinate-based solution becomes very difficult to complete accurately.", "poe": [], "desmos": ["Step 1: Open Desmos and set up the coordinate points based on the equilateral triangle determination: A=(-40.5,0), B=(0,40.5*sqrt(3)), C=(40.5,0)", "Step 2: Plot point O using the height found: type (0,13.5*sqrt(3)) to place O.", "Step 3: Verify AO=BO by calculating both distances: type sqrt((-40.5-0)^2+(0-13.5*sqrt(3))^2) for AO, and type sqrt((0-0)^2+(40.5*sqrt(3)-13.5*sqrt(3))^2) for BO — both should evaluate to the same value, confirming O's position is correct.", "Step 4: Find E by determining where the horizontal line through O crosses segment BC — you can graph the line y=13.5*sqrt(3) and the line segment BC (typing the equation of line BC) and find their intersection point using Desmos's intersection feature.", "Step 5: Once you have E's coordinates, calculate the distance from B to E using the distance formula, or use the parameter ratio (2/3) directly: type (2/3)*81 — this confirms BE=54.", "Right triangles and trigonometry", "9 questions  ·  Easy 1  /  Medium 1  /  Hard 7"]}, {"gi": 31, "domain": "Right triangles and trigonometry", "num": 1, "diff": "Easy", "gridin": false, "correct": "C", "rule": "The Pythagorean theorem applies to EVERY right triangle: the square of the hypotenuse (the side opposite the right angle) equals the sum of the squares of the two legs. Written as a formula: leg1² + leg2² = hypotenuse².", "tip": "Always identify the hypotenuse FIRST (it's the side directly across from the right-angle marker, and it's always the LONGEST side) before setting up the Pythagorean theorem — mixing up which side is the hypotenuse is the most common setup error.", "why": "The right-angle marker is at the bottom-right corner, meaning side c (the slanted side connecting the two other vertices) is the hypotenuse. Applying the Pythagorean theorem with legs 12 and 3: 12² + 3² = c².", "steps": ["Step 1: Identify the right angle's location in the figure: it's marked at the bottom-right vertex.", "Step 2: Identify the hypotenuse: it's the side OPPOSITE the right angle, which is side c (the slanted/diagonal side).", "Step 3: Identify the two legs: the horizontal side (12) and the vertical side (3).", "Step 4: Apply the Pythagorean theorem: leg² + leg² = hypotenuse², giving 12² + 3² = c².", "Step 5: This matches choice C."], "trap": "Choice D (12² − 3² = c²) is the most commonly picked wrong answer — it uses subtraction instead of addition, which would be relevant if you were solving for a LEG when given the hypotenuse and the other leg, not for the hypotenuse itself as this problem asks.", "poe": [{"letter": "A", "text": "12 · 3 = c represents multiplying the two legs together, which would give you AREA-related information (specifically twice the area), not the hypotenuse length via the Pythagorean relationship."}, {"letter": "B", "text": "12 + 3 = c would only be true for a degenerate 'triangle' where the two legs lie in a straight line — this doesn't apply to an actual right triangle with a genuine right angle."}, {"letter": "D", "text": "12² − 3² = c² uses subtraction, which is the correct operation when solving for a LEG (missing side) given the hypotenuse and one leg — but here we're solving for the hypotenuse itself, which requires ADDING the leg squares."}], "desmos": ["Step 1: Open Desmos and calculate c directly using the Pythagorean theorem: type sqrt(12^2+3^2)", "Step 2: Press Enter — Desmos will evaluate this to approximately 12.37, confirming the numeric length of c (though the question only asks for the EQUATION relating the sides, which is 12²+3²=c², matching choice C, not a specific numeric value)."]}, {"gi": 32, "domain": "Right triangles and trigonometry", "num": 2, "diff": "Medium", "gridin": false, "correct": "C", "rule": "When two segments are PARALLEL and cut by a transversal, they create equal CORRESPONDING angles — allowing you to transfer trigonometric ratios from one triangle to a larger, similar triangle. Combined with the Pythagorean theorem to find any missing side, you can then set up the correct tangent ratio.", "tip": "When you spot a parallel segment inside a larger right triangle (like BC ∥ DE here), immediately recognize that the angle formed at the parallel segment corresponds to an angle in the BIG triangle — this lets you find missing side lengths using the (usually simpler) big triangle instead.", "why": "Since BC ∥ DE, angle BCA corresponds to angle DEA (corresponding angles with transversal AE) — meaning x° = angle AED. In right triangle ADE (right angle at D), we know the hypotenuse AE = 245 and one leg DE = 147. Using the Pythagorean theorem: AD = √(245² − 147²) = √(60,025 − 21,609) = √38,416 = 196. Now, tan(angle AED) = opposite/adjacent = AD/DE = 196/147.", "steps": ["Step 1: Recognize that since BC ∥ DE, the angle x° (angle BCA) corresponds to angle DEA (angle AED in the larger triangle) — corresponding angles are equal when lines are parallel.", "Step 2: Focus on the larger right triangle ADE (right angle at D), which has hypotenuse AE = 245 and leg DE = 147.", "Step 3: Find the missing leg AD using the Pythagorean theorem: AD² = AE² − DE² = 245² − 147².", "Step 4: Calculate: 245² = 60,025, and 147² = 21,609. So AD² = 60,025 − 21,609 = 38,416.", "Step 5: Take the square root: AD = √38,416 = 196.", "Step 6: Set up the tangent ratio for angle AED (which equals x°): tan(x°) = opposite/adjacent = AD/DE = 196/147.", "Step 7: This matches choice C."], "trap": "Choice D (245/147) is the most commonly picked wrong answer — it uses the hypotenuse (245) directly instead of first calculating the correct opposite-side leg (AD=196) via the Pythagorean theorem, incorrectly treating AE as if it were a leg of the right triangle relevant to the tangent ratio.", "poe": [{"letter": "A", "text": "147/196 has the correct numbers but flips the ratio (adjacent/opposite instead of opposite/adjacent) — this would actually be the COTANGENT of x°, not the tangent."}, {"letter": "B", "text": "147/245 uses DE and AE directly, but tangent requires the two LEGS of the right triangle (opposite and adjacent), not a leg and the hypotenuse — this ratio would actually relate to sine or cosine, not tangent."}, {"letter": "D", "text": "245/147 uses the hypotenuse (245) directly without first finding the correct opposite leg (AD=196) — mixing up which sides belong in a tangent ratio."}], "desmos": ["Step 1: Open Desmos and calculate the missing leg AD using the Pythagorean theorem: type sqrt(245^2-147^2)", "Step 2: Press Enter — Desmos will evaluate this to 196, confirming AD.", "Step 3: Calculate the tangent ratio directly: type 196/147", "Step 4: Press Enter — Desmos will show this as a decimal (approximately 1.333), and you can compare it to each answer choice's decimal value to confirm 196/147 (choice C) matches."]}, {"gi": 33, "domain": "Right triangles and trigonometry", "num": 3, "diff": "Hard", "gridin": true, "correct": "38", "rule": "In a rectangle, the diagonal splits it into two right triangles, so the Pythagorean theorem applies: (one side)² + (adjacent side)² = (diagonal)². When one side is described in terms of the other (like 'PS is 8 more than RS'), set up variables and substitute to create a solvable equation.", "tip": "When a problem describes one rectangle's side in terms of another ('X more than'), let a single variable represent the unknown you're solving for, express the OTHER side in terms of that same variable, then apply the Pythagorean theorem to get one equation with one unknown.", "why": "Let QR = x (what we want to find). Since QR and PS are opposite sides of the rectangle, PS = QR = x as well... but we're told PS is 8 more than RS, so RS = x − 8 (since RS is the side adjacent to QR, and QR = SP in a rectangle's opposite-side structure). Using the diagonal relationship QS² = QR² + RS²: 2,344 = x² + (x−8)². Expanding and solving this quadratic gives x = 38.", "steps": ["Step 1: Let QR = x (the length we want to find).", "Step 2: Since QR and PS are opposite sides of rectangle PQRS, they are equal: PS = QR = x.", "Step 3: We're told PS is 8 more than RS, so RS = PS − 8 = x − 8.", "Step 4: The diagonal QS connects Q and S, forming a right triangle with legs QR and RS: QS² = QR² + RS².", "Step 5: Substitute the known values: 2,344 = x² + (x−8)².", "Step 6: Expand (x−8)²: x² − 16x + 64. The equation becomes: 2,344 = x² + x² − 16x + 64.", "Step 7: Combine like terms: 2,344 = 2x² − 16x + 64.", "Step 8: Move everything to one side: 2x² − 16x + 64 − 2,344 = 0, which simplifies to 2x² − 16x − 2,280 = 0.", "Step 9: Divide the entire equation by 2: x² − 8x − 1,140 = 0.", "Step 10: Solve using the quadratic formula: x = [8 ± √(64 + 4,560)] / 2 = [8 ± √4,624] / 2 = [8 ± 68] / 2.", "Step 11: Taking the positive root (since a length can't be negative): x = (8+68)/2 = 76/2 = 38.", "Step 12: This is a grid-in question — enter 38 as your final answer."], "trap": "A common error on this problem is mixing up which side (QR or RS) is described as '8 more than' the other, or incorrectly assuming QR and RS are the two DIFFERENT variables directly, without correctly using the rectangle's opposite-side-equality (QR=PS) to set up the relationship properly.", "poe": [], "desmos": ["Step 1: Open Desmos and set up the equation directly: type x^2+(x-8)^2=2344", "Step 2: Press Enter — since this is a one-variable equation, Desmos will solve it and plot the solution(s) as labeled points.", "Step 3: Look for the POSITIVE solution (since a rectangle's side length must be positive) — it should show x = 38.", "Step 4: Enter 38 into the grid-in answer box. (As a check, you can also verify: 38² + 30² = 1444+900 = 2344, confirming this matches the given diagonal length squared.)"]}, {"gi": 34, "domain": "Right triangles and trigonometry", "num": 4, "diff": "Hard", "gridin": true, "correct": "6.5", "rule": "When an altitude is drawn from the right angle of a right triangle down to the hypotenuse, it creates a special GEOMETRIC MEAN relationship: the altitude's length squared equals the product of the two segments it divides the hypotenuse into. Formula: (altitude)² = (segment 1) × (segment 2).", "tip": "Whenever you see a right triangle with a SECOND right angle formed by an altitude dropped to the hypotenuse (creating two smaller right triangles inside), immediately think 'geometric mean relationship' — this often provides a much faster path to the answer than working through multiple separate triangle equations.", "why": "Since angle BAC = 90° and AD⊥BC (right angle at D), AD is the altitude from the right angle to the hypotenuse BC, creating the geometric mean relationship AD² = BD × DC. We're given tan(angle CAD) = 1.3, and in right triangle ACD (right angle at D), this means DC/AD = 1.3, so DC = 1.3 × AD. Substituting into the geometric mean formula: AD² = 5 × (1.3 × AD) = 6.5 × AD. Dividing both sides by AD: AD = 6.5.", "steps": ["Step 1: Identify the key structure: angle BAC = 90° (right angle at A) and AD⊥BC (right angle at D) means AD is the altitude from the right angle to the hypotenuse in right triangle ABC.", "Step 2: Recall the geometric mean relationship for this configuration: AD² = BD × DC.", "Step 3: Use the given tangent value to find DC in terms of AD: in right triangle ACD (right angle at D), tan(angle CAD) = opposite/adjacent = DC/AD. Given tan(CAD) = 1.3, this means DC = 1.3 × AD.", "Step 4: Substitute BD = 5 (given) and DC = 1.3 × AD into the geometric mean formula: AD² = 5 × (1.3 × AD).", "Step 5: Simplify the right side: AD² = 6.5 × AD.", "Step 6: Divide both sides by AD (valid since AD ≠ 0): AD = 6.5.", "Step 7: This is a grid-in question — enter 6.5 as your final answer."], "trap": "A common error on this problem is not recognizing the geometric mean relationship at all, and instead trying to set up multiple separate trigonometric equations across both smaller triangles without a clear connecting strategy — the geometric mean shortcut avoids this complexity entirely.", "poe": [], "desmos": ["Step 1: Open Desmos and set up the relationship you derived: AD² = 5 × (1.3 × AD). Type this as an equation using x for AD: x^2=5*1.3*x", "Step 2: Press Enter — Desmos will solve this one-variable equation and plot the solution(s).", "Step 3: Look for the positive, non-zero solution — it should show x = 6.5.", "Step 4: Enter 6.5 into the grid-in answer box."]}, {"gi": 35, "domain": "Right triangles and trigonometry", "num": 5, "diff": "Hard", "gridin": false, "correct": "C", "rule": "In any equilateral triangle, the height relates to the side length through the specific ratio: height = (side length) × (√3)/2. This comes from splitting the equilateral triangle into two 30-60-90 right triangles using the altitude.", "tip": "Memorize the equilateral triangle height formula (height = side × √3/2) as a direct shortcut — when a problem gives you the height and asks for the side (or perimeter), just rearrange this formula to solve for the side directly, avoiding a full 30-60-90 triangle setup each time.", "why": "Using the formula height = side × (√3/2), and solving for side: side = height ÷ (√3/2) = height × (2/√3). Substituting the given height of 39√3: side = 39√3 × 2/√3 = 39×2 = 78 (the √3 terms cancel out). Since the perimeter of an equilateral triangle is 3 × side: perimeter = 3 × 78 = 234.", "steps": ["Step 1: Recall the equilateral triangle height formula: height = side × (√3/2).", "Step 2: Rearrange to solve for side: side = height ÷ (√3/2) = height × (2/√3).", "Step 3: Substitute the given height: side = 39√3 × (2/√3).", "Step 4: Notice the √3 in the numerator and denominator cancel out: side = 39 × 2 = 78.", "Step 5: Calculate the perimeter using the formula perimeter = 3 × side: perimeter = 3 × 78 = 234.", "Step 6: This matches choice C."], "trap": "Choice B (117√3) is the most commonly picked wrong answer — it results from forgetting to cancel the √3 terms correctly, perhaps by multiplying the height directly by 3 (39√3 × 3 = 117√3) instead of first solving for the side length and THEN multiplying by 3.", "poe": [{"letter": "A", "text": "117 comes from 39×3=117, treating the given height as if it were directly the side length (ignoring the √3 and the height formula entirely) — this skips the necessary conversion step."}, {"letter": "B", "text": "117√3 results from multiplying the given height (39√3) directly by 3 (for perimeter) without first solving for the actual side length — this conflates the height with the side length."}, {"letter": "D", "text": "1,521√3 likely results from squaring some value incorrectly or a significant misapplication of the height formula — this doesn't correspond to a clean derivation."}], "desmos": ["Step 1: Open Desmos and solve for the side length directly using the rearranged formula: type 39*sqrt(3)*2/sqrt(3)", "Step 2: Press Enter — Desmos will simplify this and evaluate to 78, confirming the side length.", "Step 3: Calculate the perimeter: type 78*3", "Step 4: Press Enter — Desmos will evaluate this to 234, confirming the perimeter and matching choice C."]}, {"gi": 36, "domain": "Right triangles and trigonometry", "num": 6, "diff": "Hard", "gridin": false, "correct": "D", "rule": "For any two ACUTE angles in a right triangle (or any two angles that are complementary, summing to 90°), sine of one angle always equals cosine of the other: sin(θ) = cos(90° − θ). This is called the 'cofunction identity.' If sin(p) = cos(t), this means p and t are complementary angles: p + t = 90° (in radians, p + t = π/2).", "tip": "Whenever a problem states 'sin of one angle equals cos of another,' immediately translate this into 'these two angles are complementary' (they add up to 90°, or π/2 radians) — this is a direct shortcut that avoids needing to work with the trig functions themselves.", "why": "Since sin(p) = cos(t), angles P and T are complementary, meaning p + t = π/2 (in radians). Solving for p: p = π/2 − t. Now substitute x = 0 into the function g(x) = p(8)^x + 6t: g(0) = p(8)^0 + 6t = p(1) + 6t = p + 6t (since anything to the power of 0 equals 1). Substitute p = π/2 − t: g(0) = (π/2 − t) + 6t = π/2 + 5t, which can be rewritten as 5t + π/2.", "steps": ["Step 1: Use the given relationship sin(p) = cos(t) to establish that angles P and T are complementary: p + t = π/2 (since this cofunction identity holds specifically for complementary angles, measured in radians here since p and t are defined in radians).", "Step 2: Solve this relationship for p: p = π/2 − t.", "Step 3: Evaluate the function g(x) = p(8)^x + 6t at x = 0: g(0) = p(8)^0 + 6t.", "Step 4: Simplify using the zero exponent rule: (8)^0 = 1, so g(0) = p(1) + 6t = p + 6t.", "Step 5: Substitute the expression for p from Step 2: g(0) = (π/2 − t) + 6t.", "Step 6: Combine like terms: −t + 6t = 5t, so g(0) = π/2 + 5t, which can be written as 5t + π/2.", "Step 7: This matches choice D."], "trap": "Choice C (5t + π) is the most commonly picked wrong answer — it correctly combines the t-terms to get 5t, but uses π instead of π/2 for the constant term, likely from forgetting that complementary angles sum to π/2 (90°) specifically, not a full π (180°).", "poe": [{"letter": "A", "text": "6t + π incorrectly keeps the original 6t coefficient (forgetting to subtract t after substituting p = π/2 − t) and uses the wrong constant (π instead of π/2)."}, {"letter": "B", "text": "6t keeps the original coefficient without substituting for p at all, and drops the constant term entirely — this skips the substitution step."}, {"letter": "C", "text": "5t + π correctly combines the t-terms but uses the wrong constant (π instead of π/2), likely confusing the complementary angle relationship (sum to π/2) with a supplementary one (sum to π)."}], "desmos": ["Step 1: Since this problem involves the relationship between p and t through radians, pick a simple test value for t to verify — let's use t = π/6 (30°, a common angle). Step 2: Calculate the corresponding p value using p = π/2 − t: type pi/2-pi/6 — this gives p = π/3 (60°), confirming p+t=π/2 (complementary).", "Step 3: Calculate g(0) using the original function with these values: type p*(8)^0+6*t, substituting p=pi/3 and t=pi/6: (pi/3)*1+6*(pi/6)", "Step 4: Press Enter — Desmos will evaluate this numerically; compare it to evaluating 5*t+pi/2 with the same t=pi/6: 5*(pi/6)+pi/2 — both expressions should give the SAME numeric value, confirming the formula 5t+π/2 (choice D) correctly represents g(0)."]}, {"gi": 37, "domain": "Right triangles and trigonometry", "num": 7, "diff": "Hard", "gridin": true, "correct": "12/5", "rule": "When an altitude is drawn from the right angle of a right triangle to the hypotenuse, it creates TWO smaller right triangles, each SIMILAR to the original triangle AND to each other. This means corresponding angles across all three triangles (the original and the two smaller ones) are equal.", "tip": "When you see an altitude drawn from a right angle to the hypotenuse, immediately identify which smaller triangle is similar to which — the angle in the smaller triangle 'nearest' to a specific vertex of the original triangle typically corresponds to that vertex's original angle.", "why": "Since YR⊥XZ (creating a right angle at R), triangle XYR is similar to triangle XZY (sharing angle X, both containing a right angle). This similarity means angle XYR (labeled b°) corresponds to angle XZY (labeled a°) — so b = a. Given sin(a°) = 12/13, this corresponds to a right triangle with opposite side 12, hypotenuse 13, and (by the Pythagorean theorem) adjacent side √(13²−12²) = √(169−144) = √25 = 5. So tan(a°) = 12/5. Since b = a, tan(b°) = 12/5 as well.", "steps": ["Step 1: Identify the right angle in triangle XYZ: since X and Z are both acute angles (given), the right angle must be at Y.", "Step 2: Since YR⊥XZ, this creates two smaller right triangles (XYR and YZR), each similar to the original triangle XYZ.", "Step 3: Identify the similarity: triangle XYR shares angle X with triangle XZY, and both have a right angle (at R and at Y respectively) — this makes them similar, with angle XYR corresponding to angle XZY.", "Step 4: Since angle XYR = b° and angle XZY = a°, and these are corresponding angles in similar triangles, b = a.", "Step 5: Use the given sin(a°) = 12/13 to find the full right triangle ratio: if the opposite side is 12 and the hypotenuse is 13, use the Pythagorean theorem to find the adjacent side: adjacent = √(13² − 12²) = √(169−144) = √25 = 5.", "Step 6: Calculate tan(a°) = opposite/adjacent = 12/5.", "Step 7: Since b = a, tan(b°) = tan(a°) = 12/5.", "Step 8: This is a grid-in question — enter 12/5 (or its decimal equivalent, 2.4) as your final answer."], "trap": "A common error on this problem is not recognizing that b = a (from the similar triangles relationship), and instead trying to work out angle b using unrelated information like the given side length XY=19, which is actually a distractor not needed for this particular calculation.", "poe": [], "desmos": ["Step 1: Open Desmos and verify the sine-to-tangent conversion: type asin(12/13) — this gives the angle a in radians (or you can convert to degrees).", "Step 2: Calculate the tangent of this same angle: type tan(asin(12/13))", "Step 3: Press Enter — Desmos will evaluate this to exactly 2.4, confirming tan(a°) = 12/5 = 2.4.", "Step 4: Since b = a (from the similar triangles relationship established in the solution), this same value (12/5 or 2.4) is your answer for tan(b°) as well."]}, {"gi": 38, "domain": "Right triangles and trigonometry", "num": 8, "diff": "Hard", "gridin": true, "correct": "36", "rule": "The Pythagorean theorem applies to every right triangle: (leg 1)² + (leg 2)² = (hypotenuse)². When given the hypotenuse and one leg, rearrange the formula to solve for the missing leg by SUBTRACTING (not adding) the known leg's square from the hypotenuse's square.", "tip": "When solving for a MISSING LEG (not  but has an altitude already drawn to one side (shown by a right-angle marker), use the RIGHT triangle that altitude creates to find the height via sine — SOH-CAH-TOA (specifically 'SOH': sine = opposite/hypotenuse) directly gives you the height using a known angle and the side length (hypotenuse) adjacent to that angle.", "why": "The altitude from Z creates a right triangle with the given angle X=54° and hypotenuse XZ=19. Using sine: height (ZW) = XZ × sin(X) = 19 × sin(54°). The base of the original triangle is XY = 26. Using the area formula: Area = (1/2) × base × height = (1/2) × 26 × 19sin(54°) = 13 × 19sin(54°) = 247sin(54°).", "steps": ["Step 1: Identify the altitude drawn from vertex Z down to side XY, creating a right angle at the foot of the altitude (let's call this point W).", "Step 2: In the right triangle formed (X, W, Z), the angle at X is given as 54°, and the hypotenuse of this small right triangle is XZ = 19.", "Step 3: Use the sine ratio to find the height ZW: sin(X) = opposite/hypotenuse = ZW/XZ, so ZW = XZ × sin(X) = 19 × sin(54°).", "Step 4: Identify the base of the ORIGINAL triangle XYZ: this is side XY = 26.", "Step 5: Apply the triangle area formula: Area = (1/2) × base × height = (1/2) × 26 × 19sin(54°).", "Step 6: Simplify: (1/2) × 26 = 13, so Area = 13 × 19sin(54°) = 247sin(54°).", "Step 7: This matches choice C."], "trap": "Choice A (247) is the most commonly picked wrong answer — it correctly calculates 13 × 19 = 247 but completely forgets to multiply by sin(54°), essentially treating XZ as if it were already the height (perpendicular to XY) rather than the hypotenuse of the smaller right triangle that needs the sine ratio applied.", "poe": [{"letter": "A", "text": "247 forgets the sin(54°) factor entirely — this would only be correct if XZ were already perpendicular to XY (which it's not; XZ is a slanted side, and its full length isn't the height)."}, {"letter": "B", "text": "494 is double 247 (forgetting to apply the 1/2 factor in the
