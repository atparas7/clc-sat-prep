).", "poe": [{"letter": "B", "text": "−306 is exactly half of the correct total — this often results from a computational shortcut gone wrong, such as only multiplying some terms by 6 instead of all three constants consistently."}, {"letter": "C", "text": "−102 doesn't correspond to a clean derivation from this problem — likely a distractor value or the result of multiple compounding errors."}, {"letter": "D", "text": "−17 is far too small in magnitude to result from correctly scaling by 6 — this likely comes from forgetting to multiply by 6 at all and instead just adding −200 + 100 + (−2) = −102 (close to choice C) or a similar unscaled combination."}], "desmos": ["Step 1: Open Desmos and type the original expression: y=-14(5x-2)^2+6(5x-3)^2", "Step 2: Press Enter — Desmos graphs this parabola.", "Step 3: Type your simplified expression using the target form with the constants you found: y=(-1200/6)x^2+(600/6)x+(-12/6)", "Step 4: Press Enter — if your values for a, b, and c are correct, this curve will land EXACTLY on top of the original one.", "Step 5: As a final check, type -1200+600-12 directly into Desmos — it will evaluate to −612, confirming a+b+c = −612 and matching choice A."]}, {"gi": 27, "domain": "Equivalent expressions", "num": 7, "diff": "Hard", "gridin": false, "id": "2289b199", "correct": "C", "rule": "To simplify an expression involving roots (radicals) with different index numbers (like a cube root and an eighth root), first rewrite every root as a FRACTIONAL EXPONENT (the nth root of x becomes x^(1/n)), then use standard exponent rules to combine and simplify everything into one unified expression.", "tip": "Whenever you see mixed radical types (cube roots, eighth roots, etc.) in the same expression, immediately convert ALL of them to fractional exponent notation — this turns a confusing-looking radical problem into a much more familiar exponent-simplification problem you already know how to handle.", "why": "Rewrite the original expression using fractional exponents: the numerator ∛(n^17p^5) becomes n^(17/3)p^(5/3), and the denominator's ⁸√(p^8) becomes p^(8/8) = p^1 = p. So the full expression becomes [n^(17/3)p^(5/3)] / [5n²p] = (1/5) n^(17/3−2) p^(5/3−1) = (1/5) n^(11/3) p^(2/3). Checking option I: [n^(14/3)p^(5/3)]/(5np) = (1/5)n^(14/3−1)p^(5/3−1) = (1/5)n^(11/3)p^(2/3) — matches! Checking option II: ∛(n^11p^2)/5 = (1/5)n^(11/3)p^(2/3) — also matches! Both expressions are equivalent to the original.", "steps": ["Step 1: Rewrite the numerator using fractional exponent notation: ∛(n^17p^5) = (n^17p^5)^(1/3) = n^(17/3)p^(5/3).", "Step 2: Rewrite the denominator's radical term: ⁸√(p^8) = p^(8/8) = p^1 = p (since 8 divided by 8 equals exactly 1).", "Step 3: Write the full original expression using these simplified forms: [n^(17/3)p^(5/3)] / [5n²p].", "Step 4: Simplify by subtracting exponents for matching bases (dividing powers with the same base means subtracting exponents): for n: 17/3 − 2 = 17/3 − 6/3 = 11/3. For p: 5/3 − 1 = 5/3 − 3/3 = 2/3.", "Step 5: The fully simplified original expression is: (1/5) n^(11/3) p^(2/3).", "Step 6: Check option I: [n^(14/3)p^(5/3)] / (5np). Simplify exponents: for n: 14/3 − 1 = 14/3 − 3/3 = 11/3. For p: 5/3 − 1 = 5/3 − 3/3 = 2/3. This gives (1/5)n^(11/3)p^(2/3) — an EXACT match to Step 5.", "Step 7: Check option II: ∛(n^11p^2)/5 = (n^11p^2)^(1/3)/5 = n^(11/3)p^(2/3)/5 — also an EXACT match to Step 5.", "Step 8: Since BOTH option I and option II are algebraically equivalent to the original expression, the correct answer is C: I and II."], "trap": "Choice A (I only) is the most commonly picked wrong answer — students sometimes correctly verify option I matches but assume option II (written with a cube root instead of separated exponents) must be a 'different' or 'trick' expression, without actually converting it to fractional exponent form to check.", "poe": [{"letter": "A", "text": "While option I does correctly match the original expression, option II ALSO matches when converted to fractional exponent form — dismissing option II without checking it carefully is the error here."}, {"letter": "B", "text": "While option II does correctly match, option I ALSO matches — both are valid equivalent forms of the same original expression, so 'II only' incorrectly excludes a correct option."}, {"letter": "D", "text": "Since BOTH option I and option II simplify to the exact same expression as the original (as shown in Steps 6–7), 'Neither I nor II' is incorrect — both options are actually valid."}], "desmos": ["Step 1: Since this involves variables n and p in exponents, pick simple positive test values to verify — let's use n = 8 and p = 4 (chosen because they're powers of 2, which often simplify nicely with fractional exponents). Step 2: Open Desmos and type the original expression with these values: (8^(17/3)*4^(5/3))/(5*8^2*(4^(8/8)))", "Step 3: Press Enter — Desmos will evaluate this to a specific decimal number.", "Step 4: Type option I with the same values: (8^(14/3)*4^(5/3))/(5*8*4)", "Step 5: Press Enter — compare this result to Step 3's result; they should be IDENTICAL, confirming option I matches.", "Step 6: Type option II with the same values: (8^11*4^2)^(1/3)/5", "Step 7: Press Enter — compare this to Step 3's result as well; it should ALSO be identical, confirming option II matches too, verifying choice C (I and II) is correct."]}];
  var PDANALYSIS_QUESTIONS = [{"gi": 1, "domain": "Ratios, rates, proportional relationships, and units", "num": 1, "diff": "Easy", "gridin": false, "id": "de799680", "correct": "C", "rule": "Unit conversion problems always use the given conversion factor as a multiplier — set it up so the unit you want to CANCEL is in the denominator and the unit you want to KEEP ends up in the numerator, then multiply straight across.", "tip": "Write the conversion factor as a fraction in two different orientations (10 mm/1 cm, or 1 cm/10 mm) and pick whichever one cancels out centimeters and leaves millimeters — this prevents accidentally dividing when you should multiply, or vice versa.", "why": "Since 1 centimeter = 10 millimeters, converting FROM centimeters TO millimeters means MULTIPLYING by 10 (going from a bigger unit to a smaller one always gives a bigger number). So 76 cm/s × 10 mm/cm = 760 mm/s.", "steps": ["Step 1: Identify the given rate: 76 centimeters per second.", "Step 2: Identify the conversion factor: 1 centimeter = 10 millimeters.", "Step 3: Since millimeters are a SMALLER unit than centimeters, converting to millimeters should give a LARGER number — this means multiplying, not dividing.", "Step 4: Multiply: 76 cm/s × 10 mm/cm = 760 mm/s (the 'cm' units cancel out, leaving 'mm').", "Step 5: This matches choice C."], "trap": "Choice D (86) is the most commonly picked wrong answer — it comes from mistakenly ADDING 10 to 76 (76 + 10 = 86) instead of correctly MULTIPLYING (76 × 10 = 760), confusing an additive shift with a multiplicative unit conversion.", "poe": [{"letter": "A", "text": "7,600 is off by a factor of 10 from the correct answer — likely from multiplying by 100 instead of 10, perhaps double-applying the conversion factor."}, {"letter": "B", "text": "836 doesn't correspond to a natural calculation from this conversion — possibly from adding an unrelated number (760 + 76 = 836) rather than performing the correct single multiplication."}, {"letter": "D", "text": "86 comes from mistakenly ADDING 10 to 76 (76 + 10 = 86) instead of correctly MULTIPLYING (76 × 10 = 760) — confusing an additive shift with a multiplicative unit conversion."}], "desmos": ["Step 1: Open Desmos and type the conversion directly as a multiplication: 76*10", "Step 2: Press Enter — Desmos will instantly evaluate this to 760, confirming the converted velocity in millimeters per second, matching choice C.", "Step 3: As a sanity check on direction, type 76/10 as well — this gives 7.6, which would be the (incorrect) result of dividing instead of multiplying; comparing both results helps confirm multiplying by 10 is the correct operation when converting from a larger unit (cm) to a smaller one (mm)."]}, {"gi": 2, "domain": "Ratios, rates, proportional relationships, and units", "num": 2, "diff": "Hard", "gridin": false, "id": "4c5ea142", "correct": "D", "rule": "For rate-conversion word problems with two different unit changes happening at once (here, converting a monthly rate to a yearly rate, AND scaling by an unknown number of years), set up the rate as a fraction and multiply by the necessary conversion factors and variables step by step, keeping careful track of what's in the numerator and denominator.", "tip": "Break multi-step unit conversions into separate, small steps rather than trying to do everything at once — first convert 'per month' to 'per year' using the fixed number 12, and only afterward multiply by the variable representing the number of years.", "why": "The plant grows 87 mm every m months, so its rate is 87/m mm per month. Converting to a yearly rate: since there are 12 months in a year, multiply by 12: (87/m) × 12 = 1044/m mm per year. For k years, multiply by k: (1044/m) × k = 1044k/m.", "steps": ["Step 1: Write the given growth rate as a fraction: 87 millimeters per m months, or 87/m mm/month.", "Step 2: Convert this monthly rate into a YEARLY rate by multiplying by 12 (since there are 12 months in one year): (87/m) × 12 = 1044/m mm per year.", "Step 3: To find the total growth over k years (not just one year), multiply this yearly rate by k: (1044/m) × k = 1044k/m.", "Step 4: This matches choice D."], "trap": "Choice C is the most commonly picked wrong answer — it correctly computes 1044 (87 × 12) but multiplies by m instead of k, and divides by k instead of m, essentially swapping the roles of the two variables in the final expression.", "poe": [{"letter": "A", "text": "29m/4k doesn't come from a clean derivation of this problem — the numbers 29 and 4 don't naturally arise from 87 and 12 in this context (87/3=29, 12/3=4, suggesting a reduction error somewhere, but the variable placement is also backwards)."}, {"letter": "B", "text": "29k/4m has the same reduction issue as choice A, with variables swapped in a way that doesn't match the correct setup."}, {"letter": "C", "text": "1,044m/k correctly computes 1,044 but swaps which variable (m or k) belongs in the numerator versus denominator — m should be in the denominator (since a larger m means slower growth per month) and k in the numerator (since more years means more total growth)."}], "desmos": ["Step 1: Since this problem has two unknown variables (m and k), pick simple test values to verify your formula — let's say m = 3 (grows 87mm every 3 months) and k = 2 (over 2 years). Step 2: Open Desmos and calculate the rate per month directly: 87/3 — this gives 29 mm per month.", "Step 3: Convert to yearly rate: type 29*12 — this gives 348 mm per year.", "Step 4: Multiply by the number of years: type 348*2 — this gives 696 mm total growth over 2 years.", "Step 5: Now test your formula 1044k/m with the same values: type 1044*2/3 — this should also give 696, confirming your formula matches the step-by-step calculation and verifying choice D."]}, {"gi": 3, "domain": "Ratios, rates, proportional relationships, and units", "num": 3, "diff": "Hard", "gridin": false, "id": "1b96c116", "correct": "A", "rule": "When converting AREA (not just length) between units, you must apply the conversion factor TWICE — once for each dimension (length and width) — meaning you divide (or multiply) by the SQUARE of the linear conversion factor, not just the factor itself.", "tip": "Never apply a linear conversion factor (like 12 inches = 1 foot) directly to an area measurement — always square the conversion factor first (12² = 144) before using it to convert square inches to square feet, since area involves two dimensions.", "why": "Since 1 foot = 12 inches, 1 square foot = 12 × 12 = 144 square inches. To convert 3,168 square inches to square feet, divide by 144: 3,168 ÷ 144 = 22.", "steps": ["Step 1: Recall the linear conversion: 1 foot = 12 inches.", "Step 2: Since area involves TWO dimensions (length × width), square the conversion factor to get the area conversion: 1 square foot = 12² = 144 square inches.", "Step 3: To convert the given area from square inches to square feet, divide by 144 (since square inches is the smaller unit, converting to the larger unit square feet requires dividing): 3,168 ÷ 144 = 22.", "Step 4: This matches choice A."], "trap": "Choice C (264) is the most commonly picked wrong answer — it results from dividing by 12 instead of 144, applying only the LINEAR conversion factor instead of correctly squaring it for an AREA conversion.", "poe": [{"letter": "B", "text": "56.3 doesn't correspond to a clean derivation from this problem — likely from an unrelated arithmetic error."}, {"letter": "C", "text": "264 comes from dividing 3,168 by 12 instead of 144 — this uses only the linear (one-dimensional) conversion factor rather than correctly squaring it for the two-dimensional area conversion."}, {"letter": "D", "text": "675.4 doesn't correspond to a clean derivation from this problem either — possibly from multiplying instead of dividing, or a different unrelated calculation error."}], "desmos": ["Step 1: Open Desmos and calculate the area conversion factor first: type 12^2 — this confirms 144 square inches equals 1 square foot.", "Step 2: On the next line, type 3168/144 — Desmos will evaluate this to 22, confirming the area in square feet.", "Step 3: As a sanity check, try the common error calculation as well: type 3168/12 — this gives 264, which is what you'd get if you forgot to square the conversion factor; comparing both results helps you see why squaring is necessary for area conversions.", "Percentages", "4 questions  ·  Easy 0  /  Medium 0  /  Hard 4"]}, {"gi": 4, "domain": "Percentages", "num": 1, "diff": "Hard", "gridin": false, "id": "28ff3966", "correct": "B", "rule": "In scale-drawing problems, the ACTUAL physical size being represented stays the same even when the drawing itself is resized — so first calculate the total actual distance represented by the original drawing, then use that same fixed actual distance to find the new scale for the resized drawing.", "tip": "Don't confuse 'the drawing got bigger' with 'the actual place got bigger' — the real-world distance being depicted stays constant; only how much space on paper represents that distance changes. Calculate the fixed real-world total first, before working with the new drawing's dimensions.", "why": "The original drawing's side is 55 inches, with each inch representing 19 actual miles, so the total actual distance across is 55 × 19 = 1,045 miles. This actual distance doesn't change when the drawing is resized. The new drawing's side length is 65% longer: 55 × 1.65 = 90.75 inches. Since this new, larger drawing still represents the same 1,045 actual miles, the new scale is 1,045 ÷ 90.75 ≈ 11.52 miles per inch.", "steps": ["Step 1: Calculate the total actual distance represented by the original drawing's side: 55 inches × 19 miles/inch = 1,045 miles.", "Step 2: Recognize that this actual distance (1,045 miles) stays the SAME even when the drawing is resized — only the drawing's size changes, not the real place it represents.", "Step 3: Calculate the new drawing's side length: the new side is 65% LONGER than the original 55 inches, so multiply by 1.65 (100% + 65% = 165%, or 1.65 as a decimal): 55 × 1.65 = 90.75 inches.", "Step 4: Since the new 90.75-inch side still represents the same 1,045 actual miles, calculate the new scale by dividing: 1,045 ÷ 90.75 ≈ 11.5152 miles per inch.", "Step 5: Rounding to match the answer choices, this is closest to 11.52, matching choice B."], "trap": "Choice C (31.35) is the most commonly picked wrong answer — it typically results from incorrectly multiplying the ORIGINAL scale (19 miles/inch) by 1.65 directly, as if the scale itself grows by 65% (19 × 1.65 ≈ 31.35), rather than recognizing that a LARGER drawing of the SAME place actually needs a SMALLER (not larger) miles-per-inch scale.", "poe": [{"letter": "A", "text": "6.65 comes from dividing 19 by something close to 1.65 backwards, or another inverted calculation — this doesn't match the correct scale-recalculation approach."}, {"letter": "C", "text": "31.35 results from multiplying the original scale (19) by 1.65, treating the SCALE itself as growing — but a bigger drawing of the same place actually needs a SMALLER scale (fewer miles per inch), not a bigger one."}, {"letter": "D", "text": "35.75 doesn't correspond to a clean derivation from this problem — likely an arithmetic slip or distractor value."}], "desmos": ["Step 1: Open Desmos and calculate the fixed actual distance first: type 55*19 — this confirms 1,045 miles is the actual distance represented by the original drawing's side.", "Step 2: Calculate the new drawing's side length: type 55*1.65 — this confirms 90.75 inches for the larger drawing.", "Step 3: Calculate the new scale by dividing the FIXED actual distance by the NEW side length: type 1045/90.75 — Desmos will evaluate this to approximately 11.5152, confirming the new scale is closest to 11.52 miles per inch, matching choice B."]}, {"gi": 5, "domain": "Percentages", "num": 2, "diff": "Hard", "gridin": false, "id": "8bb94668", "correct": "D", "rule": "When a problem describes percentages chained together across multiple variables (A is a percent of C, and C is a percent of B), convert EACH percentage into a decimal multiplier first, then use substitution to express everything in terms of a single variable.", "tip": "Convert every percentage to its decimal form immediately (5,900% becomes 59, and 0.008% becomes 0.00008) — working with percentages over 100% or under 1% in their original form is a common source of decimal-point errors; converting early keeps the rest of the algebra clean.", "why": "Since a is 5,900% of c, convert to decimal: a = 59c. Since c is 0.008% of b, convert to decimal: c = 0.00008b, which means b = c / 0.00008 = 12,500c. Adding: a + b = 59c + 12,500c = 12,559c.", "steps": ["Step 1: Convert 'a is 5,900% of c' into an equation: 5,900% as a decimal is 5900/100 = 59, so a = 59c.", "Step 2: Convert 'c is 0.008% of b' into an equation: 0.008% as a decimal is 0.008/100 = 0.00008, so c = 0.00008b.", "Step 3: Solve this second equation for b (since we need b in terms of c to add it to a): b = c / 0.00008.", "Step 4: Calculate this division: 1/0.00008 = 12,500, so b = 12,500c.", "Step 5: Now add a and b, both now expressed in terms of c: a + b = 59c + 12,500c.", "Step 6: Combine like terms: 59c + 12,500c = 12,559c.", "Step 7: This matches choice D."], "trap": "Choice A (1,840c) is the most commonly picked wrong answer — it typically results from a decimal-point error while converting 0.008% to a decimal, such as using 0.08 instead of the correct 0.00008, which throws off the entire calculation for b.", "poe": [{"letter": "A", "text": "1,840c likely results from a decimal-point misplacement while converting 0.008% — using too large a decimal value for this tiny percentage significantly changes the resulting value of b."}, {"letter": "B", "text": "5,908c doesn't correctly combine both relationships — possibly only accounting for one of the two given percentage relationships instead of both."}, {"letter": "C", "text": "6,025c also doesn't align with the correct chain of calculations — likely from a different decimal or arithmetic slip somewhere in converting one of the two percentages."}], "desmos": ["Step 1: Open Desmos and set up the relationships directly. First type: a=59c to represent 'a is 5,900% of c.'", "Step 2: Type: c=0.00008b to represent 'c is 0.008% of b.'", "Step 3: To find b in terms of c, type: b=c/0.00008 — Desmos will show this simplifies to b = 12500c (you can verify by typing 1/0.00008 separately, which evaluates to 12500).", "Step 4: Finally, type a+b using the c-based expressions: 59c+12500c — Desmos will confirm this combines to 12559c, matching choice D. You can also plug in a specific test value for c (like c=1) to see the numeric results directly: with c=1, a=59 and b=12500, so a+b=12559."]}, {"gi": 6, "domain": "Percentages", "num": 3, "diff": "Hard", "gridin": false, "id": "6feae9c3", "correct": "C", "rule": "Percent increase is always calculated as (the amount of increase) divided by (the ORIGINAL, starting value), then converted to a percentage by multiplying by 100 — never divide by the new/final value.", "tip": "When both the original and new values are given as multiples of the same variable (like t and 3.49t here), the variable will always cancel out completely in the percent-increase calculation — don't be intimidated by having a variable instead of a specific number; just follow the formula exactly as you would with numbers.", "why": "The increase in hours is 3.49t − t = 2.49t. The percent increase is (increase / original) × 100 = (2.49t / t) × 100 = 2.49 × 100 = 249%.", "steps": ["Step 1: Identify the original value (July hours): t.", "Step 2: Identify the new value (August hours): 3.49t.", "Step 3: Calculate the amount of increase: new value − original value = 3.49t − t = 2.49t.", "Step 4: Apply the percent increase formula: (increase / original value) × 100%.", "Step 5: Substitute the values: (2.49t / t) × 100%.", "Step 6: The t in the numerator and denominator cancels out completely: 2.49 × 100% = 249%.", "Step 7: This matches choice C."], "trap": "Choice B (3.49%) is the most commonly picked wrong answer — it mistakes the MULTIPLIER (3.49, representing the NEW total as a multiple of the original) for the percent INCREASE itself, without first subtracting 1 (or subtracting the original amount) to isolate just the increase.", "poe": [{"letter": "A", "text": "2.49% correctly identifies the coefficient of the increase (2.49) but forgets to convert this decimal into a percentage by multiplying by 100 — leaving it 100 times too small."}, {"letter": "B", "text": "3.49% confuses the total NEW amount's multiplier (3.49, meaning August is 3.49 times July) with the percent INCREASE — but a multiplier of 3.49 actually represents a 249% increase (since 3.49 = 1 + 2.49, meaning 100% of the original PLUS a 249% increase), not a 3.49% increase."}, {"letter": "D", "text": "349% incorrectly uses the full multiplier 3.49 converted directly to a percentage (349%) without first subtracting the original 100% (representing the unchanged portion) to isolate just the increase."}], "desmos": ["Step 1: Since this problem involves a variable (t) that cancels out, pick a simple test value to make it concrete — let's use t = 100 (100 hours in July). Step 2: Open Desmos and calculate August's hours: type 3.49*100 — this gives 349 hours in August.", "Step 3: Calculate the increase: type 349-100 — this gives 249 hours of increase.", "Step 4: Calculate the percent increase using the original (July) value as the base: type (249/100)*100 — Desmos will show this evaluates to 249, confirming a 249% increase and matching choice C.", "Step 5: Try this with a different test value for t (like t = 50) to confirm the percentage stays the same regardless of which specific value you pick — this confirms the variable genuinely cancels out in the percent-increase formula."]}, {"gi": 7, "domain": "Percentages", "num": 4, "diff": "Hard", "gridin": true, "id": "98818acf", "correct": "2.31", "rule": "When a quantity increases by p%, the new total is always (100% + p%) of the original — expressed as a decimal multiplier, this is (1 + p/100). Never use just p/100 alone as the multiplier, since that would only represent the AMOUNT of increase, not the new TOTAL.", "tip": "Whenever you see 'increased by X%' and need to find a multiplier that gives you the NEW TOTAL directly (not just the increase amount), always add 1 to X/100 — this combines the original 100% (which is 1, in decimal form) with the X% increase.", "why": "Since the number of audiobooks increased by 131% from last year (n) to this year, the new total is the original 100% PLUS the 131% increase, totaling 231% of the original, or 2.31 as a decimal multiplier. Since this year's count is given as bn, this means b = 2.31.", "steps": ["Step 1: Understand what 'increased by 131%' means: the new amount equals the original amount (100%) PLUS an additional 131% increase, for a total of 100% + 131% = 231%.", "Step 2: Convert 231% into a decimal multiplier: 231/100 = 2.31.", "Step 3: Since the new amount is bn (b times the original n), and we just determined the new amount is 2.31 times the original, this means b = 2.31.", "Step 4: This is a grid-in question — enter 2.31 as your final answer."], "trap": "A common error on this problem is using 1.31 instead of 2.31 — this happens when a student converts 131% directly to a decimal (1.31) without recognizing that this decimal already represents the FULL new total's relationship to the original as an increase multiplier, but forgetting that 'increased BY 131%' means adding this to the original 100%, or alternatively, using just 0.31 or 1.31 by misunderstanding which part represents the total versus just the increase.", "poe": [], "desmos": ["Step 1: Since this problem involves the variable n, pick a simple test value to make it concrete — let's use n = 100 (100 audiobooks last year). Step 2: Open Desmos and calculate the increase amount: type 100*1.31 — this gives 131, representing the SIZE of the increase (131% of 100 is 131 additional audiobooks).", "Step 3: Calculate this year's total by adding the increase to the original: type 100+131 — this gives 231, the total number of audiobooks this year.", "Step 4: Since this year's count is bn, and n = 100, solve for b: type 231/100 — Desmos will show this equals 2.31, confirming b = 2.31 and matching your grid-in answer.", "One-variable data: distributions and measures of center and spread", "4 questions  ·  Easy 1  /  Medium 1  /  Hard 2"]}, {"gi": 8, "domain": "One-variable data: distributions and measures of center and spread", "num": 1, "diff": "Easy", "gridin": true, "id": "559476f4", "correct": "6", "rule": "On a bar graph, the frequency of any specific data value is read directly from the HEIGHT of that value's bar, measured against the vertical (frequency) axis.", "tip": "Trace straight up from the data value you're asked about on the horizontal axis until you hit the top of its bar, then trace straight across (left) to read the exact height on the vertical axis — this two-step 'trace up, then trace across' method prevents misreading a neighboring bar.", "why": "Looking at the bar directly above the data value '2' on the horizontal axis, its height reaches exactly 6 on the frequency (vertical) axis.", "steps": ["Step 1: Locate '2' on the horizontal (data value) axis.", "Step 2: Trace straight up from that point until you reach the top of the bar directly above it.", "Step 3: From the top of that bar, trace straight across (left) to the vertical (frequency) axis to read its height.", "Step 4: The bar for data value 2 reaches a height of 6.", "Step 5: This is a grid-in question — enter 6 as your final answer."], "trap": "A common error on this type of problem is misreading an adjacent bar (like the bar for data value 1, which has height 4, or data value 3, which has height 3) instead of carefully tracing up from exactly '2' on the horizontal axis.", "poe": [], "desmos": ["This is a straightforward graph-reading question that doesn't require Desmos to solve — the answer (6) is read directly from the bar graph provided in the question. However, if you want to double check your reading, you could recreate the bar heights as a list in Desmos (typing the data values 1 through 6 and their corresponding frequencies 4, 6, 3, 8, 5, 9 as a table) and confirm that the frequency listed for data value 2 is indeed 6."]}, {"gi": 9, "domain": "One-variable data: distributions and measures of center and spread", "num": 2, "diff": "Medium", "gridin": false, "id": "d73a67d7", "correct": "D", "rule": "Standard deviation measures how SPREAD OUT a data set is from its mean — a data set with values tightly clustered close together (especially with repeated identical values) will always have a SMALLER standard deviation than one with values spread far apart, even if both sets share the same mean.", "tip": "You don't need to calculate the exact standard deviation for problems like this — just visually compare how 'spread out' or 'clustered together' each list's values are. The list with values closest together (and most repeated identical values) will have the smallest standard deviation.", "why": "List D (53, 54, 54, 54, 55) has values clustered extremely tightly around 54, with three of the five values being EXACTLY 54 — this tight clustering around the mean gives it the smallest spread, and therefore the smallest standard deviation, compared to the other lists.", "steps": ["Step 1: Calculate (or estimate) the mean of each list — notice all four lists happen to have a mean of 54.", "Step 2: Since all means are equal, compare how far each list's individual values deviate from 54 — the list with the SMALLEST deviations overall will have the smallest standard deviation.", "Step 3: List A (51,52,54,56,57): deviations of −3,−2,0,2,3 — fairly spread out.", "Step 4: List B (52,52,54,56,56): deviations of −2,−2,0,2,2 — moderately spread out.", "Step 5: List C (52,53,54,55,56): deviations of −2,−1,0,1,2 — more tightly clustered.", "Step 6: List D (53,54,54,54,55): deviations of −1,0,0,0,1 — extremely tightly clustered, with three values exactly AT the mean.", "Step 7: List D has by far the smallest deviations from the mean, meaning it has the smallest standard deviation.", "Step 8: This matches choice D."], "trap": "Choice C is the most commonly picked wrong answer — its values are evenly and closely spaced (52 through 56, each one apart), which LOOKS tightly clustered, but list D's heavy repetition of the exact mean value (54 appearing three times) actually creates even less spread than C's evenly-spaced-but-still-varying values.", "poe": [{"letter": "A", "text": "List A has the widest range of values (51 to 57, a spread of 6) among all four lists, giving it the LARGEST standard deviation, not the smallest."}, {"letter": "B", "text": "List B has a moderate spread (52 to 56), larger than both C and D — its values aren't as tightly clustered around the mean as list D's."}, {"letter": "C", "text": "List C has evenly spaced values with no repeats, giving it a real but moderate spread — list D's heavy repetition of the exact mean (54 three times) creates even less variability than C's evenly distributed values."}], "desmos": ["Step 1: Open Desmos and enter each list as a set of points to calculate statistics. For list D, type: stdev({53,54,54,54,55})", "Step 2: Press Enter — Desmos will calculate and display the exact standard deviation for this list.", "Step 3: Repeat this same process for lists A, B, and C: stdev({51,52,54,56,57}), stdev({52,52,54,56,56}), and stdev({52,53,54,55,56})", "Step 4: Compare all four calculated standard deviations directly — you'll see list D's value is clearly the smallest of the four, confirming choice D without needing to estimate visually."]}, {"gi": 10, "domain": "One-variable data: distributions and measures of center and spread", "num": 3, "diff": "Hard", "gridin": false, "id": "f6c18a66", "correct": "C", "rule": "The median of a data set is the MIDDLE value when all values are arranged in order (for an odd number of values), or the AVERAGE of the two middle values (for an even number of values). Removing a value that's far from the middle (like an outlier or error) often doesn't change the median at all.", "tip": "When a data set is described using a frequency table (value paired with how many times it occurs), first 'unroll' it into a full ordered list before trying to find the median — this makes it much easier to correctly count to the middle position(s), especially for larger data sets.", "why": "Data set A (11 values, unrolled from the table): 0, 0, 3, 3, 4, 4, 5, 5, 6, 7, 13. With 11 values, the median is the 6th value: counting in order, this is 4. After removing the erroneous 13, data set B (10 values): 0, 0, 3, 3, 4, 4, 5, 5, 6, 7. With 10 values (even), the median is the average of the 5th and 6th values: both are 4, so the median is (4+4)/2 = 4. Since both medians equal 4, they are equal.", "steps": ["Step 1: 'Unroll' the frequency table into a full ordered list for data set A: two 0's, two 3's, two 4's, two 5's, one 6, one 7, one 13 — giving: 0, 0, 3, 3, 4, 4, 5, 5, 6, 7, 13 (11 values total).", "Step 2: Find the median of data set A: with 11 values (an odd number), the median is the middle (6th) value. Counting through the ordered list: 1st=0, 2nd=0, 3rd=3, 4th=3, 5th=4, 6th=4. The median of set A is 4.", "Step 3: Create data set B by removing the erroneous value 13: 0, 0, 3, 3, 4, 4, 5, 5, 6, 7 (10 values total).", "Step 4: Find the median of data set B: with 10 values (an even number), the median is the average of the two middle values (the 5th and 6th). Counting through: 5th=4, 6th=4. The median of set B is (4+4)/2 = 4.", "Step 5: Compare the two medians: both data set A and data set B have a median of 4 — they are EQUAL.", "Step 6: This matches choice C."], "trap": "Choice A is the most commonly picked wrong answer — students sometimes assume that removing the largest value (13) from a data set must automatically lower the median, without actually counting through the ordered list to check whether 13 was anywhere near the middle position in the first place (it wasn't — it was the very last, most extreme value).", "poe": [{"letter": "A", "text": "Removing 13 (the LARGEST value, at the very end of the ordered list) doesn't affect which values sit in the MIDDLE of the data set — the median stays the same, not lower."}, {"letter": "B", "text": "Similarly, there's no reason removing the largest, most extreme value would cause the median to increase — the middle values of the data set are unaffected by removing an extreme outlier."}, {"letter": "D", "text": "Since the data set is fully known and given in the table (not an estimate or a sample), there IS enough information to precisely calculate and compare both medians — this choice incorrectly claims otherwise."}], "desmos": ["Step 1: Open Desmos and enter data set A as a full list based on the frequency table: median({0,0,3,3,4,4,5,5,6,7,13})", "Step 2: Press Enter — Desmos will calculate and display the median, confirming it equals 4.", "Step 3: On the next line, enter data set B (with 13 removed): median({0,0,3,3,4,4,5,5,6,7})", "Step 4: Press Enter — Desmos will show this median is also 4, confirming both medians are equal and verifying choice C."]}, {"gi": 11, "domain": "One-variable data: distributions and measures of center and spread", "num": 4, "diff": "Hard", "gridin": false, "id": "cf2be18d", "correct": "C", "rule": "When a data set has unknown values mixed with known ones, use the GIVEN statistics (mean, median, range) as separate equations — the mean gives you a SUM equation, the median tells you which position (or unknown) sits in the middle, and the range gives you a MAX-MINUS-MIN equation. Solve this small system of equations together.", "tip": "Since the data set is already given in ascending order, use that order to immediately identify which position corresponds to the median (the exact middle value for an odd-count list) — this often directly tells you the value of one of the unknowns without any calculation.", "why": "With 7 values in ascending order (a, 26, 29, b, 31, 47, c), the median is the 4th value, which is b. Since the median is given as 29, this means b = 29. The mean is 36, so the sum of all 7 values is 7 × 36 = 252. Substituting known values: a + 26 + 29 + 29 + 31 + 47 + c = 252, which simplifies to a + c + 162 = 252, so a + c = 90. The range is 72, and since the list is in ascending order, the range equals the largest value minus the smallest: c − a = 72. Now solve the system: a + c = 90 and c − a = 72. Adding these two equations: 2c = 162, so c = 81.", "steps": ["Step 1: Since the 7 values are listed in ascending order (a, 26, 29, b, 31, 47, c), identify the median's position: for 7 values, the median is the 4th (middle) value, which is b.", "Step 2: Since the median is given as 29, set b = 29.", "Step 3: Use the mean to find the sum of all values: mean × count = sum, so 36 × 7 = 252.", "Step 4: Substitute all known values into the sum equation: a + 26 + 29 + 29 + 31 + 47 + c = 252.", "Step 5: Add up the known numbers: 26 + 29 + 29 + 31 + 47 = 162. The equation becomes: a + c + 162 = 252.", "Step 6: Solve for a + c: a + c = 252 − 162 = 90.", "Step 7: Use the range (largest minus smallest): since the list is ascending, the range is c − a = 72.", "Step 8: Now solve this system of two equations: a + c = 90 and c − a = 72. Add both equations together: (a+c) + (c−a) = 90 + 72, which simplifies to 2c = 162.", "Step 9: Divide both sides by 2: c = 81.", "Step 10: This matches choice C."], "trap": "Choice A (54) is the most commonly picked wrong answer — it typically results from solving only one of the two equations (like using just the range equation with an incorrect assumed value for a) without properly setting up and solving the full system using both the mean AND range information together.", "poe": [{"letter": "A", "text": "54 doesn't satisfy both the sum equation (a+c=90) and the range equation (c−a=72) simultaneously — it likely comes from an incomplete calculation using only one piece of given information."}, {"letter": "B", "text": "72 is actually the value of the RANGE itself (given in the problem), not the value of c — a student might mistakenly select the given range number instead of solving for c."}, {"letter": "D", "text": "98 doesn't satisfy the system of equations either — if c = 98, then from c − a = 72, a would be 26, but then a + c = 26 + 98 = 124, which doesn't match the required sum of 90."}], "desmos": ["Step 1: Open Desmos and set up the two equations from the problem as a system. First type: a+c=90", "Step 2: Type the second equation: c-a=72", "Step 3: Desmos will treat these as two lines if you use x and y instead — replace a with x and c with y: x+y=90 and y-x=72", "Step 4: Press Enter after each — Desmos graphs both lines and shows their intersection point when you click on it.", "Step 5: The intersection point will show x = 9 (the value of a) and y = 81 (the value of c), confirming c = 81 and matching choice C.", "Two-variable data: models and scatterplots", "3 questions  ·  Easy 1  /  Medium 2  /  Hard 0"]}, {"gi": 12, "domain": "Two-variable data: models and scatterplots", "num": 1, "diff": "Easy", "gridin": false, "id": "dbd89c59", "correct": "B", "rule": "For an exponential model y = a(b)^x, the constant 'a' (the coefficient out front) represents the STARTING value (the y-intercept, where x = 0), and the base 'b' tells you whether the data is growing (b > 1) or decaying (b < 1). Match both features to the scatterplot's visual pattern.", "tip": "Always check the y-intercept FIRST on an exponential scatterplot — it should closely match the leading coefficient 'a' in the correct equation. Then check whether the data is rising or falling overall to determine if the base should be greater than or less than 1.", "why": "The scatterplot shows data starting at approximately y = 43 when x = 0, and clearly INCREASING (growing) as x increases up to 50. This matches a = 43 (the starting value) and a base greater than 1 with a POSITIVE exponent (1.04)^x, giving y = 43(1.04)^x.", "steps": ["Step 1: Read the y-intercept directly from the scatterplot: the leftmost point (at x = 0) sits at approximately y = 43.", "Step 2: Observe the overall trend of the data: as x increases from 0 to 50, y clearly increases (grows) from about 43 up to nearly 290 — this is GROWTH, not decay.", "Step 3: Match these observations to the exponential model form y = a(b)^x: the starting value a should be approximately 43, and since the data is growing, the exponent should be POSITIVE x (not negative x, which would represent decay).", "Step 4: This matches choice B: y = 43(1.04)^x."], "trap": "Choice A is the most commonly picked wrong answer — it uses the correct starting value (43) but a NEGATIVE exponent (−x), which would actually make the function DECREASE as x increases, contradicting the clearly increasing pattern shown in the scatterplot.", "poe": [{"letter": "A", "text": "The negative exponent (−x) would make this function DECREASE as x increases, but the scatterplot clearly shows the data values GROWING over time — this doesn't match the visual trend."}, {"letter": "C", "text": "Starting at 288 doesn't match the scatterplot's y-intercept, which is clearly close to 43 (the point at x=0), not near 288 — this starting value belongs to a very different curve."}, {"letter": "D", "text": "Similarly, this uses 288 as the starting value, which doesn't match the scatterplot's actual y-intercept of approximately 43 — the growth direction (positive exponent) is correct, but the starting point is wrong."}], "desmos": ["Step 1: Open Desmos and type the candidate equation: y=43(1.04)^x", "Step 2: Press Enter — Desmos graphs this curve.", "Step 3: Compare this graph to the scatterplot given in the question — check that the curve passes close to the plotted points, starting near (0, 43) and rising to approximately (50, 290).", "Step 4: If the curve fits the scattered points well, you've confirmed choice B. You can also try graphing the other choices (like y=288(1.04)^x) to see how poorly they fit the actual data points, reinforcing why B is the best model."]}, {"gi": 13, "domain": "Two-variable data: models and scatterplots", "num": 2, "diff": "Medium", "gridin": false, "id": "b3547a10", "correct": "C", "rule": "The slope of a line of best fit represents the RATE OF CHANGE between the two variables graphed — specifically, how much the DEPENDENT variable (on the y-axis) changes for every one-unit increase in the INDEPENDENT variable (on the x-axis). Always identify which variable is on which axis before interpreting the slope in context.", "tip": "Read the axis labels carefully before interpreting slope — the correct interpretation must have the y-axis variable as the one that 'increases' and the x-axis variable as the one changing 'per' some amount. Answer choices that swap these two roles are testing whether you're reading the graph correctly.", "why": "On this scatterplot, x represents the number of seeds PLANTED, and y represents the number of seeds that GERMINATED. The slope of the line of best fit, estimated from the graph (rising from about (0,30) to (500,310), giving a slope of about 280/500 = 0.56, closest to 60/100 = 0.6), means that for every 100 additional seeds planted, approximately 60 more seeds are predicted to germinate.", "steps": ["Step 1: Identify which variable is on the x-axis (independent/input variable) and which is on the y-axis (dependent/output variable): x = number of seeds planted, y = number of seeds that germinated.", "Step 2: Estimate two points on the line of best fit from the graph: approximately (0, 30) and (500, 310).", "Step 3: Calculate the slope using these two points: slope = (310 − 30) / (500 − 0) = 280/500 = 0.56.", "Step 4: Compare this slope to the answer choices, which are given as 'X seeds per 100 seeds': 0.56 is closest to 60/100 = 0.60.", "Step 5: Since the slope relates y (germinated) to x (planted), the correct interpretation must describe germinated seeds increasing per planted seeds — not the reverse.", "Step 6: This matches choice C: 'The number of seeds that germinate is predicted to increase by 60 seeds for every additional 100 seeds that are planted.'"], "trap": "Choice A is the most commonly picked wrong answer — it has the correct approximate slope value (60 per 100) but describes the WRONG variable as increasing (seeds planted, the independent/x-axis variable, rather than seeds germinated, the dependent/y-axis variable) — this reverses the cause-and-effect direction the slope actually represents.", "poe": [{"letter": "A", "text": "This describes 'seeds planted' as the variable that increases — but seeds planted is the INDEPENDENT variable (x-axis), which the researchers choose directly; it's seeds GERMINATED (y-axis) that responds to and increases with planting, not the reverse."}, {"letter": "B", "text": "This has the same variable-reversal issue as A, plus uses the wrong slope magnitude (300 instead of approximately 60) — doesn't match the graph's actual slope."}, {"letter": "D", "text": "This correctly identifies germinated seeds as the increasing variable but uses the wrong slope magnitude (300 per 100, which would be a much steeper line than what's shown) — the actual slope is closer to 60 per 100, not 300."}], "desmos": ["Step 1: Open Desmos and estimate several points from the scatterplot to check the line of best fit's slope. Type a few points you can read from the graph, like: (100,90), (200,120), (350,215), (450,315)", "Step 2: Desmos will plot these points. To find a best-fit line, click the '+' button and look for a regression feature, or manually type: y1~mx+b and Desmos will calculate the best-fit slope (m) and intercept (b) automatically using linear regression.", "Step 3: Check the calculated slope value — it should be close to 0.56 to 0.6, confirming that for every 100 seeds planted (x), about 60 seeds are predicted to germinate (y), matching choice C's interpretation."]}, {"gi": 14, "domain": "Two-variable data: models and scatterplots", "num": 3, "diff": "Medium", "gridin": false, "id": "70a2776f", "correct": "A", "rule": "To estimate the slope of a line of best fit from a scatterplot, choose two points that appear to represent the OVERALL trend of the data (not just two random points), calculate the slope between them using (change in y) / (change in x), and match this to the closest answer choice.", "tip": "When estimating slope from a scatterplot with a downward trend, pick one point from the far LEFT side of the data and one from the far RIGHT side — using points that are far apart minimizes the impact of any single point's imprecise reading, giving a more reliable slope estimate.", "why": "Using an early point around (15, 22) and a later point around (70, 13), the slope is estimated as (13 − 22) / (70 − 15) = −9/55 ≈ −0.16, which is closest to −0.17 among the answer choices.", "steps": ["Step 1: Choose two points that represent the overall trend of the scattered data — one from early depths and one from later depths. Reading the graph, approximate points are (15, 22) and (70, 13).", "Step 2: Calculate the change in y (temperature): 13 − 22 = −9.", "Step 3: Calculate the change in x (depth): 70 − 15 = 55.", "Step 4: Calculate the slope: −9 / 55 ≈ −0.1636.", "Step 5: Compare this estimated slope to the answer choices: −0.1636 is closest to −0.17.", "Step 6: This matches choice A."], "trap": "Choice B (−2.17) is the most commonly picked wrong answer — it's off by roughly a factor of 10-13 from the correct slope, which can happen if a student misreads the axis scale (for example, confusing gridline spacing) while estimating the change in x or y.", "poe": [{"letter": "B", "text": "−2.17 is far too steep for this data — this magnitude of slope would mean temperature drops over 150 degrees across the full depth range shown, which doesn't match the actual data (which only spans about 22 to 13 degrees)."}, {"letter": "C", "text": "−6.02 is even more drastically too steep — this doesn't match the gentle downward trend visible in the scattered points."}, {"letter": "D", "text": "−8.02 is also far too steep for the gentle decline shown in the data — likely from a significant misreading of the graph's scale or points."}], "desmos": ["Step 1: Open Desmos and enter several points estimated from the scatterplot: (15,22), (20,21), (35,16), (45,17), (50,16), (52,14), (70,13)", "Step 2: Desmos will plot these points. To find the actual best-fit slope, type: y1~mx+b — Desmos will use linear regression to calculate the best-fit values for m (slope) and b (intercept) automatically.", "Step 3: Check the calculated value of m — it should be close to −0.17, confirming your estimate and matching choice A.", "Probability and conditional probability", "2 questions  ·  Easy 0  /  Medium 0  /  Hard 2"]}, {"gi": 15, "domain": "Probability and conditional probability", "num": 1, "diff": "Hard", "gridin": true, "id": "89ff6a0a", "correct": "62/65", "rule": "For conditional probability problems presented in a table ('probability of X given Y'), first identify and total ONLY the rows/columns that satisfy the GIVEN condition (the 'given that' part), then find what fraction of that reduced total also satisfies the main event being asked about.", "tip": "Physically cross out or ignore any table cells that DON'T meet the 'given that' condition before calculating anything — this prevents accidentally including irrelevant data in either your numerator or denominator.", "why": "'Given that it is NOT in group 2' means we only consider Group 1 and Group 3 (ignoring Group 2 entirely). Group 1 total: 12+8+3 = 23. Group 3 total: 10+32+0 = 42. Combined total (not group 2): 23+42 = 65. Within this reduced group, 'diameter ≤ 30mm' means the 'less than 20' and '20 to 30' columns: Group 1: 12+8=20; Group 3: 10+32=42. Combined: 20+42 = 62. The probability is 62/65.", "steps": ["Step 1: Identify the condition ('given that it is NOT in group 2'): this means we only look at Group 1 and Group 3 rows, completely ignoring Group 2.", "Step 2: Calculate the total number of buttons in Group 1: 12 + 8 + 3 = 23.", "Step 3: Calculate the total number of buttons in Group 3: 10 + 32 + 0 = 42.", "Step 4: Calculate the combined total for 'not in group 2': 23 + 42 = 65. This is our new denominator.", "Step 5: Now find how many of these 65 buttons have a diameter ≤ 30mm — this means the 'Less than 20' AND '20 to 30' columns (both are ≤ 30mm), but NOT the 'Greater than 30' column.", "Step 6: From Group 1: 'Less than 20' = 12, '20 to 30' = 8. Sum: 12 + 8 = 20.", "Step 7: From Group 3: 'Less than 20' = 10, '20 to 30' = 32. Sum: 10 + 32 = 42.", "Step 8: Combine these: 20 + 42 = 62. This is our numerator.", "Step 9: The probability is 62/65 (this fraction cannot be simplified further, since 62 = 2×31 and 65 = 5×13 share no common factors).", "Step 10: This is a grid-in question — enter 62/65 (or its decimal equivalent, approximately 0.954) as your final answer."], "trap": "A common error on this problem is using the TOTAL of all 100 buttons as the denominator (instead of just the 65 buttons that are 'not in group 2'), which incorrectly calculates a regular probability instead of the required CONDITIONAL probability.", "poe": [], "desmos": ["Step 1: Open Desmos as a calculator to organize this conditional probability calculation. Type: 12+8+3 to confirm Group 1's total is 23.", "Step 2: Type: 10+32+0 to confirm Group 3's total is 42.", "Step 3: Type: 23+42 to confirm the 'not group 2' total is 65 (your denominator).", "Step 4: Type: 12+8+10+32 to confirm the count with diameter ≤ 30mm within 'not group 2' is 62 (your numerator).", "Step 5: Type: 62/65 — Desmos will show this as approximately 0.9538, confirming your fraction and allowing you to enter either 62/65 or the decimal into the grid-in box."]}, {"gi": 16, "domain": "Probability and conditional probability", "num": 2, "diff": "Hard", "gridin": false, "id": "f496d2c0", "correct": "B", "rule": "For conditional probability problems with percentages, first add up ONLY the percentages that satisfy the GIVEN condition to find the new total, then divide the specific percentage you're looking for by this new (reduced) total — not by 100%.", "tip": "Rewrite the 'given that' condition as its own smaller, self-contained group first — add up just the relevant percentages to get a new 'whole' for that group, then calculate the requested probability as a fraction of THAT smaller whole, not the original 100%.", "why": "'Given that the room has a seating capacity of at least 18 seats' means combining the '18–40 seats,' '41–65 seats,' and 'greater than 65 seats' categories: 21% + 29% + 24% = 74%. Within this 74% group, the probability of 'greater than 65 seats' is 24% ÷ 74% ≈ 0.3243, which rounds to approximately 0.32.", "steps": ["Step 1: Identify the given condition: 'seating capacity of at least 18 seats' — this includes the '18–40 seats,' '41–65 seats,' and 'greater than 65 seats' categories (everything except 'less than 18 seats').", "Step 2: Add up the percentages for these three categories to find the new total: 21% + 29% + 24% = 74%.", "Step 3: Identify what we're looking for within this reduced group: rooms with 'greater than 65 seats,' which is 24%.", "Step 4: Calculate the conditional probability by dividing the specific percentage by the new total: 24% / 74% ≈ 0.3243.", "Step 5: Rounding to match the answer choices, this is closest to 0.32.", "Step 6: This matches choice B."], "trap": "Choice A (0.24) is the most commonly picked wrong answer — it uses the original 24% directly as the answer, forgetting to divide by the reduced total (74%) that accounts for the     var pct = Math.round(100*p.correct/p.total);
    return "<div class=\"score-hero\"><div class=\"num mono\">"+p.correct+"/"+p.total+"</div><div class=\"lbl\">"+escapeHtml(p.d.domain)+" — "+pct+"% correct</div></div>"+
      "<button class=\"btn primary\" onclick=\"startGeoQuiz('"+p.d.key+"')\">Try Again</button>"+
      "<div style=\"height:10px;\"></div>"+
      "<button class=\"btn ghost\" onclick=\"openMathTheoryTopic('geometry-trigonometry')\">Back to Geometry & Trigonometry</button>";
  }
  window.openTopic = function(key){
    var topic = ENGLISH_TOPICS.filter(function(x){return x.key===key;})[0];
    go("topic", {topic:topic});
  };

  function diffCounts(qs){
    var c = {Easy:0, Medium:0, Hard:0};
    qs.forEach(function(q){ c[q.diff] = (c[q.diff]||0)+1; });
    return c;
  }

  function screenTopic(topic){
    var qs = topicQuestions(topic.domain);
    var c = diffCounts(qs);
    return "<div class=\"card\" style=\"position:relative;\">"+
      "<div class=\"subject-strip\" style=\"background:var(--english);\"></div>"+
      "<p class=\"eyebrow\" style=\"color:var(--english);\">"+topic.icon+" "+escapeHtml(topic.label)+"</p>"+
      "<p style=\"font-size:14px; color:var(--muted); margin:0 0 14px;\">"+escapeHtml(topic.desc)+"</p>"+
      "<div style=\"display:flex; gap:8px; flex-wrap:wrap; margin-bottom:6px;\">"+
        "<span class=\"badge easy\">"+c.Easy+" Easy</span>"+
        "<span class=\"badge medium\">"+c.Medium+" Medium</span>"+
        "<span class=\"badge hard\">"+c.Hard+" Hard</span>"+
      "</div>"+
      "</div>"+
      "<button class=\"btn primary\" onclick=\"startQuiz('"+topic.key+"')\">Start — "+qs.length+" Questions →</button>";
  }

  window.startQuiz = function(topicKey){
    var topic = ENGLISH_TOPICS.filter(function(x){return x.key===topicKey;})[0];
    var qs = topicQuestions(topic.domain);
    go("quiz", {topic:topic, qs:qs, i:0, correct:0, picked:null});
  };

  function screenQuiz(p){
    var item = p.qs[p.i];
    var letters = ["A","B","C","D"];
    var dots = p.qs.map(function(_,idx){ return "<span class=\""+(idx<p.i?"done":idx===p.i?"current":"")+"\"></span>"; }).join("");
    var diffClass = item.diff.toLowerCase();
    var choicesHtml = item.choices.map(function(c,idx){
      var cls = "choice";
      if(p.picked!==null){
        if(idx===item.correct) cls+=" correct"; else if(idx===p.picked) cls+=" incorrect";
      }
      return "<button class=\""+cls+"\" "+(p.picked!==null?"disabled":"")+" onclick=\"quizPick("+idx+")\"><span class=\"letter\">"+letters[idx]+"</span><span>"+escapeHtml(c)+"</span></button>";
    }).join("");
    var explainHtml = "";
    if(p.picked!==null){
      var ok = p.picked===item.correct;
      var poeHtml = item.poe.map(function(poe){
        return "<div class=\"poe-item\">✗ <b class=\"mono\">"+letters[poe.idx]+"</b> — "+escapeHtml(poe.text)+"</div>";
      }).join("");
      explainHtml = "<div class=\"explain-panel\">"+
        "<div class=\"row2\"><span class=\"verdict "+(ok?"ok":"no")+"\">"+(ok?"✓ Correct":"✗ Not quite — correct answer: "+letters[item.correct])+"</span><span class=\"badge "+diffClass+"\">"+item.diff+"</span></div>"+
        "<div class=\"explain-block\"><b>The Rule</b>"+escapeHtml(item.rule)+"</div>"+
        "<div class=\"explain-block\"><b>The Tip</b>"+escapeHtml(item.tip)+"</div>"+
        "<div class=\"explain-block\"><b>Why "+letters[item.correct]+" is right</b>"+escapeHtml(item.why)+"</div>"+
        "<div class=\"explain-block\"><b>The Trap</b>"+escapeHtml(item.trap)+"</div>"+
        "<div class=\"explain-block\"><b>POE — the other three</b>"+poeHtml+"</div>"+
        "</div>";
    }
    return "<p class=\"eyebrow\" style=\"color:var(--english);\">"+escapeHtml(p.topic.label)+" · Question "+(p.i+1)+" of "+p.qs.length+" <span class=\"badge "+diffClass+"\" style=\"margin-left:6px;\">"+item.diff+"</span></p>"+
      "<div class=\"progress-dots\">"+dots+"</div>"+
      "<p class=\"qstem\">"+escapeHtml(item.stem)+"</p>"+
      choicesHtml + explainHtml +
      (p.picked!==null ? "<button class=\"btn primary\" onclick=\"quizNext()\">"+(p.i===p.qs.length-1?"See Results":"Next →")+"</button>" : "");
  }

  window.quizPick = function(idx){
    var p = top().params;
    if(p.picked!==null) return;
    p.picked = idx;
    if(idx===p.qs[p.i].correct) p.correct++;
    render();
  };
  window.quizNext = function(){
    var p = top().params;
    if(p.i+1 >= p.qs.length){
      go("quizresult", {topic:p.topic, correct:p.correct, total:p.qs.length});
      return;
    }
    p.i++; p.picked = null;
    render();
  };

  function screenQuizResult(p){
    var pct = Math.round(100*p.correct/p.total);
    return "<div class=\"score-hero\"><div class=\"num mono\">"+p.correct+"/"+p.total+"</div><div class=\"lbl\">"+escapeHtml(p.topic.label)+" — "+pct+"% correct</div></div>"+
      "<button class=\"btn primary\" onclick=\"startQuiz('"+p.topic.key+"')\">Try Again</button>"+
      "<div style=\"height:10px;\"></div>"+
      "<button class=\"btn ghost\" onclick=\"go('englishsub',{key:'practice'})\">Back to Practice</button>";
  }

  /* ---------------- BOOT ---------------- */

  function boot(){
    state.nav = [{screen:"signin"}];
    render();
  }

  if(window.claude && window.claude.hot){
    window.claude.hot.ready ? window.claude.hot.ready(boot) : boot();
  } else {
    boot();
  }
})();
</script>
